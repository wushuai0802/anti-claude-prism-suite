name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify syntax, zero dependencies, tag/changelog parity, and run tests
        run: |
          node --check install.mjs
          node --check uninstall.mjs
          node --check plugin/server/index.mjs
          node --check plugin-cua/server/index.mjs
          node --check extensions/chrome-cua-bridge/background.js
          node --check extensions/chrome-cua-bridge/content-agent.js
          node --check extensions/chrome-cua-bridge/popup.js
          node -e "const p=require('./package.json'); if(p.dependencies && Object.keys(p.dependencies).length) throw new Error('Must keep zero runtime npm dependencies');"
          node -e "if((process.env.GITHUB_REF||'').startsWith('refs/tags/')){const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8')).version;const tag=(process.env.GITHUB_REF_NAME||'').replace(/^v/i,'');if(pkg!==tag) throw new Error('Tag '+tag+' != package.json '+pkg);const cl=fs.readFileSync('CHANGELOG.md','utf8');if(!new RegExp('^## '+tag.replace(/\./g,'\\.')+'(?:\\s|$)','m').test(cl)) throw new Error('CHANGELOG.md missing section for '+tag);}"
          npm test

      - name: Build Windows 1-Click GUI Installer (.exe) and Verified Source Tarball
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-win-exe.ps1 -OutDir dist
          if ($LASTEXITCODE -ne 0) { throw "build-win-exe.ps1 failed ($LASTEXITCODE)" }
          $ver = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tarPath = "dist\Anti-Claude-Prism-Suite-Source.tar.gz"
          $tarShaPath = "$tarPath.sha256"
          git archive --format=tar.gz --prefix="anti-claude-prism-suite-v$ver/" HEAD -o $tarPath
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $tarPath)) { throw "Failed to package source tarball" }
          $tarHash = (Get-FileHash -LiteralPath $tarPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText($tarShaPath, "$tarHash  Anti-Claude-Prism-Suite-Source.tar.gz`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Smoke test Windows installer CLI (install / in-place update / uninstall)
        shell: powershell
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP ("prism-exe-smoke-" + [Guid]::NewGuid().ToString("N"))
          $userDir = Join-Path $tmp "user"
          $pluginsDir = Join-Path $tmp "plugins"
          $exe = "dist\Anti-Claude-Prism-Suite-Setup.exe"
          $p1 = Start-Process -FilePath $exe -ArgumentList @("--silent-install", "--no-wsl", "--test-user-dir=$userDir", "--test-plugins-dir=$pluginsDir") -Wait -PassThru
          if ($p1.ExitCode -ne 0) { throw "Silent install failed: $($p1.ExitCode)" }
          if (-not (Test-Path (Join-Path $userDir "extensions\prism-suite.js"))) { throw "Missing prism-suite.js" }
          if (-not (Test-Path (Join-Path $userDir "extensions\prism-suite.css"))) { throw "Missing prism-suite.css" }
          if (-not (Test-Path (Join-Path $tmp "prism-suite\chrome-bridge\manifest.json"))) { throw "Missing chrome-bridge\manifest.json" }
          if (-not (Test-Path (Join-Path $pluginsDir "prism-files\plugin.json"))) { throw "Missing prism-files\plugin.json" }
          if (-not (Test-Path (Join-Path $pluginsDir "prism-cua\plugin.json"))) { throw "Missing prism-cua\plugin.json" }
          # Verify second in-place update prunes stale leftover files cleanly across both plugins
          $stalePath = Join-Path $pluginsDir "prism-files\obsolete-stale-check.tmp"
          $staleCuaPath = Join-Path $pluginsDir "prism-cua\obsolete-stale-cua.tmp"
          New-Item -ItemType File -Path $stalePath -Force | Out-Null
          New-Item -ItemType File -Path $staleCuaPath -Force | Out-Null
          $pUpdate = Start-Process -FilePath $exe -ArgumentList @("--silent-install", "--no-wsl", "--test-user-dir=$userDir", "--test-plugins-dir=$pluginsDir") -Wait -PassThru
          if ($pUpdate.ExitCode -ne 0) { throw "Silent in-place update failed: $($pUpdate.ExitCode)" }
          if (Test-Path $stalePath) { throw "In-place update failed to prune stale prism-files file" }
          if (Test-Path $staleCuaPath) { throw "In-place update failed to prune stale prism-cua file" }
          if (-not (Test-Path (Join-Path $pluginsDir "prism-files\server\relaunch-client.mjs"))) { throw "Missing relaunch-client.mjs after update" }
          $p2 = Start-Process -FilePath $exe -ArgumentList @("--silent-uninstall", "--no-wsl", "--test-user-dir=$userDir", "--test-plugins-dir=$pluginsDir") -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "Silent uninstall failed: $($p2.ExitCode)" }
          if (Test-Path (Join-Path $userDir "extensions\prism-suite.js")) { throw "prism-suite.js was not removed" }
          if (Test-Path (Join-Path $tmp "prism-suite\chrome-bridge")) { throw "chrome-bridge was not removed" }
          if (Test-Path (Join-Path $pluginsDir "prism-files")) { throw "prism-files was not removed" }
          if (Test-Path (Join-Path $pluginsDir "prism-cua")) { throw "prism-cua was not removed" }
          Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/Anti-Claude-Prism-Suite-Setup.exe
            dist/Anti-Claude-Prism-Suite-Setup.exe.sha256
            dist/Anti-Claude-Prism-Suite-Source.tar.gz
            dist/Anti-Claude-Prism-Suite-Source.tar.gz.sha256

      - name: Extract Chinese changelog section for Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const tag=(process.env.GITHUB_REF_NAME||'').replace(/^v/i,'');const sec=fs.readFileSync('CHANGELOG.md','utf8').split(/^## /m).find(s=>s.startsWith(tag+' ')||s.startsWith(tag+'\r')||s.startsWith(tag+'\n'));const body=sec?sec.split(/\r?\n/).slice(1).join('\n').trim():'Anti-Claude Prism Suite '+process.env.GITHUB_REF_NAME;fs.mkdirSync('dist',{recursive:true});fs.writeFileSync('dist/release-notes.md',body+'\n','utf8');"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release-notes.md
          generate_release_notes: true
          files: |
            dist/Anti-Claude-Prism-Suite-Setup.exe
            dist/Anti-Claude-Prism-Suite-Setup.exe.sha256
            dist/Anti-Claude-Prism-Suite-Source.tar.gz
            dist/Anti-Claude-Prism-Suite-Source.tar.gz.sha256
