name: Upstream Radar Watch

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      force_issue:
        description: 'Even if only LOW updates exist, create/update tracking issue'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Upstream Radar (Selective Adoption)
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-upstream.mjs --force --json --markdown > radar-output.json
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("radar-output.json", "utf8"));
            const sanitizeCommitMsg = (msg) => String(msg || "")
              .replace(/`/g, "ˋ")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/@(?!\u200B)/g, "@\u200B")
              .replace(/\u200B?#(\d)/g, "\u200B#$1");
            let md = String(data.markdown || "");
            const rawTexts = new Set();
            for (const r of (data.results || [])) {
              for (const list of [r.commits, r.compatFixes, r.featureCandidates]) {
                for (const c of (list || [])) {
                  if (c && typeof c.message === "string" && c.message) rawTexts.add(c.message);
                  if (c && typeof c.summaryZh === "string" && c.summaryZh) rawTexts.add(c.summaryZh);
                }
              }
              for (const h of (r.zhReleaseHighlights || [])) {
                if (typeof h === "string" && h) rawTexts.add(h);
              }
            }
            for (const raw of Array.from(rawTexts).sort((a, b) => b.length - a.length)) {
              const safe = sanitizeCommitMsg(raw);
              if (safe !== raw) md = md.split(raw).join(safe);
            }
            fs.writeFileSync("radar-report.md", md);
            const high = Number(data.summary?.high || 0);
            const med = Number(data.summary?.medium || 0);
            const low = Number(data.summary?.low || 0);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `high=${high}\nmedium=${med}\nlow=${low}\n`);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            }
          '

      - name: Create or update single upstream-watch Issue when HIGH or MEDIUM found
        if: steps.check.outputs.high > 0 || steps.check.outputs.medium > 0 || github.event.inputs.force_issue == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const rawBody = fs.readFileSync('radar-report.md', 'utf8');
            const sanitizeLineOutsideCode = (line) => {
              const bqMatch = line.match(/^(\s*>+\s?)(.*)$/);
              const prefix = bqMatch ? bqMatch[1] : '';
              const rest = bqMatch ? bqMatch[2] : line;
              const escaped = rest
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/@(?!\u200B)/g, '@\u200B')
                .replace(/\u200B?#(\d)/g, '\u200B#$1');
              return prefix + escaped;
            };
            const sanitizeSegment = (seg) => seg
              .split('\n')
              .map(sanitizeLineOutsideCode)
              .join('\n');
            const safeBody = rawBody
              .split(/(```[\s\S]*?```|`[^`\n]+`)/g)
              .map((part, idx) => {
                if (idx % 2 === 1) {
                  if (part.startsWith('```')) return part;
                  const inner = part.slice(1, -1)
                    .replace(/`/g, 'ˋ')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/@(?!\u200B)/g, '@\u200B')
                    .replace(/\u200B?#(\d)/g, '\u200B#$1');
                  return `\`${inner}\``;
                }
                return sanitizeSegment(part);
              })
              .join('');
            const MAX_ISSUE_CHARS = 60000;
            let body = safeBody;
            if (safeBody.length > MAX_ISSUE_CHARS) {
              let cut = MAX_ISSUE_CHARS;
              const code = safeBody.charCodeAt(cut - 1);
              if (code >= 0xd800 && code <= 0xdbff) cut -= 1;
              let prefix = safeBody.slice(0, cut);
              if (((prefix.match(/```/g) || []).length % 2) === 1) prefix += '\n```';
              body = prefix + '\n\n> ⚠️ 报告内容超过 GitHub Issue 长度限制，已自动截断；完整结果请见本次 Actions Summary。';
            }
            const labelName = 'upstream-watch';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: '0e8a16',
                description: 'Selective upstream compatibility & feature candidates'
              });
            } catch (_) {}
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labelName,
              per_page: 5
            });
            const title = '[Upstream Radar] 上游更新候选评估清单（择优吸收 · 由人工决定是否融合）';
            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                title,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [labelName]
              });
            }
