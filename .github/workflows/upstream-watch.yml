name: Upstream Radar Watch

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      force_issue:
        description: 'Even if only LOW updates exist, create/update tracking issue'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Upstream Radar (Selective Adoption)
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-upstream.mjs --force --json --markdown > radar-output.json
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("radar-output.json", "utf8"));
            fs.writeFileSync("radar-report.md", data.markdown || "");
            const high = Number(data.summary?.high || 0);
            const med = Number(data.summary?.medium || 0);
            const low = Number(data.summary?.low || 0);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `high=${high}\nmedium=${med}\nlow=${low}\n`);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, data.markdown || "");
            }
          '

      - name: Create or update single upstream-watch Issue when HIGH or MEDIUM found
        if: steps.check.outputs.high > 0 || steps.check.outputs.medium > 0 || github.event.inputs.force_issue == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const rawBody = fs.readFileSync('radar-report.md', 'utf8');
            const sanitizeSegment = (seg) => seg
              .replace(/(^|[^A-Za-z0-9_`@/])@([A-Za-z0-9][A-Za-z0-9-]{0,38})/g, '$1`@$2`')
              .replace(/<(\/?(?:script|iframe|img|svg|object|embed|form|input|meta|link|style)[^>]*)>/gi, '&lt;$1&gt;');
            const safeBody = rawBody
              .split(/(```[\s\S]*?```|`[^`\n]+`)/g)
              .map((part, idx) => (idx % 2 === 1 ? part : sanitizeSegment(part)))
              .join('');
            const MAX_ISSUE_CHARS = 60000;
            let body = safeBody;
            if (safeBody.length > MAX_ISSUE_CHARS) {
              let cut = MAX_ISSUE_CHARS;
              const code = safeBody.charCodeAt(cut - 1);
              if (code >= 0xd800 && code <= 0xdbff) cut -= 1;
              let prefix = safeBody.slice(0, cut);
              if (((prefix.match(/```/g) || []).length % 2) === 1) prefix += '\n```';
              body = prefix + '\n\n> ⚠️ 报告内容超过 GitHub Issue 长度限制，已自动截断；完整结果请见本次 Actions Summary。';
            }
            const labelName = 'upstream-watch';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: '0e8a16',
                description: 'Selective upstream compatibility & feature candidates'
              });
            } catch (_) {}
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labelName,
              per_page: 5
            });
            const title = '[Upstream Radar] 上游更新候选评估清单（择优吸收 · 由人工决定是否融合）';
            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                title,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [labelName]
              });
            }
