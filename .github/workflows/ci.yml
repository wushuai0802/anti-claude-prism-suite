name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify zero runtime dependencies & version parity
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies && Object.keys(p.dependencies).length) throw new Error('Must keep zero runtime npm dependencies');"
          node scripts/sync-version.mjs --check

      - name: Run automated test suite
        run: npm test

      - name: Compile Windows native CUA & Installer binaries (Windows only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-win-exe.ps1 -OutDir dist
          if ($LASTEXITCODE -ne 0) { throw "build-win-exe.ps1 failed ($LASTEXITCODE)" }
          git diff --exit-code
