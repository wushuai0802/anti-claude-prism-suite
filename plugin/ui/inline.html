<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism 文件卡片</title>
  <style>
    :root {
      --p-bg: #ffffff;
      --p-bg-subtle: #f8fafc;
      --p-bg-hover: #f1f5f9;
      --p-bg-active: #e2e8f0;
      --p-text: #0f172a;
      --p-text-secondary: #475569;
      --p-text-muted: #64748b;
      --p-border: rgba(15, 23, 42, 0.1);
      --p-border-strong: rgba(15, 23, 42, 0.18);
      --p-accent: #2563eb;
      --p-accent-soft: color-mix(in srgb, var(--p-accent) 11%, transparent);
      --p-danger: #dc2626;
      --p-danger-soft: rgba(220, 38, 38, 0.1);
      --p-success: #059669;
      --p-success-soft: rgba(5, 150, 105, 0.11);
      --p-success-border: rgba(5, 150, 105, 0.32);
      --p-row-hover-glow: color-mix(in srgb, var(--p-accent) 6%, transparent);
      --p-toast-bg: #0f172a;
      --p-toast-text: #f8fafc;
      --p-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
      --p-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --p-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --p-bg: #14171c;
        --p-bg-subtle: #1b1f26;
        --p-bg-hover: #232831;
        --p-bg-active: #2c333f;
        --p-text: #f1f5f9;
        --p-text-secondary: #cbd5e1;
        --p-text-muted: #94a3b8;
        --p-border: rgba(248, 250, 252, 0.1);
        --p-border-strong: rgba(248, 250, 252, 0.2);
        --p-accent: #60a5fa;
        --p-accent-soft: rgba(96, 165, 250, 0.16);
        --p-danger: #f87171;
        --p-danger-soft: rgba(248, 113, 113, 0.16);
        --p-success: #34d399;
        --p-success-soft: rgba(52, 211, 153, 0.15);
        --p-success-border: rgba(52, 211, 153, 0.36);
        --p-row-hover-glow: rgba(96, 165, 250, 0.07);
        --p-toast-bg: #e2e8f0;
        --p-toast-text: #0f172a;
        --p-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --p-bg: #14171c;
      --p-bg-subtle: #1b1f26;
      --p-bg-hover: #232831;
      --p-bg-active: #2c333f;
      --p-text: #f1f5f9;
      --p-text-secondary: #cbd5e1;
      --p-text-muted: #94a3b8;
      --p-border: rgba(248, 250, 252, 0.1);
      --p-border-strong: rgba(248, 250, 252, 0.2);
      --p-accent: #60a5fa;
      --p-accent-soft: rgba(96, 165, 250, 0.16);
      --p-danger: #f87171;
      --p-danger-soft: rgba(248, 113, 113, 0.16);
      --p-success: #34d399;
      --p-success-soft: rgba(52, 211, 153, 0.15);
      --p-success-border: rgba(52, 211, 153, 0.36);
      --p-row-hover-glow: rgba(96, 165, 250, 0.07);
      --p-toast-bg: #e2e8f0;
      --p-toast-text: #0f172a;
      --p-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: auto;
      min-height: 0;
      background: transparent;
      color: var(--color-text-primary, var(--p-text));
      font-family: var(--font-sans, var(--p-font-sans));
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .card {
      display: flex;
      flex-direction: column;
      max-height: 776px;
      background: var(--color-background-primary, var(--p-bg));
      border: 1px solid var(--color-border-primary, var(--p-border-strong));
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      font-variant-numeric: tabular-nums;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      background: var(--color-background-secondary, var(--p-bg-subtle));
      border-bottom: 1px solid var(--color-border-primary, var(--p-border));
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-primary, var(--p-text));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--color-text-secondary, var(--p-text-secondary));
      background: var(--color-background-tertiary, var(--p-bg-hover));
      border: 1px solid var(--color-border-secondary, var(--p-border));
      flex-shrink: 0;
    }

    .header-hint {
      font-size: 11px;
      color: var(--color-text-tertiary, var(--p-text-muted));
      white-space: nowrap;
      flex-shrink: 0;
    }

    .file-list {
      list-style: none;
      margin: 0;
      padding: 4px;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1 1 auto;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 7px;
      cursor: default;
      user-select: none;
      border: 1px solid transparent;
      transition: background-color 150ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .file-row + .file-row {
      margin-top: 2px;
    }

    .file-row:hover,
    .file-row:focus-visible {
      background: linear-gradient(90deg, var(--p-row-hover-glow), transparent 65%),
                  var(--color-background-secondary, var(--p-bg-hover));
      border-color: color-mix(in srgb, var(--color-accent, var(--p-accent)) 22%, var(--color-border-secondary, var(--p-border)));
      outline: none;
    }

    .file-row.is-missing {
      opacity: 0.65;
    }

    .kind-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--color-background-secondary, var(--p-bg-subtle));
      border: 1px solid var(--color-border-secondary, var(--p-border));
    }

    .kind-icon svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .kind-dir { color: #d97706; background: rgba(217, 119, 6, 0.11); }
    .kind-code { color: #2563eb; background: rgba(37, 99, 235, 0.11); }
    .kind-markdown { color: #0891b2; background: rgba(8, 145, 178, 0.11); }
    .kind-image { color: #059669; background: rgba(5, 150, 105, 0.11); }
    .kind-pdf { color: #e11d48; background: rgba(225, 29, 72, 0.11); }
    .kind-office { color: #4f46e5; background: rgba(79, 70, 229, 0.11); }
    .kind-archive { color: #b45309; background: rgba(180, 83, 9, 0.11); }
    .kind-file { color: var(--color-text-secondary, var(--p-text-muted)); }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .kind-dir { color: #fbbf24; background: rgba(251, 191, 36, 0.15); }
      :root:not([data-theme="light"]) .kind-code { color: #60a5fa; background: rgba(96, 165, 250, 0.15); }
      :root:not([data-theme="light"]) .kind-markdown { color: #22d3ee; background: rgba(34, 211, 238, 0.15); }
      :root:not([data-theme="light"]) .kind-image { color: #34d399; background: rgba(52, 211, 153, 0.15); }
      :root:not([data-theme="light"]) .kind-pdf { color: #fb7185; background: rgba(251, 113, 133, 0.15); }
      :root:not([data-theme="light"]) .kind-office { color: #818cf8; background: rgba(129, 140, 248, 0.16); }
      :root:not([data-theme="light"]) .kind-archive { color: #f59e0b; background: rgba(245, 158, 11, 0.15); }
    }

    :root[data-theme="dark"] .kind-dir { color: #fbbf24; background: rgba(251, 191, 36, 0.15); }
    :root[data-theme="dark"] .kind-code { color: #60a5fa; background: rgba(96, 165, 250, 0.15); }
    :root[data-theme="dark"] .kind-markdown { color: #22d3ee; background: rgba(34, 211, 238, 0.15); }
    :root[data-theme="dark"] .kind-image { color: #34d399; background: rgba(52, 211, 153, 0.15); }
    :root[data-theme="dark"] .kind-pdf { color: #fb7185; background: rgba(251, 113, 133, 0.15); }
    :root[data-theme="dark"] .kind-office { color: #818cf8; background: rgba(129, 140, 248, 0.16); }
    :root[data-theme="dark"] .kind-archive { color: #f59e0b; background: rgba(245, 158, 11, 0.15); }

    .file-meta {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .file-name-line {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .file-name {
      font-weight: 550;
      color: var(--color-text-primary, var(--p-text));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .missing-tag {
      font-size: 10px;
      padding: 0 5px;
      border-radius: 4px;
      color: var(--p-danger);
      background: var(--p-danger-soft);
      flex-shrink: 0;
    }

    .file-path {
      font-size: 11px;
      font-family: var(--font-mono, var(--p-font-mono));
      color: var(--color-text-tertiary, var(--p-text-muted));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      color: var(--color-text-secondary, var(--p-text-muted));
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 54px;
      text-align: right;
    }

    .row-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      opacity: 0.78;
      transition: opacity 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .file-row:hover .row-actions,
    .file-row:focus-within .row-actions {
      opacity: 1;
    }

    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      border: 1px solid var(--color-border-primary, var(--p-border));
      background: var(--color-background-primary, var(--p-bg));
      color: var(--color-text-secondary, var(--p-text-secondary));
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      padding: 0 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 150ms cubic-bezier(0.22, 1, 0.36, 1),
                  color 150ms cubic-bezier(0.22, 1, 0.36, 1),
                  transform 140ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn .label-short {
      display: none;
    }

    .btn:hover:not(:disabled) {
      background: var(--color-background-tertiary, var(--p-bg-active));
      border-color: var(--p-border-strong);
      color: var(--color-text-primary, var(--p-text));
    }

    .btn.is-copied,
    .btn.is-copied:hover:not(:disabled) {
      color: var(--p-success);
      background: var(--p-success-soft);
      border-color: var(--p-success-border);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    @keyframes pMenuIn {
      from {
        opacity: 0;
        transform: translateY(-4px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .btn:focus-visible {
      outline: 2px solid var(--color-accent, var(--p-accent));
      outline-offset: 1px;
    }

    .btn-primary {
      color: var(--color-accent, var(--p-accent));
      background: var(--p-accent-soft);
      border-color: transparent;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--p-accent-soft);
      border-color: var(--color-accent, var(--p-accent));
      color: var(--color-accent, var(--p-accent));
    }

    .btn[hidden] {
      display: none;
    }

    .empty-state {
      padding: 20px 14px;
      text-align: center;
      font-size: 12.5px;
      color: var(--color-text-tertiary, var(--p-text-muted));
    }

    .open-with-menu {
      position: fixed;
      z-index: 30;
      min-width: 170px;
      max-width: 230px;
      max-height: 220px;
      overflow-y: auto;
      padding: 4px;
      border-radius: 8px;
      background: var(--color-background-primary, var(--p-bg));
      border: 1px solid var(--color-border-primary, var(--p-border-strong));
      box-shadow: var(--p-shadow);
      transform-origin: top right;
      animation: pMenuIn 130ms cubic-bezier(0.22, 1, 0.36, 1) 1;
    }

    .open-with-group-label {
      padding: 4px 8px 2px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--color-text-tertiary, var(--p-text-muted));
      user-select: none;
    }

    .open-with-item {
      appearance: none;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--color-text-primary, var(--p-text));
      font-family: inherit;
      font-size: 12px;
      text-align: left;
      padding: 6px 8px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .open-with-item:hover,
    .open-with-item:focus-visible {
      background: var(--color-background-tertiary, var(--p-bg-hover));
      outline: none;
    }

    .open-with-item-tag {
      font-size: 10px;
      color: var(--color-text-tertiary, var(--p-text-muted));
      flex-shrink: 0;
    }

    .open-with-empty {
      padding: 8px 10px;
      font-size: 11.5px;
      color: var(--color-text-tertiary, var(--p-text-muted));
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 10px;
      bottom: 10px;
      z-index: 20;
      max-width: calc(100vw - 20px);
      padding: 6px 11px;
      border-radius: 7px;
      background: var(--p-toast-bg);
      color: var(--p-toast-text);
      font-size: 12px;
      box-shadow: var(--p-shadow);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 160ms cubic-bezier(0.22, 1, 0.36, 1),
                  transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.is-error {
      background: var(--p-danger);
      color: #ffffff;
    }

    @media (max-width: 440px) {
      .header-hint {
        display: none;
      }
      .file-size {
        display: none;
      }
      .file-row {
        gap: 7px;
      }
      .btn {
        padding: 0 6px;
      }
      .btn .label-full {
        display: none;
      }
      .btn .label-short {
        display: inline;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .file-row, .row-actions, .btn, .toast, .open-with-menu {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main id="card-root" class="card" aria-label="Prism 内联文件卡片">
    <header class="card-header">
      <div class="header-left">
        <span id="card-title" class="card-title">文件卡片</span>
        <span id="file-count" class="count-badge">0 项</span>
      </div>
      <span id="header-hint" class="header-hint">双击定位系统目录</span>
    </header>
    <div id="list-container">
      <div class="empty-state">正在加载文件列表…</div>
    </div>
  </main>
  <div id="open-with-menu" class="open-with-menu" role="menu" aria-label="本地打开方式" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const KIND_ICONS = {
        dir: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h3.4c.5 0 .97.25 1.25.67l.75 1.08c.28.42.75.67 1.25.67H16A1.5 1.5 0 0 1 17.5 7.92v6.58A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5v-9Z"/></svg>',
        code: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6.5 3.5 10 7 13.5M13 6.5 16.5 10 13 13.5M11 4.5 9 15.5"/></svg>',
        markdown: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M5.5 12.5v-5l2 2.4 2-2.4v5M13.5 7.5v5m0 0-1.7-1.7m1.7 1.7 1.7-1.7"/></svg>',
        image: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="13" rx="2"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/><path d="m4.5 14 3.7-3.6a1 1 0 0 1 1.4 0l2.4 2.3 1.7-1.6a1 1 0 0 1 1.4 0l1.9 1.9"/></svg>',
        pdf: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.8h6.5L15.5 6.8V16a1.2 1.2 0 0 1-1.2 1.2H5A1.2 1.2 0 0 1 3.8 16V4A1.2 1.2 0 0 1 5 2.8Z"/><path d="M11.5 2.8v4h4"/><path d="M6.8 12.5h6.4"/></svg>',
        office: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.8h6.5L15.5 6.8V16a1.2 1.2 0 0 1-1.2 1.2H5A1.2 1.2 0 0 1 3.8 16V4A1.2 1.2 0 0 1 5 2.8Z"/><path d="M7 10h6M7 13h4"/></svg>',
        archive: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="13" height="12" rx="1.8"/><path d="M3.5 8h13M10 8v8M8.8 10.5h2.4"/></svg>',
        file: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 2.8h6.3L15.5 6.8V16a1.2 1.2 0 0 1-1.2 1.2H5.2A1.2 1.2 0 0 1 4 16V4a1.2 1.2 0 0 1 1.2-1.2Z"/><path d="M11.5 2.8v4h4"/></svg>'
      };

      const state = {
        initialized: false,
        hostCapabilities: {},
        hostContext: {},
        title: '文件卡片',
        items: [],
        platformLabel: 'Windows 资源管理器',
        nativeTabUnsupported: false,
        loading: true,
        openTargets: {
          loaded: false,
          loading: false,
          items: [],
          menuOpen: false,
          activeIndex: -1
        }
      };

      const cardRoot = document.getElementById('card-root');
      const cardTitleEl = document.getElementById('card-title');
      const fileCountEl = document.getElementById('file-count');
      const headerHintEl = document.getElementById('header-hint');
      const listContainer = document.getElementById('list-container');
      const openWithMenuEl = document.getElementById('open-with-menu');
      const toastEl = document.getElementById('toast');

      const uiAbort = new AbortController();
      const { signal } = uiAbort;
      let rpcCounter = 1;
      const pendingRequests = new Map();
      let toastTimer = null;
      let resizeTimer = null;
      let lastSentHeight = 0;
      let resizeObserver = null;
      const btnFeedbackMap = new WeakMap();
      const activeFeedbackTimers = new Set();

      window.addEventListener('pagehide', () => {
        if (toastTimer) clearTimeout(toastTimer);
        if (resizeTimer) clearTimeout(resizeTimer);
        for (const t of activeFeedbackTimers) clearTimeout(t);
        activeFeedbackTimers.clear();
        if (resizeObserver) {
          try { resizeObserver.disconnect(); } catch {}
        }
        for (const pending of pendingRequests.values()) {
          clearTimeout(pending.timer);
        }
        pendingRequests.clear();
        uiAbort.abort();
      }, { once: true });

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message, isError = false) {
        if (toastTimer) clearTimeout(toastTimer);
        toastEl.textContent = String(message || '');
        toastEl.classList.toggle('is-error', Boolean(isError));
        toastEl.classList.add('is-visible');
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('is-visible');
        }, 2600);
      }

      const HOST_VAR_BRIDGE = {
        '--primary': '--p-accent',
        '--background': '--p-bg',
        '--secondary': '--p-bg-hover',
        '--muted': '--p-bg-subtle',
        '--foreground': '--p-text',
        '--muted-foreground': '--p-text-muted',
        '--sidebar-border': '--p-border'
      };
      let activePrismTheme = null;

      function applyPrismThemePayload(theme) {
        if (!theme || typeof theme !== 'object') return;
        activePrismTheme = theme;
        const root = document.documentElement;
        if (theme.mode === 'dark' || theme.mode === 'light') {
          root.dataset.theme = theme.mode;
          root.style.colorScheme = theme.mode;
        }
        const t = theme.tokens;
        if (t && typeof t === 'object') {
          const pairs = [
            ['--p-bg', t.bg],
            ['--p-bg-subtle', t.subtle],
            ['--p-bg-hover', t.hover],
            ['--p-bg-active', t.active],
            ['--p-text', t.text],
            ['--p-text-secondary', t.textSec],
            ['--p-text-muted', t.textMuted],
            ['--p-border', t.border],
            ['--p-border-strong', t.borderStrong],
            ['--p-accent', t.accent],
            ['--p-accent-soft', t.accentSoft],
            ['--color-background-primary', t.bg],
            ['--color-background-secondary', t.subtle],
            ['--color-background-tertiary', t.hover],
            ['--color-text-primary', t.text],
            ['--color-text-secondary', t.textSec],
            ['--color-text-tertiary', t.textMuted],
            ['--color-border-primary', t.borderStrong || t.border],
            ['--color-border-secondary', t.border],
            ['--color-accent', t.accent]
          ];
          for (const [k, v] of pairs) {
            if (typeof v === 'string' && v) root.style.setProperty(k, v);
          }
        }
      }

      function applyHostContext(ctx) {
        if (!ctx || typeof ctx !== 'object') return;
        state.hostContext = { ...state.hostContext, ...ctx };
        const themeRaw = typeof ctx.theme === 'string' ? ctx.theme : ctx.theme?.colorScheme;
        if (themeRaw === 'dark' || themeRaw === 'light') {
          document.documentElement.dataset.theme = themeRaw;
          document.documentElement.style.colorScheme = themeRaw;
        }
        const vars = ctx.styles && ctx.styles.variables;
        if (vars && typeof vars === 'object') {
          for (const [k, v] of Object.entries(vars)) {
            if (typeof k === 'string' && k.startsWith('--') && typeof v === 'string' && v.trim()) {
              document.documentElement.style.setProperty(k, v);
              const mapped = HOST_VAR_BRIDGE[k];
              if (mapped) document.documentElement.style.setProperty(mapped, v);
            }
          }
        }
        if (activePrismTheme) {
          applyPrismThemePayload(activePrismTheme);
        }
      }

      function postToHost(payload) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      }

      function sendNotification(method, params = {}) {
        postToHost({ jsonrpc: '2.0', method, params });
      }

      function sendRequest(method, params = {}, timeoutMs = 15000) {
        const id = rpcCounter++;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pendingRequests.delete(id);
            reject(new Error('请求宿主超时'));
          }, timeoutMs);
          pendingRequests.set(id, { resolve, reject, timer });
          postToHost({ jsonrpc: '2.0', id, method, params });
        });
      }

      async function callServerTool(name, args = {}) {
        const mergedArgs = {
          ...(args && typeof args === 'object' ? args : {}),
          ...(window.__PRISM_APP_TOKEN__ ? { _appToken: window.__PRISM_APP_TOKEN__ } : {})
        };
        const res = await sendRequest('tools/call', { name, arguments: mergedArgs }, 20000);
        if (res && res.isError) {
          const errText = res.structuredContent?.error || res.content?.find?.((c) => c.type === 'text')?.text || '工具调用失败';
          throw new Error(errText);
        }
        return res?.structuredContent ?? res;
      }

      async function openInNativeTab(uri) {
        if (!uri) {
          showToast('缺少有效的文件 URI', true);
          return false;
        }
        try {
          const res = await sendRequest('com.google.antigravity/toggle-aux-pane', {
            tabType: 'fileView',
            uri
          }, 12000);
          if (res && res.isError) {
            throw Object.assign(new Error(res.message || '宿主不支持原生标签页'), { code: -32601 });
          }
          return true;
        } catch (err) {
          if (err && err.code === -32601) {
            state.nativeTabUnsupported = true;
            render();
            showToast('当前宿主暂不支持原生标签页打开', true);
          } else {
            showToast(err?.message || '打开原生标签页失败', true);
          }
          return false;
        }
      }

      async function attachContext(text) {
        if (!state.hostCapabilities?.updateModelContext) {
          showToast('当前宿主暂不支持引用到对话上下文', true);
          return false;
        }
        try {
          await sendRequest('ui/update-model-context', {
            content: [{ type: 'text', text }]
          }, 10000);
          showToast('已引用到当前对话');
          return true;
        } catch (err) {
          showToast(err?.message || '引用上下文失败', true);
          return false;
        }
      }

      async function copyTextSafe(text) {
        const str = String(text ?? '');
        if (!str) return false;
        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            await navigator.clipboard.writeText(str);
            return true;
          }
        } catch {}
        try {
          const ta = document.createElement('textarea');
          ta.value = str;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          ta.style.pointerEvents = 'none';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch {
          return false;
        }
      }

      function flashButtonFeedback(btn, doneText = '✓ 已复制', durationMs = 1200) {
        if (!btn || !btn.isConnected) return;
        const existing = btnFeedbackMap.get(btn);
        if (existing) {
          clearTimeout(existing.timer);
          activeFeedbackTimers.delete(existing.timer);
        } else {
          const rectW = Math.ceil(btn.getBoundingClientRect().width);
          btn.dataset.origHtml = btn.innerHTML;
          btn.dataset.origMinWidth = btn.style.minWidth || '';
          if (rectW > 0) btn.style.minWidth = `${rectW}px`;
        }
        btn.textContent = doneText;
        btn.classList.add('is-copied');
        const timer = setTimeout(() => {
          activeFeedbackTimers.delete(timer);
          btnFeedbackMap.delete(btn);
          if (!btn.isConnected) return;
          if (btn.dataset.origHtml !== undefined) {
            btn.innerHTML = btn.dataset.origHtml;
            delete btn.dataset.origHtml;
          }
          btn.style.minWidth = btn.dataset.origMinWidth || '';
          delete btn.dataset.origMinWidth;
          btn.classList.remove('is-copied');
        }, durationMs);
        activeFeedbackTimers.add(timer);
        btnFeedbackMap.set(btn, { timer });
      }

      async function handleReveal(item) {
        if (!item?.path) return false;
        try {
          const res = await callServerTool('reveal_in_explorer', { path: item.path });
          if (res && res.ok === false) {
            showToast(res.error || '定位失败', true);
            return false;
          }
          const targetLabel = state.platformLabel || 'Windows 资源管理器';
          showToast(`已在 ${targetLabel} 中定位`);
          return true;
        } catch (err) {
          showToast(err?.message || '定位失败', true);
          return false;
        }
      }

      async function loadOpenTargets() {
        if (state.openTargets.loaded || state.openTargets.loading) return state.openTargets.items;
        state.openTargets.loading = true;
        try {
          const res = await callServerTool('list_open_targets', {});
          state.openTargets.items = Array.isArray(res?.targets) ? res.targets : [];
          state.openTargets.loaded = true;
        } catch {
          state.openTargets.items = [];
        } finally {
          state.openTargets.loading = false;
          render();
        }
        return state.openTargets.items;
      }

      function closeOpenWithMenu() {
        if (!state.openTargets.menuOpen) return;
        state.openTargets.menuOpen = false;
        state.openTargets.activeIndex = -1;
        openWithMenuEl.hidden = true;
        scheduleSizeSync();
      }

      function renderOpenWithMenu() {
        const items = state.openTargets.items;
        if (state.openTargets.loading) {
          openWithMenuEl.innerHTML = '<div class="open-with-empty">正在检测本机程序…</div>';
          return;
        }
        if (!items.length) {
          openWithMenuEl.innerHTML = '<div class="open-with-empty">未检测到已安装的编辑器或终端</div>';
          return;
        }
        const editors = items.filter((t) => t.kind === 'editor');
        const terminals = items.filter((t) => t.kind === 'terminal');
        const parts = [];
        if (editors.length) {
          parts.push('<div class="open-with-group-label">本地编辑器</div>');
          for (const t of editors) {
            parts.push(
              `<button type="button" class="open-with-item" role="menuitem" data-target-id="${escapeHtml(t.id)}">` +
                `<span>${escapeHtml(t.name)}</span>` +
                `<span class="open-with-item-tag">${t.supportsLineCol ? '编辑器' : '应用'}</span>` +
              `</button>`
            );
          }
        }
        if (terminals.length) {
          parts.push('<div class="open-with-group-label">终端打开所在目录</div>');
          for (const t of terminals) {
            parts.push(
              `<button type="button" class="open-with-item" role="menuitem" data-target-id="${escapeHtml(t.id)}">` +
                `<span>${escapeHtml(t.name)}</span>` +
                `<span class="open-with-item-tag">终端</span>` +
              `</button>`
            );
          }
        }
        openWithMenuEl.innerHTML = parts.join('');
      }

      function positionOpenWithMenu(anchorBtn) {
        const rect = anchorBtn.getBoundingClientRect();
        const menuW = Math.max(176, openWithMenuEl.offsetWidth || 184);
        const menuH = Math.min(220, openWithMenuEl.offsetHeight || 140);
        const left = Math.min(window.innerWidth - menuW - 6, Math.max(6, rect.right - menuW));
        let top = rect.bottom + 4;
        if (top + menuH > window.innerHeight - 6 && rect.top - menuH - 4 > 6) {
          top = rect.top - menuH - 4;
        }
        openWithMenuEl.style.left = `${Math.round(left)}px`;
        openWithMenuEl.style.top = `${Math.round(Math.max(6, top))}px`;
      }

      async function toggleOpenWithMenu(idx, anchorBtn) {
        if (state.openTargets.menuOpen && state.openTargets.activeIndex === idx) {
          closeOpenWithMenu();
          return;
        }
        state.openTargets.menuOpen = true;
        state.openTargets.activeIndex = idx;
        openWithMenuEl.hidden = false;
        if (!state.openTargets.loaded) {
          renderOpenWithMenu();
          positionOpenWithMenu(anchorBtn);
          scheduleSizeSync();
          await loadOpenTargets();
          if (!state.openTargets.menuOpen || state.openTargets.activeIndex !== idx) return;
        }
        renderOpenWithMenu();
        positionOpenWithMenu(anchorBtn);
        scheduleSizeSync();
      }

      async function invokeOpenWithTarget(targetId, item) {
        closeOpenWithMenu();
        if (!targetId || !item?.path) return;
        try {
          const res = await callServerTool('open_with_target', { targetId, path: item.path });
          if (res && res.ok === false) {
            showToast(res.error || '打开失败', true);
            return;
          }
          showToast(`已通过 ${res?.targetName || targetId} 打开`);
        } catch (err) {
          showToast(err?.message || '打开失败', true);
        }
      }

      function scheduleSizeSync() {
        if (!state.initialized) return;
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const cardHeight = Math.ceil(cardRoot.getBoundingClientRect().height);
          let menuBottom = 0;
          if (state.openTargets.menuOpen && !openWithMenuEl.hidden) {
            menuBottom = Math.ceil(openWithMenuEl.getBoundingClientRect().bottom + 10);
          }
          const h = Math.min(780, Math.max(48, Math.max(cardHeight, menuBottom)));
          if (h !== lastSentHeight) {
            lastSentHeight = h;
            sendNotification('ui/notifications/size-changed', { height: h });
          }
        }, 40);
      }

      function render() {
        cardTitleEl.textContent = state.title || '文件卡片';
        fileCountEl.textContent = `${state.items.length} 项`;
        if (state.platformLabel) {
          headerHintEl.textContent = `双击在 ${state.platformLabel} 中定位`;
        } else {
          headerHintEl.textContent = '双击定位系统目录';
        }

        if (state.loading && state.items.length === 0) {
          listContainer.innerHTML = '<div class="empty-state">正在读取文件列表…</div>';
          scheduleSizeSync();
          return;
        }

        if (!state.items.length) {
          listContainer.innerHTML = '<div class="empty-state">暂无可展示的文件</div>';
          scheduleSizeSync();
          return;
        }

        const canQuote = Boolean(state.hostCapabilities?.updateModelContext);
        const rowsHtml = state.items.map((item, idx) => {
          const kind = KIND_ICONS[item.kind] ? item.kind : 'file';
          const iconSvg = KIND_ICONS[kind];
          const exists = item.exists !== false;
          const showOpen = !item.isDir && exists && Boolean(item.uri) && !state.nativeTabUnsupported;
          const showOpenWith = exists && (!state.openTargets.loaded || state.openTargets.items.length > 0);
          const displayPath = item.relPath && item.relPath !== item.name ? item.relPath : item.path;
          const rowTip = `${item.path || ''}（Enter 定位 · C 复制路径${showOpen ? ' · O 打开' : ''}）`;
          return (
            `<li class="file-row${exists ? '' : ' is-missing'}" data-index="${idx}" tabindex="0" title="${escapeHtml(rowTip)}">` +
              `<span class="kind-icon kind-${escapeHtml(kind)}" aria-hidden="true">${iconSvg}</span>` +
              `<span class="file-meta">` +
                `<span class="file-name-line">` +
                  `<span class="file-name">${escapeHtml(item.name || item.path)}</span>` +
                  (exists ? '' : '<span class="missing-tag">不存在</span>') +
                `</span>` +
                `<span class="file-path">${escapeHtml(displayPath || '')}</span>` +
              `</span>` +
              `<span class="file-size">${escapeHtml(item.sizeText || '')}</span>` +
              `<span class="row-actions">` +
                `<button type="button" class="btn btn-primary" data-action="open" data-index="${idx}" title="在原生标签页打开 (快捷键 O)"${showOpen ? '' : ' hidden'}>打开</button>` +
                `<button type="button" class="btn" data-action="open-with" data-index="${idx}" aria-haspopup="menu"${showOpenWith ? '' : ' hidden'}>打开方式 ▾</button>` +
                `<button type="button" class="btn" data-action="copy-path" data-index="${idx}" title="复制完整路径 (快捷键 C)"><span class="label-full">复制路径</span><span class="label-short">复制</span></button>` +
                `<button type="button" class="btn" data-action="reveal" data-index="${idx}" title="在系统目录中定位 (Enter)">定位</button>` +
                `<button type="button" class="btn" data-action="quote" data-index="${idx}" title="引用路径到当前对话"${canQuote ? '' : ' hidden'}>引用</button>` +
              `</span>` +
            `</li>`
          );
        }).join('');

        listContainer.innerHTML = `<ul class="file-list" role="list">${rowsHtml}</ul>`;
        scheduleSizeSync();
      }

      function applyToolInput(params) {
        const args = params?.arguments || params || {};
        if (typeof args.title === 'string' && args.title.trim()) {
          state.title = args.title.trim();
        }
        render();
      }

      function applyToolResult(params) {
        const sc = params?.structuredContent || params?.result?.structuredContent;
        state.loading = false;
        if (sc && typeof sc === 'object') {
          if (typeof sc.title === 'string' && sc.title.trim()) {
            state.title = sc.title.trim();
          }
          if (Array.isArray(sc.items)) {
            state.items = sc.items;
          }
          if (typeof sc.platformLabel === 'string' && sc.platformLabel) {
            state.platformLabel = sc.platformLabel;
          }
        }
        render();
      }

      // Register message handler BEFORE calling ui/initialize
      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.__agPrismBridge === 'v1') {
          if (event.source && event.source !== window.parent && event.source !== window.top) return;
          if ((msg.type === 'theme-sync' || msg.type === 'init-sync') && msg.theme) {
            applyPrismThemePayload(msg.theme);
          }
          return;
        }
        if (window.parent !== window && event.source && event.source !== window.parent) return;
        if (msg.jsonrpc !== '2.0') return;

        // Response to our outgoing request
        if (msg.id !== undefined && msg.id !== null && !msg.method) {
          const pending = pendingRequests.get(msg.id);
          if (!pending) return;
          pendingRequests.delete(msg.id);
          clearTimeout(pending.timer);
          if (msg.error) {
            const err = new Error(msg.error.message || 'RPC 调用错误');
            err.code = msg.error.code;
            err.data = msg.error.data;
            pending.reject(err);
          } else {
            pending.resolve(msg.result);
          }
          return;
        }

        // Incoming JSON-RPC request from host
        if (msg.method && msg.id !== undefined && msg.id !== null) {
          if (msg.method === 'ping') {
            postToHost({ jsonrpc: '2.0', id: msg.id, result: {} });
          } else {
            postToHost({
              jsonrpc: '2.0',
              id: msg.id,
              error: { code: -32601, message: `Method not found: ${msg.method}` }
            });
          }
          return;
        }

        // Incoming notifications
        if (msg.method === 'ui/notifications/host-context-changed') {
          applyHostContext(msg.params);
        } else if (msg.method === 'ui/notifications/tool-input') {
          applyToolInput(msg.params);
        } else if (msg.method === 'ui/notifications/tool-result') {
          applyToolResult(msg.params);
        }
      }, { signal });

      listContainer.addEventListener('click', async (event) => {
        const btn = event.target.closest('button[data-action]');
        if (!btn) return;
        event.stopPropagation();
        const idx = Number(btn.dataset.index);
        const item = state.items[idx];
        if (!item) return;
        const action = btn.dataset.action;
        if (action === 'open') {
          closeOpenWithMenu();
          await openInNativeTab(item.uri);
        } else if (action === 'open-with') {
          toggleOpenWithMenu(idx, btn);
        } else if (action === 'copy-path') {
          closeOpenWithMenu();
          const ok = await copyTextSafe(item.path || '');
          if (ok) {
            flashButtonFeedback(btn, '✓ 已复制', 1200);
            showToast('已复制完整路径');
          } else {
            showToast('复制路径失败', true);
          }
        } else if (action === 'reveal') {
          closeOpenWithMenu();
          const ok = await handleReveal(item);
          if (ok) flashButtonFeedback(btn, '✓ 已定位', 1200);
        } else if (action === 'quote') {
          closeOpenWithMenu();
          const ok = await attachContext(`@${item.path}`);
          if (ok) flashButtonFeedback(btn, '✓ 已引用', 1200);
        }
      });

      openWithMenuEl.addEventListener('click', (event) => {
        const itemBtn = event.target.closest('button[data-target-id]');
        if (!itemBtn) return;
        event.stopPropagation();
        const targetId = itemBtn.dataset.targetId;
        const item = state.items[state.openTargets.activeIndex];
        if (targetId && item) {
          invokeOpenWithTarget(targetId, item);
        }
      });

      document.addEventListener('click', (event) => {
        if (!state.openTargets.menuOpen) return;
        if (!openWithMenuEl.contains(event.target) && !event.target.closest('button[data-action="open-with"]')) {
          closeOpenWithMenu();
        }
      }, { signal });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && state.openTargets.menuOpen) {
          closeOpenWithMenu();
        }
      }, { signal });

      let lastWindowWidth = window.innerWidth;
      window.addEventListener('resize', () => {
        if (window.innerWidth !== lastWindowWidth) {
          lastWindowWidth = window.innerWidth;
          if (state.openTargets.menuOpen) closeOpenWithMenu();
        }
      }, { signal });

      listContainer.addEventListener('dblclick', (event) => {
        if (event.target.closest('button[data-action]')) {
          event.stopPropagation();
          return;
        }
        const row = event.target.closest('.file-row');
        if (!row) return;
        const idx = Number(row.dataset.index);
        const item = state.items[idx];
        if (item) handleReveal(item);
      });

      listContainer.addEventListener('keydown', async (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;
        const row = event.target.closest('.file-row');
        if (!row) return;
        const idx = Number(row.dataset.index);
        const item = state.items[idx];
        const keyLower = (event.key || '').toLowerCase();
        if (event.key === 'Enter' && event.target === row) {
          event.preventDefault();
          if (item) {
            const ok = await handleReveal(item);
            if (ok) flashButtonFeedback(row.querySelector('button[data-action="reveal"]'), '✓ 已定位', 1200);
          }
        } else if (keyLower === 'c') {
          event.preventDefault();
          if (item?.path) {
            const ok = await copyTextSafe(item.path);
            if (ok) {
              flashButtonFeedback(row.querySelector('button[data-action="copy-path"]'), '✓ 已复制', 1200);
              showToast('已复制完整路径');
            } else {
              showToast('复制路径失败', true);
            }
          }
        } else if (keyLower === 'o') {
          event.preventDefault();
          if (!item) return;
          if (!item.isDir && item.exists !== false && item.uri && !state.nativeTabUnsupported) {
            await openInNativeTab(item.uri);
          } else {
            showToast(item.isDir ? '文件夹请按 Enter 在系统目录中定位' : '该文件暂不支持原生标签页打开', Boolean(item.exists === false));
          }
        } else if (event.key === 'ArrowDown') {
          event.preventDefault();
          row.nextElementSibling?.focus();
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          row.previousElementSibling?.focus();
        }
      });

      if (typeof ResizeObserver === 'function') {
        resizeObserver = new ResizeObserver(() => {
          scheduleSizeSync();
        });
        resizeObserver.observe(cardRoot);
      }

      async function bootstrap() {
        render();
        if (!window.parent || window.parent === window) {
          state.initialized = true;
          return;
        }
        try {
          if (window.top && window.top !== window) {
            window.top.postMessage({ __agPrismBridge: 'v1', source: 'prism-files', role: 'inline-card', type: 'ready' }, '*');
          }
        } catch {}
        try {
          const initRes = await sendRequest('ui/initialize', {
            protocolVersion: '2026-01-26',
            appInfo: { name: 'prism-files', version: '0.9.6' },
            appCapabilities: {}
          }, 12000);
          state.hostCapabilities = initRes?.hostCapabilities || {};
          applyHostContext(initRes?.hostContext || {});
          state.initialized = true;
          sendNotification('ui/notifications/initialized', {});
          render();
          scheduleSizeSync();
          loadOpenTargets().catch(() => {});
        } catch (err) {
          state.initialized = true;
          state.loading = false;
          render();
          showToast(err?.message || '初始化通信失败', true);
        }
      }

      bootstrap();
    })();
  </script>
</body>
</html>
