              `</div>` +
              secNoteHtml +
              `<div class="mhub-form-grid">` +
                `<label class="mhub-field">快速预设模板` +
                  `<select id="mh-prov-preset" class="relay-select">` +
                    `<option value="">-- 自定义网关 --</option>${presetOptions}` +
                  `</select>` +
                `</label>` +
                `<label class="mhub-field">网关 ID（唯一标识）` +
                  `<input id="mh-prov-id" class="text-input" type="text" placeholder="如 cpa-hub / openai-main" value="${escapeHtml(editingP?.id || '')}" ${editingP ? 'readonly' : ''} />` +
                `</label>` +
                `<label class="mhub-field">显示名称` +
                  `<input id="mh-prov-label" class="text-input" type="text" placeholder="如 NAS 统一网关 / OpenAI" value="${escapeHtml(editingP?.label || '')}" />` +
                `</label>` +
                `<label class="mhub-field">流式协议` +
                  `<select id="mh-prov-proto" class="relay-select">` +
                    `<option value="openai-chat" ${(!editingP || editingP.protocol === 'openai-chat') ? 'selected' : ''}>OpenAI Chat (/chat/completions)</option>` +
                    `<option value="openai-responses" ${editingP?.protocol === 'openai-responses' ? 'selected' : ''}>OpenAI Responses (/responses)</option>` +
                    `<option value="anthropic-messages" ${editingP?.protocol === 'anthropic-messages' ? 'selected' : ''}>Anthropic Messages (/messages)</option>` +
                  `</select>` +
                `</label>` +
                `<label class="mhub-field" style="grid-column: 1 / -1;">网关 Base URL` +
                  `<input id="mh-prov-url" class="text-input" type="text" placeholder="如 https://api.openai.com/v1 或 http://127.0.0.1:11434/v1" value="${escapeHtml(editingP?.baseUrl || '')}" />` +
                `</label>` +
                `<label class="mhub-field">绑定环境变量名（推荐 · 零落盘）` +
                  `<input id="mh-prov-env" class="text-input" type="text" placeholder="如 OPENAI_API_KEY（免密网关留空）" value="${escapeHtml(editingP?.apiKeyEnv || '')}" />` +
                `</label>` +
                `<label class="mhub-field">或存入系统凭据库（可选 · 写后不回显）` +
                  `<input id="mh-prov-key" class="text-input" type="password" autocomplete="new-password" placeholder="${editingP?.hasVaultKey ? '已存系统凭据库（改域名须重填）' : '可选：直接录入存入 OS 凭据库'}" />` +
                `</label>` +
              `</div>` +
              `<div class="relay-form-row" style="margin-top:6px;">` +
                `<label style="font-size:11.5px;display:inline-flex;align-items:center;gap:4px;"><input type="checkbox" id="mh-prov-keyless" ${editingP?.allowKeyless ? 'checked' : ''}>本地免密网关（如 Ollama）</label>` +
                (editingP?.hasVaultKey ? `<button type="button" class="mini-btn is-danger-subtle" data-mhub-action="clear-prov-vault" data-id="${escapeHtml(editingP.id)}">清除已存凭据库密钥</button>` : '') +
                `<button type="button" class="ctrl-btn is-primary" data-mhub-action="save-provider">保存网关</button>` +
              `</div>` +
            `</article>`
          );
        }

        // Auto-Discover & Batch Import Panel (/v1/models)
        if (st.showDiscoverPanel) {
          const curDiscProv = st.discoverProviderId && providers.some((p) => p.id === st.discoverProviderId)
            ? st.discoverProviderId
            : (providers[0]?.id || '');
          st.discoverProviderId = curDiscProv;
          const provOpts = providers.map((p) => `<option value="${escapeHtml(p.id)}" ${p.id === curDiscProv ? 'selected' : ''}>${escapeHtml(p.label)} (${escapeHtml(p.id)})</option>`).join('');
          const existingUpstreamSet = new Set(
            models.filter((m) => m.providerId === curDiscProv).map((m) => String(m.upstreamModel || m.id))
          );
          const dq = String(st.discoverQuery || '').trim().toLowerCase();
          const discFiltered = (st.discoverItems || []).filter((it) => {
            if (st.discoverChatOnly && it.isChat === false) return false;
            if (!dq) return true;
            const labelId = String(it.upstreamModel || it.suggestedId || '').toLowerCase();
            return labelId.includes(dq) || String(it.vendor || '').toLowerCase().includes(dq);
          });
          const isItemAlreadyImported = (it) => {
            const up = String(it.upstreamModel || it.suggestedId || '');
            const sg = String(it.suggestedId || up);
            return Boolean(it.alreadyAdded || existingUpstreamSet.has(up) || models.some((m) => m.id === sg || m.id === up));
          };
          const selectedEntries = Object.entries(st.discoverSelected || {}).filter(([, v]) => Boolean(v));
          const listHtml = st.discoverLoading
            ? '<div class="empty-state" style="padding:14px;">正在请求网关 /models 列表…</div>'
            : st.discoverError
              ? `<p class="relay-sub" style="color:var(--p-danger);">${escapeHtml(st.discoverError)}</p>`
              : discFiltered.length
                ? `<div class="mhub-discover-list">` +
                  discFiltered.map((it) => {
                    const keyId = String(it.upstreamModel || it.suggestedId || '');
                    const dispId = String(it.suggestedId || keyId);
                    const already = isItemAlreadyImported(it);
                    const pickedTier = st.discoverSelected?.[keyId] || '';
                    const defTier = it.tier || 'T2';
                    const curTier = pickedTier || defTier;
                    return (
                      `<div class="mhub-disc-item${pickedTier ? ' is-selected' : ''}">` +
                        `<label class="mhub-disc-left" title="${escapeHtml(keyId)}">` +
                          `<input type="checkbox" class="mhub-disc-cb" data-model-id="${escapeHtml(keyId)}" data-def-tier="${escapeHtml(defTier)}" ${pickedTier ? 'checked' : ''} ${already ? 'disabled' : ''} />` +
                          `<span class="mhub-disc-id">${escapeHtml(dispId)}</span>` +
                        `</label>` +
                        `<span class="pill">${escapeHtml(it.vendor || 'other')}</span>` +
                        (already
                          ? '<span class="pill pill-ok">已导入</span>'
                          : `<select class="mhub-tier-mini-sel" data-disc-tier-for="${escapeHtml(keyId)}" aria-label="导入梯队">` +
                              ['T1', 'T2', 'T3', 'T4'].map((t) => `<option value="${t}" ${curTier === t ? 'selected' : ''}>${t}</option>`).join('') +
                            `</select>`) +
                      `</div>`
                    );
                  }).join('') +
                  `</div>`
                : (st.discoverItems?.length
                  ? '<div class="empty-state" style="padding:12px;">没有匹配当前过滤条件的模型</div>'
                  : '<p class="relay-sub">选择网关后点「拉取模型列表」，即可一键勾选导入上游支持的模型并自动推断 T1–T4 梯队（若网关不支持 <code>/models</code>，仍可使用「+ 模型」手动添加）。</p>');

          parts.push(
            `<article class="relay-card is-accent mhub-form-card">` +
              `<div class="relay-card-head">` +
                `<span class="relay-title">🔍 从网关自动发现并批量导入模型</span>` +
                `<button type="button" class="mini-btn" data-mhub-action="close-discover">收起</button>` +
              `</div>` +
              (!providers.length
                ? `<p class="relay-sub">尚未配置网关，请先点击「+ 网关」添加兼容端点后再拉取模型列表。</p>`
                : `<div class="relay-form-row">` +
                    `<select id="mh-disc-prov" class="relay-select">${provOpts}</select>` +
                    `<button type="button" class="ctrl-btn is-primary" data-mhub-action="run-discover" ${st.discoverLoading ? 'disabled' : ''}>${st.discoverLoading ? '拉取中…' : '拉取 /models 列表'}</button>` +
                    `<input id="mh-disc-filter" class="text-input" style="max-width:180px;" type="text" placeholder="过滤模型 ID / 厂商…" value="${escapeHtml(st.discoverQuery || '')}" />` +
                    `<label style="font-size:11.5px;display:inline-flex;align-items:center;gap:4px;"><input type="checkbox" id="mh-disc-chatonly" ${st.discoverChatOnly ? 'checked' : ''}>仅显示对话模型</label>` +
                  `</div>` +
                  listHtml +
                  (st.discoverItems?.length
                    ? `<div class="relay-form-row" style="justify-content:space-between;margin-top:4px;">` +
                        `<div class="relay-form-row">` +
                          `<button type="button" class="mini-btn" data-mhub-action="disc-select-all">全选当前未导入 (${discFiltered.filter((x) => !isItemAlreadyImported(x)).length})</button>` +
                          `<button type="button" class="mini-btn" data-mhub-action="disc-select-none">清空勾选</button>` +
                        `</div>` +
                        `<button type="button" class="ctrl-btn is-primary" data-mhub-action="disc-import" ${(!selectedEntries.length || st.discoverImporting) ? 'disabled' : ''}>${st.discoverImporting ? '导入中…' : `一键导入已勾模型 (${selectedEntries.length})`}</button>` +
                      `</div>`
                    : '')
              ) +
            `</article>`
          );
        }

        // Model Add/Edit Form
        if (st.showModelForm) {
          const editingM = st.editingModelId ? models.find((m) => m.id === st.editingModelId) : null;
          const provOpts = providers.map((p) => `<option value="${escapeHtml(p.id)}" ${editingM?.providerId === p.id ? 'selected' : ''}>${escapeHtml(p.label)} (${escapeHtml(p.id)})</option>`).join('');
          const fbOpts = models
            .filter((m) => !editingM || m.id !== editingM.id)
            .map((m) => `<option value="${escapeHtml(m.id)}" ${editingM?.fallbackModelId === m.id ? 'selected' : ''}>${escapeHtml(m.alias || m.id)} (${escapeHtml(m.tier)})</option>`)
            .join('');
          parts.push(
            `<article class="relay-card is-accent mhub-form-card">` +
              `<div class="relay-card-head">` +
                `<span class="relay-title">${editingM ? `编辑模型 · ${escapeHtml(editingM.id)}` : '➕ 编排会诊模型（T1–T4 梯队）'}</span>` +
                `<button type="button" class="mini-btn" data-mhub-action="cancel-model">收起</button>` +
              `</div>` +
              (!providers.length
                ? `<p class="relay-sub">请先点击上方「+ 网关」添加一个兼容网关后再编排模型。</p>`
                : `<div class="mhub-form-grid">` +
                    `<label class="mhub-field">归属网关` +
                      `<select id="mh-mod-prov" class="relay-select">${provOpts}</select>` +
                    `</label>` +
                    `<label class="mhub-field">模型调用 ID（供 AI 调用）` +
                      `<input id="mh-mod-id" class="text-input" type="text" placeholder="如 gpt-6.2-astra / claude-opus" value="${escapeHtml(editingM?.id || '')}" ${editingM ? 'readonly' : ''} />` +
                    `</label>` +
                    `<label class="mhub-field">上游真实模型名 (upstreamModel)` +
                      `<input id="mh-mod-upstream" class="text-input" type="text" placeholder="留空默认同调用 ID" value="${escapeHtml(editingM?.upstreamModel || '')}" />` +
                    `</label>` +
                    `<label class="mhub-field">友好别名` +
                      `<input id="mh-mod-alias" class="text-input" type="text" placeholder="如 GPT-6.2 Astra 架构主审" value="${escapeHtml(editingM?.alias || '')}" />` +
                    `</label>` +
                    `<label class="mhub-field">能力梯队` +
                      `<select id="mh-mod-tier" class="relay-select">` +
                        `<option value="T1" ${editingM?.tier === 'T1' ? 'selected' : ''}>T1 顶配旗舰（重决策/对抗辩论）</option>` +
                        `<option value="T2" ${(!editingM || editingM.tier === 'T2') ? 'selected' : ''}>T2 常规主力（日常 Diff 二审）</option>` +
                        `<option value="T3" ${editingM?.tier === 'T3' ? 'selected' : ''}>T3 进阶性价比（高频分析/中文）</option>` +
                        `<option value="T4" ${editingM?.tier === 'T4' ? 'selected' : ''}>T4 轻量高速（长文摘要/初筛）</option>` +
                      `</select>` +
                    `</label>` +
                    `<label class="mhub-field">所属厂商家族（跨厂商避让自审）` +
                      `<select id="mh-mod-vendor" class="relay-select">` +
                        `<option value="openai" ${editingM?.vendor === 'openai' ? 'selected' : ''}>OpenAI</option>` +
                        `<option value="anthropic" ${editingM?.vendor === 'anthropic' ? 'selected' : ''}>Anthropic (Claude)</option>` +
                        `<option value="google" ${editingM?.vendor === 'google' ? 'selected' : ''}>Google (Gemini)</option>` +
                        `<option value="deepseek" ${editingM?.vendor === 'deepseek' ? 'selected' : ''}>DeepSeek</option>` +
                        `<option value="glm" ${editingM?.vendor === 'glm' ? 'selected' : ''}>GLM</option>` +
                        `<option value="other" ${(!editingM || editingM.vendor === 'other') ? 'selected' : ''}>Other</option>` +
                      `</select>` +
                    `</label>` +
                    `<label class="mhub-field">限流/超时备用降级模型 (1 跳防环)` +
                      `<select id="mh-mod-fb" class="relay-select">` +
                        `<option value="">-- 无备用降级 --</option>${fbOpts}` +
                      `</select>` +
                    `</label>` +
                    `<label class="mhub-field">职责备注 (可选)` +
                      `<input id="mh-mod-hint" class="text-input" type="text" placeholder="如 专职 PR 代码安全审查" value="${escapeHtml(editingM?.roleHint || '')}" />` +
                    `</label>` +
                  `</div>` +
                  `<div class="relay-form-row" style="margin-top:6px;">` +
                    `<label style="font-size:11.5px;display:inline-flex;align-items:center;gap:4px;"><input type="checkbox" id="mh-mod-fav" ${(!editingM || editingM.isFavorite) ? 'checked' : ''}>加入常用收藏 (Favorites)</label>` +
                    `<button type="button" class="ctrl-btn is-primary" data-mhub-action="save-model">保存模型</button>` +
                  `</div>`
              ) +
            `</article>`
          );
        }

        if (!providers.length && !st.showProviderForm && !st.showDiscoverPanel) {
          parts.push(
            `<article class="relay-card mhub-form-card">` +
              `<div class="relay-card-head"><span class="relay-title">🌐 尚未接入外部会诊网关</span><span class="pill pill-ok">0 外部依赖</span></div>` +
              `<p class="relay-sub">可点击下方按钮手动添加兼容网关（支持一键探测 <code>/v1/models</code>），或复制零密钥部署口令交给当前对话 AI 自动完成配置。</p>` +
              `<div class="relay-form-row">` +
                `<button type="button" class="ctrl-btn is-primary" data-mhub-action="open-add-provider">+ 手动添加首个网关</button>` +
                `<button type="button" class="ctrl-btn" data-mhub-action="copy-ai-setup">🤖 复制 AI 自动配置口令</button>` +
                `<button type="button" class="ctrl-btn" data-mhub-action="reveal-profile">📂 打开配置文件目录</button>` +
              `</div>` +
            `</article>`
          );
        }

        // Favorites Drag-and-Drop Strip
        if (favIds.length > 0) {
          const modelById = new Map(models.map((m) => [m.id, m]));
          const chips = favIds
            .filter((id) => modelById.has(id))
            .map((id, idx, arr) => {
              const m = modelById.get(id);
              const tierCls = `pill-tier-${String(m.tier || 'T2').toLowerCase()}`;
              return (
                `<div class="mhub-fav-chip" draggable="true" data-fav-id="${escapeHtml(id)}" title="拖拽可调整常用模型优先序">` +
                  `<span class="pill ${tierCls}" style="font-size:10px;padding:1px 5px;">${escapeHtml(m.tier)}</span>` +
                  `<strong>${escapeHtml(m.alias || m.id)}</strong>` +
                  (idx > 0 ? `<button type="button" class="mhub-chip-btn" data-mhub-action="fav-move" data-id="${escapeHtml(id)}" data-dir="-1" title="前移">‹</button>` : '') +
                  (idx < arr.length - 1 ? `<button type="button" class="mhub-chip-btn" data-mhub-action="fav-move" data-id="${escapeHtml(id)}" data-dir="1" title="后移">›</button>` : '') +
                  `<button type="button" class="mhub-chip-btn" data-mhub-action="fav-remove" data-id="${escapeHtml(id)}" title="移出常用">×</button>` +
                `</div>`
              );
            })
            .join('');
          if (chips) {
            parts.push(
              `<article class="relay-card" style="padding:8px 10px;">` +
                `<div class="relay-card-head">` +
                  `<span class="relay-title" style="font-size:12px;">⭐ 常用优先序（拖拽胶囊或点 ‹ › 调整顺序）</span>` +
                  `<span class="pill">${favIds.length} 项</span>` +
                `</div>` +
                `<div class="mhub-fav-strip" id="mhub-fav-strip">${chips}</div>` +
              `</article>`
            );
          }
        }

        // T1 - T4 Capability Matrix
        if (models.length > 0) {
          if (filteredModels.length === 0) {
            parts.push(
              `<div class="empty-state" style="padding:18px 12px;">` +
                `<div>未找到匹配筛选条件的模型</div>` +
                `<div style="margin-top:8px;"><button type="button" class="mini-btn" data-mhub-action="reset-filter">清除筛选条件</button></div>` +
              `</div>`
            );
          }
          const tierMeta = d?.tiers || {
            T1: { title: 'T1 顶配旗舰（重决策 / 深度审计）', description: '高风险架构拍板、重大重构取舍与两轮对抗辩论' },
            T2: { title: 'T2 常规主力（日常审计 / 常规二审）', description: '常规功能 Diff 交叉复核与第二意见' },
            T3: { title: 'T3 进阶性价比（高频分析 / 中文推理）', description: '中文长文梳理、高频分析与限流备选' },
            T4: { title: 'T4 轻量高速（摘要 / 整理 / 批量低难）', description: '长日志摘要、格式整理与快速初筛' }
          };
          for (const tk of ['T1', 'T2', 'T3', 'T4']) {
            const tierModels = filteredModels.filter((m) => m.tier === tk);
            if (!tierModels.length) continue;
            const tm = tierMeta[tk] || { title: tk, description: '' };
            const tierCls = `pill-tier-${tk.toLowerCase()}`;
            const cardsHtml = tierModels.map((m) => {
              const isProbing = Boolean(st.probingIds[m.id]);
              const readyBadge = m.ready
                ? '<span class="pill pill-ok">就绪</span>'
                : '<span class="pill pill-warn">待配凭据</span>';
              const spd = m.lastSpeed;
              const speedHtml = spd
                ? (spd.ok
                  ? `<span class="pill" title="测速于 ${escapeHtml(spd.checkedAt || '')}">TTFT ${spd.ttftMs ?? '-'}ms${spd.tokPerSec ? ` · ${spd.tokPerSec} tok/s` : ''}</span>`
                  : `<span class="pill pill-danger" title="${escapeHtml(spd.error || '')}">测速异常</span>`)
                : '';
              const fbText = m.fallbackModelId ? ` · 降级 → <code>${escapeHtml(m.fallbackModelId)}</code>` : '';
              const hasDistinctAlias = Boolean(m.alias && m.alias !== m.id);
              const idCopyBtnHtml = hasDistinctAlias
                ? `<button type="button" class="mhub-id-copy" data-mhub-action="copy-id" data-id="${escapeHtml(m.id)}" title="点击复制模型 ID：${escapeHtml(m.id)}"><span>${escapeHtml(m.id)}</span><span class="mhub-copy-glyph" aria-hidden="true">⎘</span></button>`
                : `<button type="button" class="mhub-id-copy" data-mhub-action="copy-id" data-id="${escapeHtml(m.id)}" title="点击复制模型 ID：${escapeHtml(m.id)}"><span>复制 ID</span><span class="mhub-copy-glyph" aria-hidden="true">⎘</span></button>`;
              return (
                `<div class="mhub-model-card">` +
                  `<div class="relay-card-head">` +
                    `<div class="search-card-meta">` +
                      `<span class="pill ${tierCls}">${tk}</span>` +
                      `<strong>${escapeHtml(m.alias || m.id)}</strong>` +
                      idCopyBtnHtml +
                      `<span class="pill">${escapeHtml(m.vendor)}</span>` +
                      readyBadge + speedHtml +
                    `</div>` +
                    `<div class="search-card-actions">` +
                      `<button type="button" class="mini-btn" data-mhub-action="toggle-fav" data-id="${escapeHtml(m.id)}" title="${m.isFavorite ? '移出常用' : '设为常用'}">${m.isFavorite ? '★' : '☆'}</button>` +
                      `<button type="button" class="mini-btn is-primary" data-mhub-action="probe-one" data-id="${escapeHtml(m.id)}" ${isProbing ? 'disabled' : ''}>${isProbing ? '测速中…' : '⚡ 测速'}</button>` +
                      `<button type="button" class="mini-btn" data-mhub-action="copy-ask" data-id="${escapeHtml(m.id)}" title="复制调用该模型交叉审查的对话口令">复制会诊口令</button>` +
                      `<button type="button" class="mini-btn" data-mhub-action="edit-model" data-id="${escapeHtml(m.id)}">编辑</button>` +
                      `<button type="button" class="mini-btn is-danger-subtle" data-mhub-action="del-model" data-id="${escapeHtml(m.id)}">删</button>` +
                    `</div>` +
                  `</div>` +
                  `<div class="relay-sub">网关 <code>${escapeHtml(m.providerId)}</code> · 上游 <code>${escapeHtml(m.upstreamModel)}</code>${fbText}${m.roleHint ? ` · ${escapeHtml(m.roleHint)}` : ''}</div>` +
                `</div>`
              );
            }).join('');

            parts.push(
              `<div class="mhub-tier-box">` +
                `<div class="relay-card-head">` +
                  `<span class="relay-title" style="font-size:12px;">${escapeHtml(tm.title)}</span>` +
                  `<span class="pill">${tierModels.length} 个</span>` +
                `</div>` +
                (tm.description ? `<div class="relay-sub" style="margin-top:-3px;">${escapeHtml(tm.description)}</div>` : '') +
                `<div class="mhub-tier-cards">${cardsHtml}</div>` +
              `</div>`
            );
          }
        }

        // Gateways & Anti-SSRF Web Search Settings Accordion
        const wsEnabled = typeof d?.settings?.webSearch === 'object'
          ? Boolean(d.settings.webSearch?.enabled)
          : Boolean(d?.settings?.webSearch);
        const redactOut = d?.settings?.redactOutboundSecrets !== false;
        const provRowsHtml = providers.length
          ? providers.map((p) => {
              const authTag = p.hasVaultKey
                ? '<span class="pill pill-ok">系统凭据库已保护</span>'
                : p.apiKeyEnv
                  ? (p.envConfigured
                    ? `<span class="pill pill-ok">环境变量 ${escapeHtml(p.apiKeyEnv)} 已就绪</span>`
                    : `<span class="pill pill-warn">待设环境变量 ${escapeHtml(p.apiKeyEnv)}</span>`)
                  : (p.allowKeyless ? '<span class="pill pill-ok">免密网关</span>' : '<span class="pill pill-warn">未绑凭据</span>');
              return (
                `<div class="radar-item">` +
                  `<div class="relay-card-head">` +
                    `<div class="search-card-meta"><strong>${escapeHtml(p.label)}</strong><code>${escapeHtml(p.id)}</code><span class="pill">${escapeHtml(p.protocol)}</span>${authTag}</div>` +
                    `<div class="search-card-actions">` +
                      `<button type="button" class="mini-btn is-primary" data-mhub-action="discover-provider" data-id="${escapeHtml(p.id)}">🔍 探测模型</button>` +
                      `<button type="button" class="mini-btn" data-mhub-action="edit-provider" data-id="${escapeHtml(p.id)}">编辑</button>` +
                      `<button type="button" class="mini-btn is-danger-subtle" data-mhub-action="del-provider" data-id="${escapeHtml(p.id)}">删除</button>` +
                    `</div>` +
                  `</div>` +
                  `<div class="relay-sub">端点：<code>${escapeHtml(p.baseUrl)}</code></div>` +
                `</div>`
              );
            }).join('')
          : '<p class="relay-sub">尚未配置网关端点。</p>';

        const gwOpen = Boolean(st.openSections?.gateways || (providers.length > 0 && models.length === 0));
        parts.push(
          `<details class="relay-accordion" data-mhub-sec="gateways" ${gwOpen ? 'open' : ''}>` +
            `<summary>` +
              `<span>🔌 网关管理与联网搜索安全保护</span>` +
              `<span class="relay-acc-summary-right"><span class="pill">${providers.length} 网关</span><span class="relay-acc-chevron" aria-hidden="true">▸</span></span>` +
            `</summary>` +
            `<div class="relay-acc-body">` +
              `<div class="relay-form-row" style="justify-content:space-between;">` +
                `<label style="font-size:11.5px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;">` +
                  `<input type="checkbox" id="mh-set-websearch" ${wsEnabled ? 'checked' : ''}>` +
                  `<span>允许免密钥安全联网搜索（自动拦截内网地址防越权）</span>` +
                `</label>` +
              `</div>` +
              `<div class="relay-form-row" style="justify-content:space-between;">` +
                `<label style="font-size:11.5px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;">` +
                  `<input type="checkbox" id="mh-set-redact" ${redactOut ? 'checked' : ''}>` +
                  `<span>出站提示词自动脱敏私钥 / GitHub PAT / API Key</span>` +
                `</label>` +
              `</div>` +
              provRowsHtml +
            `</div>` +
          `</details>`
        );

        modelsWrap.innerHTML = parts.join('');
      }

      function clearQuotaWaitRetry() {
        if (quotaWaitRetryTimer) {
          clearTimeout(quotaWaitRetryTimer);
          quotaWaitRetryTimer = 0;
        }
      }

      function scheduleQuotaWaitRetryIfNeeded(st) {
        clearQuotaWaitRetry();
        if (appState.activeTab !== 'accounts' || document.hidden) return;
        const curOnline = (st?.accounts || []).find((a) => a.isCurrentActive);
        if (!curOnline || curOnline.effectiveQuota) {
          quotaWaitRetryCount = 0;
          return;
        }
        const delays = [4000, 6000, 10000, 15000, 20000];
        if (quotaWaitRetryCount >= delays.length) return;
        const delay = delays[quotaWaitRetryCount++];
        quotaWaitRetryTimer = setTimeout(() => {
          quotaWaitRetryTimer = 0;
          if (appState.activeTab === 'accounts' && !document.hidden && !appState.accounts.loading && !appState.accounts.switching) {
            loadAccountsTab({ forceRefresh: false, silent: true });
          }
        }, delay);
      }

      async function loadAccountsTab({ forceRefresh = false, silent = false } = {}) {
        const seq = ++appState.accounts.seq;
        if (!silent) {
          appState.accounts.loading = true;
          appState.accounts.error = '';
          setTopProgress(true);
          if (!appState.accounts.data) renderAccounts();
        }
        try {
          const [st, mem] = await Promise.all([
            callServerTool('accounts_status', { forceRefresh: Boolean(forceRefresh) }),
            silent && appState.accounts.memories.length
              ? Promise.resolve({
                  entries: appState.accounts.memories,
                  catalogSlots: appState.accounts.catalogSlots,
                  storageInfo: appState.accounts.memoryStorage,
                  remoteSync: appState.accounts.remoteSync
                })
              : callServerTool('handoff_memory_list', { limit: 8 }).catch(() => ({ entries: [], catalogSlots: [] }))
          ]);
          if (seq !== appState.accounts.seq) return;
          appState.accounts.data = st || null;
          appState.accounts.memories = Array.isArray(mem?.entries) ? mem.entries : [];
          appState.accounts.catalogSlots = Array.isArray(mem?.catalogSlots) ? mem.catalogSlots : [];
          if (mem?.storageInfo) appState.accounts.memoryStorage = mem.storageInfo;
          if (mem?.remoteSync) appState.accounts.remoteSync = mem.remoteSync;
          appState.accounts.loaded = true;
          appState.accounts.loading = false;
          if ((st?.accounts?.length || 0) < 2 && !appState.accounts.guideTouchedByUser && !isGuideDismissed('guide:accounts-steps:v1')) {
            appState.accounts.openSections.guide = true;
          }
          broadcastAccountSummary(st);
          if (!silent) setTopProgress(false);
          if (latestBridgeQuota) {
            const curOnline = (st?.accounts || []).find((a) => a.isCurrentActive);
            if (curOnline && !curOnline.effectiveQuota) {
              syncLiveQuotaFromMain(latestBridgeQuota, { force: true });
            }
          }
          scheduleQuotaWaitRetryIfNeeded(st);
        } catch (err) {
          if (seq !== appState.accounts.seq) return;
          appState.accounts.loading = false;
          if (!silent) {
            setTopProgress(false);
            appState.accounts.error = err?.message || '读取账号接力状态失败';
          }
        }
        if (silent && hasActiveFormInput(accountsWrap)) {
          deferredAccountsRender = true;
        } else {
          renderAccounts();
        }
      }

      function stopCountdown(clearState = true) {
        if (countdownRaf) {
          cancelAnimationFrame(countdownRaf);
          countdownRaf = null;
        }
        countdownLastSec = -1;
        if (clearState) {
          appState.accounts.countdown = null;
          renderAccounts();
        }
      }

      function formatAccountErrorMessage(errOrMsg, fallback = '操作失败') {
        const msg = String(errOrMsg?.message || errOrMsg || '').trim() || fallback;
        if (/prism_self_update_(?:check|apply).*not found|permission_denied.*prism_self_update/i.test(msg)) {
          return '后台 prism-files 插件进程还是旧版（尚未加载一键自更新工具）；请先重启一次 Antigravity 后再点「检查更新 / 一键更新」。';
        }
        if (/accounts_relaunch_client.*not found|permission_denied.*accounts_relaunch_client/i.test(msg)) {
          return '后台 prism-files 插件进程还是旧版（尚未加载自动重启工具）；请先手动重启一次 Antigravity（或点顶部更新重启），重启后每次切号即可全自动重启生效。';
        }
        if (/凭据管理器调用失败:\s*exit 1\b/i.test(msg)) {
          return `${msg}（后台插件进程工作目录已过期，请在左侧「技能与自定义 → Plugins」将 prism-files 关闭重开一次或重载窗口后重试）`;
        }
        return msg;
      }

      async function executeAccountSwitchNow(targetId, saveSnapshot = true, autoRelaunch = true, autoCaptureUncaptured = true) {
        if (!targetId || appState.accounts.switching) return;
        stopCountdown(false);
        appState.accounts.switching = true;
        if (appState.accounts.countdown) appState.accounts.countdown.paused = true;
        setTopProgress(true);
        renderAccounts();
        try {
          const res = await callServerTool('accounts_switch', {
            targetId,
            dryRun: false,
            saveSnapshot,
            autoRelaunch: Boolean(autoRelaunch),
            autoCaptureUncaptured: Boolean(autoCaptureUncaptured),
            handoff: { cwd: appState.browse.dir || appState.homeDir || '' }
          });
          appState.accounts.countdown = null;
          appState.accounts.switching = false;
          setTopProgress(false);
          if (res && res.ok) {
            appState.accounts.lastSwitchResult = res;
            postBridgeToMain({ type: 'account-switched', ts: Date.now() });
            showToast(res.message || '账号凭据已安全切换');
            await loadAccountsTab({ forceRefresh: false });
          } else {
            showToast(formatAccountErrorMessage(res?.error, '切换失败'), true);
            renderAccounts();
          }
        } catch (err) {
          appState.accounts.switching = false;
          setTopProgress(false);
          showToast(formatAccountErrorMessage(err, '切换失败'), true);
          renderAccounts();
        }
      }

      function tickCountdownFrame() {
        const cd = appState.accounts.countdown;
        if (!cd) {
          stopCountdown(false);
          return;
        }
        if (cd.paused || appState.accounts.switching) {
          countdownRaf = null;
          return;
        }
        const remainMs = Math.max(0, cd.endAtMs - Date.now());
        if (remainMs <= 0) {
          executeAccountSwitchNow(cd.targetId, cd.saveSnapshot, cd.autoRelaunch, cd.autoCaptureUncaptured !== false);
          return;
        }
        const fillEl = document.getElementById('acc-cd-fill');
        const titleEl = document.getElementById('acc-cd-title');
        const remainSec = Math.ceil(remainMs / 1000);
        if (fillEl) {
          const pct = Math.max(0, Math.min(100, (remainMs / Math.max(1, cd.totalMs)) * 100));
          fillEl.style.width = `${pct.toFixed(2)}%`;
        }
        if (titleEl && remainSec !== countdownLastSec) {
          countdownLastSec = remainSec;
          titleEl.textContent = cd.autoRelaunch
            ? `⏱ 即将切换并重启至 ${cd.alias} (${remainSec}s)`
            : `⏱ 即将切换至 ${cd.alias} (${remainSec}s)`;
        }
        countdownRaf = requestAnimationFrame(tickCountdownFrame);
      }

      function startSwitchCountdown(account) {
        if (!account) return;
        stopCountdown(false);
        const totalSec = Math.max(3, Math.min(15, Number(appState.accounts.data?.countdownSeconds) || 5));
        const totalMs = totalSec * 1000;
        const autoRelaunch = appState.accounts.data?.autoRelaunchAfterSwitch !== false;
        appState.accounts.countdown = {
          targetId: account.id,
          email: account.email,
          alias: account.alias || account.email,
          totalSec,
          totalMs,
          endAtMs: Date.now() + totalMs,
          pausedRemainMs: totalMs,
          paused: false,
          saveSnapshot: true,
          autoRelaunch,
          autoCaptureUncaptured: true
        };
        countdownLastSec = totalSec;
        renderAccounts();
        countdownRaf = requestAnimationFrame(tickCountdownFrame);
      }

      function renderAccounts() {
        deferredAccountsRender = false;
        const prevAccountsScrollTop = accountsWrap ? accountsWrap.scrollTop : 0;
        renderTopbar();
        const st = appState.accounts;
        const d = st.data;
        const sortBtnEl = document.getElementById('btn-accounts-sort');
        if (sortBtnEl) {
          const isPrimaryFirst = st.sortMode === 'primary-first';
          sortBtnEl.textContent = isPrimaryFirst ? '排序:主号置顶' : '排序:在线置顶';
          sortBtnEl.hidden = !d || !d.enabled || !Array.isArray(d.accounts) || d.accounts.length < 2;
        }
        if (d) {
          const accList = Array.isArray(d.accounts) ? d.accounts : [];
          const priCount = accList.filter((x) => x.role === 'primary').length;
          const bakCount = Math.max(0, accList.length - priCount);
          const countSummary = accList.length ? ` · 共 ${accList.length} 号（${priCount} 主 ${bakCount} 备）` : '';
          accountsVaultLabel.textContent = `凭据库: ${d.vault?.backend || '-'} (${d.vault?.ok ? '就绪' : '待检'})${countSummary}`;
          const act = d.activeCredential;
          if (!act?.exists) {
            accountsActivePill.hidden = false;
            accountsActivePill.textContent = '未检测到活跃凭据';
            accountsActivePill.className = 'pill pill-warn';
          } else {
            // Avoid repeating the active email in the subbar when the online Hero card already displays it
            accountsActivePill.hidden = Boolean(accList.some((x) => x.isCurrentActive));
            accountsActivePill.textContent = act.email || '已登录';
            accountsActivePill.className = 'pill pill-ok';
          }
        }

        if (st.loading && !d) {
          accountsWrap.innerHTML = '<div class="empty-state">正在检测隔离凭据库与账号状态…</div>';
          return;
        }
        if (st.error && !d) {
          const isStaleServer = /not found|permission_denied|unknown tool/i.test(st.error);
          accountsWrap.innerHTML = isStaleServer
            ? `<article class="relay-card is-warn">` +
                `<div class="relay-card-head"><span class="relay-title">🔄 后台插件进程仍为旧版本</span><button type="button" class="mini-btn is-primary" data-acc-action="reload-tab">重新检测</button></div>` +
                `<p class="relay-sub">界面已更新到 v0.9.4，但当前驻留的 <code>prism-files</code> 插件后台还是热部署前启动的旧进程。</p>` +
                `<p class="relay-sub"><strong>生效方法：</strong>在 <strong>Plugins Manager</strong> 中把 <code>prism-files</code> 关闭再重新开启，或直接重启一次 Antigravity 即可恢复。</p>` +
                `<p class="relay-sub" style="opacity:0.78;">原始信息：<code>${escapeHtml(st.error)}</code></p>` +
              `</article>`
            : `<article class="relay-card is-warn">` +
                `<div class="relay-card-head"><span class="relay-title">读取账号状态失败</span><button type="button" class="mini-btn is-primary" data-acc-action="reload-tab">重试</button></div>` +
                `<p class="relay-sub">${escapeHtml(st.error)}</p>` +
              `</article>`;
          return;
        }

        const mainParts = [];
        const sideParts = [];
        if (!d || !d.enabled) {
          if (isGuideDismissed('guide:accounts-intro:v1')) {
            mainParts.push(
              '<article class="relay-card">' +
                '<div class="relay-card-head">' +
                  '<span class="relay-title">🔒 主备多账号安全接力（当前未启用）</span>' +
                  '<div class="relay-form-row">' +
                    '<button type="button" class="mini-btn is-primary" data-acc-action="enable">开启账号接力</button>' +
                    '<button type="button" class="mini-btn" data-acc-action="verify">只读校验</button>' +
                    '<button type="button" class="mini-btn" data-guide-restore="guide:accounts-intro:v1">查看说明</button>' +
                  '</div>' +
                '</div>' +
              '</article>'
            );
          } else {
            mainParts.push(
              '<article class="relay-card">' +
                '<div class="relay-card-head">' +
                  '<span class="relay-title">🔒 主备多账号接力（默认关闭）</span>' +
                  '<div class="search-card-actions">' +
                    '<span class="pill">物理隔离</span>' +
                    '<button type="button" class="mini-btn" data-guide-dismiss="guide:accounts-intro:v1" title="收起详细安全说明">× 收起说明</button>' +
                  '</div>' +
                '</div>' +
                '<p class="relay-sub">1. <strong>绝不触碰本地会话</strong>：仅替换 OS 原生凭据库中的受验 OAuth 凭据，保留全部本地对话、SQLite、brain 产物与 workspace。<br>' +
                '2. <strong>零明文落盘</strong>：备份存入 Windows 凭据管理器 / macOS Keychain / Linux Secret Service 独立命名空间，元数据文件仅存邮箱与指纹前缀。<br>' +
                '3. <strong>防串号与原子回滚</strong>：切换前强核验 <code>id_token_email</code>，异常自动回滚原凭据。</p>' +
                '<div class="relay-form-row">' +
                  '<button type="button" class="ctrl-btn is-primary" data-acc-action="enable">我已了解安全边界，开启账号接力</button>' +
                  '<button type="button" class="ctrl-btn" data-acc-action="verify">仅只读校验本机隔离状态</button>' +
                '</div>' +
              '</article>'
            );
          }
        } else {
          const rec = d.recommendation || {};
          const accs = Array.isArray(d.accounts) ? d.accounts : [];

          const evalWindowPctClient = (pctRaw, resetIso, resetPassedFlag) => {
            const passedByClock = Boolean(resetIso && Number.isFinite(Date.parse(resetIso)) && Date.parse(resetIso) <= Date.now());
            if (resetPassedFlag || passedByClock) return { pct: 100, passed: true };
            if (pctRaw === undefined || pctRaw === null || typeof pctRaw === 'boolean' || (typeof pctRaw === 'string' && pctRaw.trim() === '')) {
              return { pct: null, passed: false };
            }
            const num = Number(pctRaw);
            return Number.isFinite(num) ? { pct: Math.max(0, Math.min(100, num)), passed: false } : { pct: null, passed: false };
          };

          const evalAccountPoolHealthClient = (acc) => {
            const eff = acc?.effectiveQuota;
            if (!eff || typeof eff !== 'object') return { hasAny: false, minPoolPct: null, anyExhausted: false };
            const samples = [];
            const pushWin = (p, rst, pass) => {
              const w = evalWindowPctClient(p, rst, pass);
              if (w.pct !== null) samples.push(w.pct);
            };
            const fams = eff.families;
            if (fams && (fams.gemini || fams.claude)) {
              if (fams.gemini) {
                pushWin(fams.gemini.pct5h, fams.gemini.reset5hAt || eff.reset5hAt, fams.gemini.reset5hPassed);
                pushWin(fams.gemini.pct7d, fams.gemini.reset7dAt || eff.reset7dAt, fams.gemini.reset7dPassed);
              }
              if (fams.claude) {
                pushWin(fams.claude.pct5h, fams.claude.reset5hAt || eff.reset5hAt, fams.claude.reset5hPassed);
                pushWin(fams.claude.pct7d, fams.claude.reset7dAt || eff.reset7dAt, fams.claude.reset7dPassed);
              }
            } else {
              pushWin(eff.effective5hPct, eff.reset5hAt, eff.reset5hPassed);
              pushWin(eff.effective7dPct, eff.reset7dAt, eff.reset7dPassed);
            }
            if (!samples.length) return { hasAny: false, minPoolPct: null, anyExhausted: false };
            const minPoolPct = Math.min(...samples);
            return { hasAny: true, minPoolPct, anyExhausted: minPoolPct < 20 };
          };

          if (d.activeCredential?.unregistered && d.activeCredential?.email) {
            mainParts.push(
              `<article class="relay-card is-warn">` +
                `<div class="relay-card-head"><span class="relay-title">🛡️ 检测到未捕获的新登录账号</span>` +
                `<button type="button" class="mini-btn is-primary" data-acc-action="capture-quick">立即备份该新号</button></div>` +
                `<p class="relay-sub">当前在线 <code>${escapeHtml(d.activeCredential.email)}</code> 尚未加入备份列表；直接切走其他账号时也会<strong>自动为其建立防丢备份槽位</strong>。</p>` +
              `</article>`
            );
          }
          const priRecAcc = rec.primaryRecovery?.accountId ? accs.find((x) => x.id === rec.primaryRecovery.accountId) : null;
          if (rec.primaryRecovery && (!priRecAcc || !evalAccountPoolHealthClient(priRecAcc).anyExhausted) && !isGuideDismissed('guide:accounts-primary-rec:v1')) {
            mainParts.push(
              `<article class="relay-card is-accent">` +
                `<div class="relay-card-head"><span class="relay-title">💡 主号恢复提醒</span>` +
                `<div class="search-card-actions">` +
                  `<button type="button" class="mini-btn is-primary" data-acc-action="countdown" data-id="${escapeHtml(rec.primaryRecovery.accountId)}">5s 倒计时切回主号</button>` +
                  `<button type="button" class="mini-btn" data-guide-dismiss="guide:accounts-primary-rec:v1" title="隐藏主号恢复提醒">×</button>` +
                `</div></div>` +
                `<p class="relay-sub">${escapeHtml(rec.primaryRecovery.reason)}</p>` +
              `</article>`
            );
          }
          if (rec.crossFamilyHint && !isGuideDismissed('guide:accounts-cross-fam:v1')) {
            mainParts.push(
              `<article class="relay-card is-warn">` +
                `<div class="relay-card-head">` +
                  `<span class="relay-sub">${escapeHtml(rec.crossFamilyHint)}</span>` +
                  `<button type="button" class="mini-btn" data-guide-dismiss="guide:accounts-cross-fam:v1" title="不再显示跨家族额度提示">× 隐藏</button>` +
                `</div>` +
              `</article>`
            );
          }

          if (st.countdown) {
            const cd = st.countdown;
            const remainMs = cd.paused
              ? (cd.pausedRemainMs ?? cd.totalMs)
              : Math.max(0, (cd.endAtMs || Date.now()) - Date.now());
            const remainSec = Math.ceil(remainMs / 1000);
            const pct = Math.max(0, Math.min(100, (remainMs / Math.max(1, cd.totalMs)) * 100));
            const cdActionLabel = cd.autoRelaunch ? '立即切换并重启' : '立即切换';
            mainParts.push(
              `<article class="relay-card is-warn">` +
                `<div class="relay-card-head">` +
                  `<span id="acc-cd-title" class="relay-title">${st.switching ? '⏳ 正在执行原子切换…' : (cd.autoRelaunch ? `⏱ 即将切换并重启至 ${escapeHtml(cd.alias)} (${remainSec}s)` : `⏱ 即将切换至 ${escapeHtml(cd.alias)} (${remainSec}s)`)}</span>` +
                  `<span class="pill">${escapeHtml(cd.email)}</span>` +
                `</div>` +
                `<div class="countdown-track"><div id="acc-cd-fill" class="countdown-fill" style="width:${pct.toFixed(2)}%"></div></div>` +
                `<div class="relay-form-row">` +
                  `<label style="font-size:11.5px;display:inline-flex;align-items:center;gap:4px;"><input type="checkbox" id="acc-cd-relaunch" ${cd.autoRelaunch ? 'checked' : ''}>切后自动重启 Antigravity</label>` +
                  `<label style="font-size:11.5px;display:inline-flex;align-items:center;gap:4px;"><input type="checkbox" id="acc-cd-snap" ${cd.saveSnapshot ? 'checked' : ''}>切前落盘 4 要素交接</label>` +
                `</div>` +
                `<div class="relay-form-row">` +
                  `<button type="button" class="mini-btn is-primary" data-acc-action="cd-now" ${st.switching ? 'disabled' : ''}>${cdActionLabel}</button>` +
                  `<button type="button" class="mini-btn" data-acc-action="cd-pause" ${st.switching ? 'disabled' : ''}>${cd.paused ? '继续' : '暂停'}</button>` +
                  `<button type="button" class="mini-btn" data-acc-action="cd-cancel" ${st.switching ? 'disabled' : ''}>取消</button>` +
                `</div>` +
              `</article>`
            );
          }

          if (st.lastSwitchResult) {
            const sw = st.lastSwitchResult;
            const autoStarted = Boolean(sw.relaunch?.ok && sw.relaunch?.scheduled);
            mainParts.push(
              `<article class="relay-card is-accent">` +
                `<div class="relay-card-head">` +
                  `<span class="relay-title">${autoStarted ? '🚀 凭据切换完成 · 正在自动重启 Antigravity…' : '🔄 凭据切换完成（需重启 Antigravity 生效）'}</span>` +
                  `<div class="search-card-actions">` +
                    (!autoStarted ? `<button type="button" class="mini-btn is-primary" data-acc-action="relaunch-now">🚀 立即重启 Antigravity 生效</button>` : '') +
                    `<button type="button" class="mini-btn" data-acc-action="dismiss-sw">收起</button>` +
                  `</div>` +
                `</div>` +
                `<p class="relay-sub">${escapeHtml(sw.message || '')}</p>` +
                `<div class="relay-form-row">` +
                  (sw.externalMemoryPrompt ? `<button type="button" class="mini-btn is-primary" data-acc-action="copy-ext-mem">复制外部 memory_store 同步指令</button>` : '') +
                  (sw.resumePrompt ? `<button type="button" class="mini-btn" data-acc-action="copy-resume">复制切后「接力」提示</button>` : '') +
                `</div>` +
              `</article>`
            );
          } else if (d?.pendingSwitch?.phase === 'active-swapped') {
            mainParts.push(
              `<article class="relay-card is-accent">` +
                `<div class="relay-card-head">` +
                  `<span class="relay-title">🔄 已切换至 ${escapeHtml(d.pendingSwitch.targetEmail || '目标账号')}（待重启生效）</span>` +
                  `<button type="button" class="mini-btn is-primary" data-acc-action="relaunch-now">🚀 立即重启 Antigravity 生效</button>` +
                `</div>` +
                `<p class="relay-sub">磁盘凭据已完成切换且会话记录 100% 保留，点右侧按钮将安全关闭并重开客户端，自动恢复扩展与原会话。</p>` +
              `</article>`
            );
          }

          if (!accs.length) {
            mainParts.push('<div class="empty-state">尚未捕获账号，请先在下方点击「捕获当前活跃账号」把当前主号存入 OS 隔离凭据库</div>');
          } else {
            const standbyCandidates = accs.filter((x) => !x.isCurrentActive && x.vaultHasBackup !== false);
            const healthyStandby = standbyCandidates.filter((x) => !evalAccountPoolHealthClient(x).anyExhausted);
            let effectiveRecId = '';
            if (healthyStandby.length > 0) {
              const srvRecId = rec?.recommended?.accountId || '';
              const rankedHealthy = [...healthyStandby].sort((a, b) => {
                const ha = evalAccountPoolHealthClient(a);
                const hb = evalAccountPoolHealthClient(b);
                const scoreOf = (item, h) => {
                  const minQ = h.minPoolPct ?? 75;
                  const priBonus = item.role === 'primary' ? (minQ >= 50 ? 200 : 90) : 0;
                  const srvTie = srvRecId && item.id === srvRecId ? 5 : 0;
                  return priBonus + minQ + srvTie - ((Number(item.priority) || 50) * 0.1);
                };
                return scoreOf(b, hb) - scoreOf(a, ha);
              });
              effectiveRecId = rankedHealthy[0].id;
            }

            const fmtQuotaEta = (iso) => {
              if (!iso) return '';
              const ms = Date.parse(iso) - Date.now();
              if (!Number.isFinite(ms) || ms <= 0) return '';
              const mins = Math.ceil(ms / 60000);
              if (mins < 60) return `${mins}m 后重置`;
              const hrs = Math.floor(mins / 60);
              if (hrs < 48) return `${hrs}h${mins % 60 ? (mins % 60) + 'm' : ''} 后重置`;
              const days = Math.floor(hrs / 24);
              return `${days}d${hrs % 24 ? (hrs % 24) + 'h' : ''} 后重置`;
            };

            const resolveIdentity = (a) => {
              const rawAlias = String(a.alias || '').trim();
              const email = String(a.email || '').trim();
              const handle = email.includes('@') ? email.split('@')[0] : email;
              const isDefaultAlias =
                !rawAlias ||
                rawAlias.toLowerCase() === email.toLowerCase() ||
                /^(?:主账号|主号|primary|备用账号|备用|backup)$/i.test(rawAlias);
              return {
                title: isDefaultAlias ? (handle || rawAlias || '未命名账号') : rawAlias,
                handleSub: (!isDefaultAlias && handle) ? handle : '',
                email
              };
            };

            const formatTierLabel = (rawTier, compact = false) => {
              const raw = String(rawTier || '').trim();
              if (!raw) return '';
              if (/^(?:antigravity\s+)?starter(?:\s+quota)?$/i.test(raw)) return 'Starter';
              if (compact) {
                if (/ultra/i.test(raw)) return 'Ultra';
                if (/\bpro\b/i.test(raw)) return 'Pro';
              }
              return raw;
            };

            const toCleanPct = (v) => {
              if (v === undefined || v === null || typeof v === 'boolean') return null;
              if (typeof v === 'string' && v.trim() === '') return null;
              const num = Number(v);
              return Number.isFinite(num) ? Math.max(0, Math.min(100, num)) : null;
            };

            const barRow = (label, pct, passed, resetIso) => {
              const w = evalWindowPctClient(pct, resetIso, passed);
              const n = w.pct;
              if (n === null) return '';
              const cls = n >= 50 ? 'is-ok' : n >= 20 ? 'is-warn' : 'is-danger';
              const eta = fmtQuotaEta(resetIso);
              const meta = w.passed
                ? '<span class="pill pill-ok">已回血 100%</span>'
                : `<span>${n}%${eta ? ' · ' + escapeHtml(eta) : ''}</span>`;
              return (
                `<div class="quota-bar-row">` +
                  `<strong>${escapeHtml(label)}</strong>` +
                  `<div class="quota-track"><div class="quota-fill ${cls}" style="width:${n}%"></div></div>` +
                  meta +
                `</div>`
              );
            };

            const renderCompactPoolChip = (poolName, p5, pass5, rst5, p7, pass7, rst7) => {
              const w5 = evalWindowPctClient(p5, rst5, pass5);
              const w7 = evalWindowPctClient(p7, rst7, pass7);
              const n5 = w5.pct;
              const n7 = w7.pct;
              const has5 = n5 !== null;
              const has7 = n7 !== null;
              if (!has5 && !has7) return '';
              const nums = [n5, n7].filter((v) => v !== null);
              const minN = nums.length ? Math.min(...nums) : 100;
              const tone = minN >= 50 ? 'is-ok' : minN >= 20 ? 'is-warn' : 'is-danger';

              let summaryText = '';
              if (has5 && has7 && n5 >= 99.95 && n7 >= 99.95 && !w5.passed && !w7.passed) {
                summaryText = '100%';
              } else {
                const bits = [];
                if (has5) bits.push(`5h ${n5}%`);
                if (has7) bits.push(`7d ${n7}%`);
                summaryText = bits.join(' · ');
              }

              const tipParts = [];
              if (has5) {
                const eta5 = fmtQuotaEta(rst5);
                tipParts.push(`5h: ${n5}%${w5.passed ? '（过点预计已满血）' : (eta5 ? `（${eta5}）` : '')}`);
              }
              if (has7) {
                const eta7 = fmtQuotaEta(rst7);
                tipParts.push(`7d: ${n7}%${w7.passed ? '（过点预计已满血）' : (eta7 ? `（${eta7}）` : '')}`);
              }
              return (
                `<span class="quota-fam-chip ${tone}" title="${escapeHtml(`${poolName} · ${tipParts.join(' ｜ ')}`)}">` +
                  `<span class="quota-dot ${tone}" aria-hidden="true"></span>` +
                  `<strong>${escapeHtml(poolName)}</strong> ${escapeHtml(summaryText)}` +
                `</span>`
              );
            };

            const computeStandbyScore = (a) => {
              const isRec = Boolean(effectiveRecId && effectiveRecId === a.id);
              const h = evalAccountPoolHealthClient(a);
              const minQ = h.minPoolPct ?? 75;
              if (h.anyExhausted) {
                return minQ - ((Number(a.priority) || 50) * 0.05);
              }
              const healthyPrimary = a.role === 'primary' && minQ >= 50 ? 220 : (a.role === 'primary' ? 90 : 0);
              return (isRec ? 500 : 0) + healthyPrimary + minQ - ((Number(a.priority) || 50) * 0.05);
            };

            const renderAccountCard = (a) => {
              const ident = resolveIdentity(a);
              const isOnline = Boolean(a.isCurrentActive);
              const poolHealth = evalAccountPoolHealthClient(a);
              const isRec = !isOnline && !poolHealth.anyExhausted && Boolean(effectiveRecId && effectiveRecId === a.id);
              const eff = a.effectiveQuota;
              const rawTier = String(eff?.tierName || '').trim();
              const tierBadge = renderWbTierBadge(rawTier, !isOnline);
              const backupBadge = a.vaultHasBackup ? '' : '<span class="pill pill-danger">缺备份</span>';
              const toggleRole = a.role === 'primary' ? 'backup' : 'primary';
              const toggleRoleText = a.role === 'primary' ? '改备用' : '设为主号';
              const moreOpen = Boolean(st.expandedMoreIds?.[a.id] || st.editingQuotaId === a.id || st.editingAliasId === a.id);

              const obsIso = eff?.observedAt || eff?.updatedAt || '';
              const obsTime = obsIso ? (() => {
                const dt = new Date(obsIso);
                return Number.isFinite(dt.getTime())
                  ? `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`
                  : '';
              })() : '';

              const isEditingQuota = st.editingQuotaId === a.id;
              const editorHtml = isEditingQuota
                ? `<div class="quota-editor" data-quota-editor="${escapeHtml(a.id)}">` +
                    `<div class="relay-form-row">` +
                      `<input type="number" min="0" max="100" class="text-input" style="max-width:86px;" id="qe-5h-${escapeHtml(a.id)}" placeholder="5h 剩余%" value="${eff?.effective5hPct ?? ''}" />` +
                      `<input type="number" min="0" max="100" class="text-input" style="max-width:86px;" id="qe-7d-${escapeHtml(a.id)}" placeholder="7d 剩余%" value="${eff?.effective7dPct ?? ''}" />` +
                      `<input type="number" min="0.1" step="0.5" class="text-input" style="max-width:96px;" id="qe-r5h-${escapeHtml(a.id)}" placeholder="5h 几h重置" />` +
                    `</div>` +
                    `<input type="text" class="text-input" id="qe-raw-${escapeHtml(a.id)}" placeholder="或直接粘贴额度文本（如 5h 剩余 80% 3h后重置；7d 剩余 45%）" />` +
                    `<div class="relay-form-row">` +
                      `<button type="button" class="mini-btn is-primary" data-acc-action="save-quota" data-id="${escapeHtml(a.id)}">保存额度</button>` +
                      `<button type="button" class="mini-btn" data-acc-action="cancel-quota">取消</button>` +
                    `</div>` +
                  `</div>`
                : '';

              const isEditingAlias = st.editingAliasId === a.id;
              const aliasEditorHtml = isEditingAlias
                ? `<div class="relay-form-row">` +
                    `<input type="text" class="text-input" style="max-width:168px;" id="ae-alias-${escapeHtml(a.id)}" placeholder="输入备注名（留空恢复默认）" value="${escapeHtml(ident.handleSub ? a.alias : '')}" />` +
                    `<button type="button" class="mini-btn is-primary" data-acc-action="save-alias" data-id="${escapeHtml(a.id)}">保存备注</button>` +
                    `<button type="button" class="mini-btn" data-acc-action="cancel-alias">取消</button>` +
                  `</div>`
                : '';

              const moreDrawerHtml = moreOpen
                ? `<div class="relay-more-drawer">` +
                    `<div class="relay-sub" style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;">` +
                      `<span><code>${escapeHtml(a.email)}</code> · 指纹 <code>${escapeHtml(a.credHash || '-')}</code> · 最近 ${escapeHtml((a.lastUsedAt || '').slice(0, 16).replace('T', ' ') || '-')}</span>` +
                      `<button type="button" class="mini-btn" data-acc-action="copy-email" data-email="${escapeHtml(a.email)}">复制邮箱</button>` +
                    `</div>` +
                    aliasEditorHtml +
                    editorHtml +
                    `<div class="relay-card-foot">` +
                      `<div class="relay-foot-left">` +
                        `<button type="button" class="mini-btn" data-acc-action="edit-alias" data-id="${escapeHtml(a.id)}">改备注</button>` +
                        (!isOnline ? `<button type="button" class="mini-btn" data-acc-action="dryrun" data-id="${escapeHtml(a.id)}">预演</button>` : '') +
                        `<button type="button" class="mini-btn" data-acc-action="edit-quota" data-id="${escapeHtml(a.id)}">录入额度</button>` +
                        `<button type="button" class="mini-btn" data-acc-action="setrole" data-id="${escapeHtml(a.id)}" data-role="${toggleRole}">${toggleRoleText}</button>` +
                      `</div>` +
                      `<button type="button" class="mini-btn is-danger-subtle" data-acc-action="delete" data-id="${escapeHtml(a.id)}">删备份</button>` +
                    `</div>` +
                  `</div>`
                : '';

              const autoRelaunchPref = d.autoRelaunchAfterSwitch !== false;
              const switchCtaText = autoRelaunchPref ? '⚡ 切换' : '⏱ 切号';
              const switchCtaTip = autoRelaunchPref ? '安全切换至该账号并自动重启 Antigravity 生效' : '5 秒倒计时安全切换至该账号';

              if (isOnline) {
                const roleBadge = a.role === 'primary'
                  ? '<span class="pill pill-gold">★ 主号</span>'
                  : '<span class="pill pill-muted">备用</span>';
                const syncBadge = obsTime
                  ? `<span class="quota-fam-sync">${eff?.source === 'anti-claude-cache' ? '实时' : '同步'} ${escapeHtml(obsTime)}</span>`
                  : '';

                let heroQuotaHtml = '';
                const fams = eff?.families;
                if (fams && (fams.gemini || fams.claude)) {
                  const poolBlocks = [];
                  for (const [fKey, fTitle] of [['gemini', 'Gemini'], ['claude', 'Claude / GPT']]) {
                    const f = fams[fKey];
                    if (!f) continue;
                    const f5 = toCleanPct(f.pct5h);
                    const f7 = toCleanPct(f.pct7d);
                    const fullUnused =
                      f5 !== null && f7 !== null &&
                      f5 >= 99.95 && f7 >= 99.95 &&
                      !f.reset5hPassed && !f.reset7dPassed;
                    if (fullUnused) {
                      poolBlocks.push(
                        `<div class="hero-pool-full">` +
                          `<strong style="color:var(--color-text-primary, var(--p-text));">${fTitle}</strong>` +
                          `<span class="hero-pool-full-right"><span class="quota-dot is-ok"></span>5h 100% · 7d 100% 满血可用</span>` +
                        `</div>`
                      );
                    } else {
                      const b5 = barRow('5h', f.pct5h, f.reset5hPassed, f.reset5hAt || eff.reset5hAt);
                      const b7 = barRow('7d', f.pct7d, f.reset7dPassed, f.reset7dAt || eff.reset7dAt);
                      if (b5 || b7) {
                        poolBlocks.push(
                          `<div class="hero-pool-box">` +
                            `<div class="hero-pool-title"><span>${fTitle}</span></div>` +
                            b5 + b7 +
                          `</div>`
                        );
                      }
                    }
                  }
                  heroQuotaHtml = `<div class="hero-pool-stack">${poolBlocks.join('')}</div>`;
                } else if (eff && (eff.effective5hPct !== null || eff.effective7dPct !== null)) {
                  const q5Html = barRow('5h', eff.effective5hPct, eff.reset5hPassed, eff.reset5hAt);
                  const q7Html = barRow('7d', eff.effective7dPct, eff.reset7dPassed, eff.reset7dAt);
                  heroQuotaHtml = `<div class="quota-bars">${q5Html}${q7Html}</div>`;
                } else {
                  heroQuotaHtml = `<p class="relay-sub">${quotaWaitRetryTimer ? '等待客户端首次拉取该账号实时额度，将自动刷新（也可点右上 ↻ 立即刷新）' : '暂未读到本机实时额度缓存（点右上 ↻ 刷新，或点右上 ⋯ 手动录入）'}</p>`;
                }

                return (
                  `<article class="relay-card is-online is-hero-active">` +
                    `<div class="relay-card-head">` +
                      `<div class="search-card-meta">` +
                        `<span class="pill pill-ok"><span class="online-pulse-dot" style="margin-right:4px;"></span>正在使用</span>` +
                        roleBadge + tierBadge + backupBadge +
                        `<span class="relay-title" title="${escapeHtml(a.email)}">${escapeHtml(ident.title)}</span>` +
                        (ident.handleSub ? `<span class="relay-handle-sub">${escapeHtml(ident.handleSub)}</span>` : '') +
                      `</div>` +
                      `<div class="search-card-actions">` +
                        syncBadge +
                        `<button type="button" class="mini-btn icon-more-btn${moreOpen ? ' is-open' : ''}" data-acc-action="toggle-more" data-id="${escapeHtml(a.id)}" title="展开账号详情与管理项" aria-label="更多操作">⋯</button>` +
                      `</div>` +
                    `</div>` +
                    heroQuotaHtml +
                    (!moreOpen ? `<div class="hero-email-foot"><code>${escapeHtml(a.email)}</code></div>` : '') +
                    moreDrawerHtml +
                  `</article>`
                );
              }

              // Compact Standby Decision Card (unused account)
              const standbyRoleBadge = a.role === 'primary'
                ? '<span class="pill pill-gold">★ 主号</span>'
                : '<span class="pill pill-muted">备</span>';
              const recBadge = isRec ? '<span class="pill pill-recommend" title="综合可用额度与角色最优先推荐">推荐</span>' : '';

              const compactChips = [];
              const fams = eff?.families;
              if (fams && (fams.gemini || fams.claude)) {
                if (fams.gemini) {
                  const chip = renderCompactPoolChip('Gemini', fams.gemini.pct5h, fams.gemini.reset5hPassed, fams.gemini.reset5hAt || eff.reset5hAt, fams.gemini.pct7d, fams.gemini.reset7dPassed, fams.gemini.reset7dAt || eff.reset7dAt);
                  if (chip) compactChips.push(chip);
                }
                if (fams.claude) {
                  const chip = renderCompactPoolChip('Claude/GPT', fams.claude.pct5h, fams.claude.reset5hPassed, fams.claude.reset5hAt || eff.reset5hAt, fams.claude.pct7d, fams.claude.reset7dPassed, fams.claude.reset7dAt || eff.reset7dAt);
                  if (chip) compactChips.push(chip);
                }
              } else if (eff && (eff.effective5hPct !== null || eff.effective7dPct !== null)) {
                const chip = renderCompactPoolChip('可用额度', eff.effective5hPct, eff.reset5hPassed, eff.reset5hAt, eff.effective7dPct, eff.reset7dPassed, eff.reset7dAt);
                if (chip) compactChips.push(chip);
              }

              const compactQuotaRow = compactChips.length
                ? `<div class="quota-fam-row">${compactChips.join('')}${obsTime ? `<span class="quota-fam-sync" title="上次额度同步时间">${escapeHtml(obsTime)}</span>` : ''}</div>`
                : `<p class="relay-sub" style="font-size:11px;">切过去登录一次即自动记录额度（点 ⋯ 可手动补充）</p>`;

              return (
                `<article class="relay-card is-account-slot is-standby-compact" data-standby-id="${escapeHtml(a.id)}" data-standby-name="${escapeHtml(ident.title)}" title="双击卡片空白处可快速启动 5 秒切号倒计时">` +
                  `<div class="relay-card-head">` +
                    `<div class="search-card-meta">` +
                      standbyRoleBadge +
                      `<span class="relay-title" title="${escapeHtml(a.email)}">${escapeHtml(ident.title)}</span>` +
                      (ident.handleSub ? `<span class="relay-handle-sub">${escapeHtml(ident.handleSub)}</span>` : '') +
                      tierBadge + recBadge + backupBadge +
                    `</div>` +
                    `<div class="search-card-actions">` +
                      `<button type="button" class="mini-btn is-primary" data-acc-action="countdown" data-id="${escapeHtml(a.id)}" data-display-name="${escapeHtml(ident.title)}" title="${escapeHtml(switchCtaTip)}">${switchCtaText}</button>` +
                      `<button type="button" class="mini-btn icon-more-btn${moreOpen ? ' is-open' : ''}" data-acc-action="toggle-more" data-id="${escapeHtml(a.id)}" title="展开管理操作与详情" aria-label="更多操作">⋯</button>` +
                    `</div>` +
                  `</div>` +
                  compactQuotaRow +
                  moreDrawerHtml +
                `</article>`
              );
            };

            if (st.sortMode === 'primary-first') {
              const ordered = [...accs].sort((a, b) => {
                if ((a.role === 'primary') !== (b.role === 'primary')) return a.role === 'primary' ? -1 : 1;
                return (Number(a.priority) || 50) - (Number(b.priority) || 50);
              });
              for (const a of ordered) {
                mainParts.push(renderAccountCard(a));
              }
            } else {
              const activeList = accs.filter((a) => a.isCurrentActive);
              const standbyList = accs.filter((a) => !a.isCurrentActive).sort((a, b) => computeStandbyScore(b) - computeStandbyScore(a));
              for (const a of activeList) {
                mainParts.push(renderAccountCard(a));
              }
              if (standbyList.length) {
                if (activeList.length) {
                  mainParts.push(
                    `<div class="relay-section-head">` +
                      `<span class="relay-section-head-left">待切换账号 (${standbyList.length})</span>` +
                      `<span style="font-weight:400;font-size:10.5px;">双击卡片快速切 · 悬停胶囊看重置时间 · 点 ⋯ 管理</span>` +
                    `</div>`
                  );
                }
                const standbyCardsHtml = standbyList.map((a) => renderAccountCard(a)).join('');
                mainParts.push(`<div class="accounts-standby-grid${standbyList.length >= 2 ? ' has-multi' : ''}">${standbyCardsHtml}</div>`);
              }
            }
          }

          mainParts.push(
            '<article class="relay-card">' +
              '<div class="relay-card-head">' +
                '<span class="relay-title">捕获新账号与快捷操作</span>' +
                '<div class="relay-form-row">' +
                  '<button type="button" class="mini-btn" data-acc-action="snapshot">写交接快照</button>' +
                  '<button type="button" class="mini-btn" data-acc-action="verify">校验隔离</button>' +
                  '<button type="button" class="mini-btn is-danger-subtle" data-acc-action="disable">关闭模块</button>' +
                '</div>' +
              '</div>' +
              '<div class="relay-form-row">' +
                '<input id="acc-capture-alias" class="text-input" style="max-width:140px;" type="text" placeholder="别名（如 主号/备1）" />' +

                focus: msg.focus !== false,
                replyWin,
                replyOrigin

              requestId: String(msg.requestId || ''),
              sessionId: String(msg.sessionId || ''),

      const safeCssEscape = (raw) => {
        const s = String(raw ?? '');
        return (typeof CSS !== 'undefined' && typeof CSS.escape === 'function')
          ? CSS.escape(s)
          : s.replace(/[^a-zA-Z0-9_-]/g, '\\$&');
      };

      accountsWrap.addEventListener('keydown', (event) => {
        if (event.isComposing || event.keyCode === 229) return;
        const t = event.target;
        if (!t || typeof t.id !== 'string' || !t.id.startsWith('ae-alias-')) return;
        const id = t.id.slice('ae-alias-'.length);
        if (event.key === 'Enter') {
          event.preventDefault();
          accountsWrap.querySelector(`button[data-acc-action="save-alias"][data-id="${safeCssEscape(id)}"]`)?.click();
        } else if (event.key === 'Escape') {
          event.preventDefault();
          appState.accounts.editingAliasId = '';
          renderAccounts();
        }
      });

      accountsWrap.addEventListener('change', (event) => {
        if (event.target && event.target.id === 'acc-cd-snap' && appState.accounts.countdown) {
          appState.accounts.countdown.saveSnapshot = Boolean(event.target.checked);
        } else if (event.target && event.target.id === 'acc-cd-relaunch' && appState.accounts.countdown) {
          const autoR = Boolean(event.target.checked);
          appState.accounts.countdown.autoRelaunch = autoR;
          if (appState.accounts.data) appState.accounts.data.autoRelaunchAfterSwitch = autoR;
          const nowBtn = accountsWrap.querySelector('button[data-acc-action="cd-now"]');
          if (nowBtn) nowBtn.textContent = autoR ? '立即切换并重启' : '立即切换';
          callServerTool('accounts_toggle_enabled', { autoRelaunchAfterSwitch: autoR }).catch(() => {});
        } else if (event.target && event.target.classList && event.target.classList.contains('radar-pick-cb')) {
          const copyAllBtn = document.getElementById('radar-copy-all-btn');
          if (copyAllBtn) {
            const cnt = accountsWrap.querySelectorAll('.radar-pick-cb:checked').length;
            const nextLabel = `📋 一键复制已勾融合指令 (${cnt})`;
            if (copyAllBtn.dataset.origHtml !== undefined) {
              copyAllBtn.dataset.origHtml = escapeHtml(nextLabel);
            } else {
              copyAllBtn.textContent = nextLabel;
            }
          }
        }
      });

      accountsWrap.addEventListener('click', async (event) => {
        const tierToggle = event.target.closest('[data-wb-tier-toggle]');
        if (tierToggle) {
          event.preventDefault();
          event.stopPropagation();
          const modes = ['badge', 'icon', 'text'];
          const next = modes[(modes.indexOf(getWbTierBadgeMode()) + 1) % modes.length];
          if (activePrismTheme) activePrismTheme.tierBadgeMode = next;
          try { localStorage.setItem(PRISM_WB_TIER_MODE_KEY, next); } catch {}
          postBridgeToMain({ type: 'set-tier-badge-mode', mode: next });
          renderAccounts();
          return;
        }
        const btn = event.target.closest('button[data-acc-action]');
        if (!btn) return;
        const act = btn.dataset.accAction;
        try {
          if (act === 'reload-tab') {
            await loadAccountsTab({ forceRefresh: true });
          } else if (act === 'enable') {
            await callServerTool('accounts_toggle_enabled', { enabled: true });

          } else if (act === 'disable') {

          } else if (act === 'verify') {
            const res = await callServerTool('accounts_verify_integrity', {});

          } else if (act === 'relaunch-now') {
            btn.disabled = true;
            const res = await callServerTool('accounts_relaunch_client', { dryRun: false });

            if (res?.ok && res?.scheduled) {
              showToast(res.message || '正在自动关闭并重开 Antigravity，请稍候…');
            } else {
              showToast(res?.error || '调度自动重启失败，请手动重启客户端', true);

          } else if (act === 'capture' || act === 'capture-quick') {
            const aliasEl = document.getElementById('acc-capture-alias');
            const roleEl = document.getElementById('acc-capture-role');
            const res = await callServerTool('accounts_capture', {

          } else if (act === 'snapshot') {

              startSwitchCountdown({ ...acc, alias: display });
            }
          } else if (act === 'toggle-more') {
            const id = btn.dataset.id;
            if (id) {
              const nextOpen = !appState.accounts.expandedMoreIds[id];
