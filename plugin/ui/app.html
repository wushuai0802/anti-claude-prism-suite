          } else if (act === 'cd-pause' && appState.accounts.countdown) {
            const cd = appState.accounts.countdown;
            if (!cd.paused) {
              cd.paused = true;
              cd.pausedRemainMs = Math.max(0, (cd.endAtMs || Date.now()) - Date.now());
              if (countdownRaf) {
                cancelAnimationFrame(countdownRaf);
                countdownRaf = null;
              }
            } else {
              cd.paused = false;
              cd.endAtMs = Date.now() + (cd.pausedRemainMs || cd.totalMs);
              countdownLastSec = -1;
              countdownRaf = requestAnimationFrame(tickCountdownFrame);
            }
            renderAccounts();
          } else if (act === 'cd-now' && appState.accounts.countdown) {
            const cd = appState.accounts.countdown;
            await executeAccountSwitchNow(cd.targetId, cd.saveSnapshot, cd.autoRelaunch, cd.autoCaptureUncaptured !== false);
          } else if (act === 'cd-cancel') {
            stopCountdown(true);
            showToast('已取消切号倒计时');
          } else if (act === 'dryrun') {
            const res = await callServerTool('accounts_switch', { targetId: btn.dataset.id, dryRun: true, autoCaptureUncaptured: true });
            showToast(res.ok ? res.message : formatAccountErrorMessage(res.error, '预演拦截'), !res.ok);
          } else if (act === 'edit-quota') {
            appState.accounts.editingQuotaId = appState.accounts.editingQuotaId === btn.dataset.id ? '' : btn.dataset.id;
            renderAccounts();
          } else if (act === 'cancel-quota') {
            appState.accounts.editingQuotaId = '';
            renderAccounts();
          } else if (act === 'save-quota') {
            const id = btn.dataset.id;
            const v5 = document.getElementById(`qe-5h-${id}`)?.value?.trim();
            const v7 = document.getElementById(`qe-7d-${id}`)?.value?.trim();
            const r5 = document.getElementById(`qe-r5h-${id}`)?.value?.trim();
            const raw = document.getElementById(`qe-raw-${id}`)?.value?.trim();
            const quota = {};
            if (v5 !== '' && v5 !== undefined) quota.window5hPct = Number(v5);
            if (v7 !== '' && v7 !== undefined) quota.window7dPct = Number(v7);
            if (r5 !== '' && r5 !== undefined && Number(r5) > 0) quota.reset5hInHours = Number(r5);
            if (raw) quota.rawText = raw;
            const res = await callServerTool('accounts_update', { accountId: id, quota });
            if (res.ok) {
              appState.accounts.editingQuotaId = '';
              showToast('已更新该账号额度快照');
              await loadAccountsTab();
            } else {
              showToast(res.error || '保存额度失败', true);
            }
          } else if (act === 'setrole') {
            const res = await callServerTool('accounts_update', { accountId: btn.dataset.id, role: btn.dataset.role });
            if (res.ok) {
              showToast(`已设为 ${btn.dataset.role === 'primary' ? '主账号' : '备用账号'}`);
              await loadAccountsTab();
            } else {
              showToast(res.error || '修改失败', true);
            }
          } else if (act === 'delete') {
            if (!requireInlineConfirm(btn, '确认删除？')) return;
            const res = await callServerTool('accounts_delete', { accountId: btn.dataset.id });
            showToast(res.ok ? '已移除隔离备份槽（不影响当前登录与会话）' : (res.error || '移除失败'), !res.ok);
            await loadAccountsTab();
          } else if (act === 'dismiss-sw') {
            appState.accounts.lastSwitchResult = null;
            renderAccounts();
          } else if (act === 'copy-ext-mem' && appState.accounts.lastSwitchResult?.externalMemoryPrompt) {
            const ok = await copyTextSafe(appState.accounts.lastSwitchResult.externalMemoryPrompt);
            if (ok) flashButtonFeedback(btn, '✓ 已复制', 1200);
            showToast(ok ? '已复制外部 memory_store 指令' : '复制失败', !ok);
          } else if (act === 'copy-resume' && appState.accounts.lastSwitchResult?.resumePrompt) {
            const ok = await copyTextSafe(appState.accounts.lastSwitchResult.resumePrompt);
            if (ok) flashButtonFeedback(btn, '✓ 已复制', 1200);
            showToast(ok ? '已复制切后「接力」提示' : '复制失败', !ok);
          } else if (act === 'mem-copy-ext') {
            const item = appState.accounts.memories[Number(btn.dataset.idx)];
            if (item?.externalMemoryPrompt) {
              const ok = await copyTextSafe(item.externalMemoryPrompt);
              if (ok) flashButtonFeedback(btn, '✓ 已复制', 1200);
              showToast(ok ? '已复制外部 memory_store 指令' : '复制失败', !ok);
            }
          } else if (act === 'mem-copy-resume') {
            const item = appState.accounts.memories[Number(btn.dataset.idx)];
            if (item?.resumePrompt) {
              const ok = await copyTextSafe(item.resumePrompt);
              if (ok) flashButtonFeedback(btn, '✓ 已复制', 1200);
              showToast(ok ? '已复制「接力」恢复提示' : '复制失败', !ok);
            }
          } else if (act === 'mem-del') {
            if (!requireInlineConfirm(btn, '确认删除？')) return;
            await callServerTool('handoff_memory_remove', { id: btn.dataset.id });
            showToast('已删除该条交接记忆');
            await loadAccountsTab();
          } else if (act === 'cat-open-form') {
            appState.accounts.showCatalogForm = !appState.accounts.showCatalogForm;
            appState.accounts.openSections.catalog = true;
            renderAccounts();
          } else if (act === 'cat-cancel') {
            appState.accounts.showCatalogForm = false;
            renderAccounts();
          } else if (act === 'cat-save') {
            const project = document.getElementById('cat-proj-in')?.value?.trim() || '';
            const slot = document.getElementById('cat-slot-in')?.value?.trim() || 'main';
            const cwd = document.getElementById('cat-cwd-in')?.value?.trim() || '';
            const summary = document.getElementById('cat-sum-in')?.value?.trim() || '';
            await callServerTool('handoff_catalog_upsert', { project, slot, cwd, summary });
            appState.accounts.showCatalogForm = false;
            showToast('已更新 catalog:master 槽位索引');
            await loadAccountsTab();
          } else if (act === 'cat-reveal') {
            if (btn.dataset.cwd) await revealPath(btn.dataset.cwd);
          } else if (act === 'cat-copy-resume') {
            const s = appState.accounts.catalogSlots[Number(btn.dataset.idx)];
            if (s?.resumePrompt) {
              const ok = await copyTextSafe(s.resumePrompt);
              if (ok) flashButtonFeedback(btn, '✓ 已复制', 1200);
              showToast(ok ? `已复制 ${s.slotTag} 接力口令` : '复制失败', !ok);
            }
          } else if (act === 'rem-open-cfg') {
            appState.accounts.showRemoteConfig = !appState.accounts.showRemoteConfig;
            appState.accounts.openSections.catalog = true;
            if (!appState.models.loaded) {
              loadModelsTab({ silent: true }).then(() => renderAccounts());
            } else {
              renderAccounts();
            }
          } else if (act === 'rem-cancel') {
            appState.accounts.showRemoteConfig = false;
            renderAccounts();
          } else if (act === 'rem-save') {
            const urlVal = document.getElementById('rem-mem-url')?.value?.trim() || '';
            const envVal = document.getElementById('rem-mem-env')?.value?.trim() || '';
            const upd = await callServerTool('model_hub_update_settings', {
              remoteMemory: urlVal
                ? { enabled: true, endpointUrl: urlVal, apiKeyEnv: envVal }
                : false
            });
            if (upd?.profile) appState.models.data = upd.profile;
            if (upd?.remoteSync) appState.accounts.remoteSync = upd.remoteSync;
            appState.accounts.showRemoteConfig = false;
            showToast(urlVal ? '已开启远程 HTTP Memory 异步桥' : '已关闭远程 Memory 桥');
            await loadAccountsTab();
          } else if (act === 'rem-sync-now') {
            appState.accounts.syncingRemote = true;
            renderAccounts();
            const syncRes = await callServerTool('handoff_remote_sync', { limit: 20 });
            appState.accounts.syncingRemote = false;
            if (syncRes?.remoteSync) appState.accounts.remoteSync = syncRes.remoteSync;
            showToast(syncRes?.ok ? `已从远程同步 ${syncRes.updatedSlots || 0} 个槽位` : (syncRes?.error || '远程离线，继续使用本地 SQLite'), !syncRes?.ok);
            await loadAccountsTab();
          } else if (act === 'toggle-exposure') {
            const k = btn.dataset.expKey || '';
            const nextVal = btn.dataset.expVal === '1';
            if (k) {
              appState.accounts.openSections.exposure = true;
              const res = await callServerTool('plugin_exposure_update', { [k]: nextVal });
              if (res?.ok) {
                appState.accounts.exposure = res;
                if (appState.prefs) appState.prefs.mcpExposure = res.mcpExposure;
              }
              renderAccounts();
              showToast(res?.message || '已更新插件暴露配置');
            }
          } else if (act === 'self-update-check') {
            appState.accounts.selfUpdateChecking = true;
            appState.accounts.selfUpdateConfirmRepair = false;
            appState.accounts.openSections.radar = true;
            renderAccounts();
            const info = await callServerTool('prism_self_update_check', {});
            appState.accounts.selfUpdateChecking = false;
            appState.accounts.selfUpdateInfo = info;
            renderAccounts();
            showToast(info?.hasUpdate ? `发现新版本 ${info.latestTag}，可点击「一键更新」升级` : `当前已是最新正式版 v${info?.currentVersion || '0.9.4'}`);
          } else if (act === 'self-update-repair-ask') {
            appState.accounts.selfUpdateConfirmRepair = true;
            renderAccounts();
          } else if (act === 'self-update-repair-cancel') {
            appState.accounts.selfUpdateConfirmRepair = false;
            renderAccounts();
          } else if (act === 'self-update-apply' || act === 'self-update-repair') {
            if (act === 'self-update-apply' && !requireInlineConfirm(btn, '确认执行？')) return;
            const isForce = act === 'self-update-repair';
            appState.accounts.selfUpdateApplying = true;
            appState.accounts.selfUpdateConfirmRepair = false;
            appState.accounts.openSections.radar = true;
            setTopProgress(true);
            renderAccounts();
            const res = await callServerTool('prism_self_update_apply', { force: isForce });
            appState.accounts.selfUpdateApplying = false;
            setTopProgress(false);
            if (res && !res.skipped) appState.accounts.selfUpdateResult = res;
            renderAccounts();
            showToast(res?.message || `已更新至 ${res?.updatedTo || '最新版本'}，请重启 Antigravity 生效`);
          } else if (act === 'radar-check') {
            appState.accounts.radarLoading = true;
            appState.accounts.openSections.radar = true;
            appState.accounts.openSections.radarList = true;
            renderAccounts();
            const rep = await callServerTool('check_upstreams', { force: true });
            appState.accounts.radarLoading = false;
            appState.accounts.radarReport = rep;
            appState.accounts.openSections.radar = true;
            appState.accounts.openSections.radarList = true;
            renderAccounts();
            showToast(`上游检查完成：重要更新 ${rep?.summary?.high ?? 0} 项 / 常规更新 ${rep?.summary?.medium ?? 0} 项`);
          } else if (act === 'radar-collapse') {
            appState.accounts.openSections.radarList = false;
            appState.accounts.radarListTouchedByUser = true;
            renderAccounts();
          } else if (act === 'radar-copy-all-picked' || act === 'radar-copy-picked') {
            const targetKey = act === 'radar-copy-picked' ? (btn.dataset.key || '') : '';
            const selector = targetKey
              ? `.radar-pick-cb[data-key="${safeCssEscape(targetKey)}"]:checked`
              : '.radar-pick-cb:checked';
            const checks = Array.from(accountsWrap.querySelectorAll(selector));
            const allResults = Array.isArray(appState.accounts.radarReport?.results)
              ? appState.accounts.radarReport.results
              : [];
            if (!checks.length) {
              showToast('当前未勾选任何需融合的条目；若确认全部跳过，直接点击「✅ 一键同步全部基线」即可归绿', true);
              return;
            }
            const byRepo = new Map();
            for (const cb of checks) {
              const repo = cb.dataset.repo || cb.dataset.key || 'unknown';
              if (!byRepo.has(repo)) {
                byRepo.set(repo, {
                  key: cb.dataset.key || '',
                  repo,
                  license: cb.dataset.license || '',
                  roleZh: cb.dataset.roleZh || '',
                  items: []
                });
              }
              byRepo.get(repo).items.push({
                sha: cb.dataset.sha || '-',
                tagZh: cb.dataset.tagZh || '更新',
                zh: cb.dataset.zh || '',
                msg: cb.dataset.msg || ''
              });
            }
            const promptLines = [
              '请评估以下我在 Prism 上游雷达中勾选的变更，以 Clean-room 方式择优融合进 `anti-claude-prism-suite`（未勾选条目一律跳过，严禁照搬照抄或引入 GPL 源码），完成后一并同步 `upstream.json` 与 `plugin/upstream.json` 基线：'
            ];
            let secIdx = 1;
            for (const grp of byRepo.values()) {
              const metaBits = [grp.license, grp.roleZh].filter(Boolean).join(' · ');
              const isGpl = /GPL/i.test(grp.license);
              promptLines.push('');
              promptLines.push(`### ${secIdx}. ${grp.repo}${metaBits ? `（${metaBits}）` : ''}`);
              if (isGpl) {
                promptLines.push('> 注意：该仓库为 GPL 协议，仅参考公开交互思路或兼容信号，严禁复制或转写其源码。');
              }
              for (const it of grp.items) {
                const zhDiffers = it.zh && it.zh !== it.msg;
                promptLines.push(`- \`${it.sha}\` [${it.tagZh}] ${it.zh || it.msg}`);
                if (zhDiffers && it.msg) {
                  promptLines.push(`  - 原文：\`${it.msg}\``);
                }
              }
              secIdx++;
            }
            if (!targetKey) {
              const skippedUpdated = allResults.filter((r) => r.hasUpdate && !byRepo.has(r.repo));
              if (skippedUpdated.length) {
                promptLines.push('');
                promptLines.push(`### ${secIdx}. 本轮未勾选代码融合、直接同步基线的仓库`);
                for (const sr of skippedUpdated) {
                  promptLines.push(`- \`${sr.repo}\`（${sr.baselineTag || sr.baselineCommit || '-'} → ${sr.latestTag || sr.latestCommit || '-'}）`);
                }
              }
            }
            const ok = await copyTextSafe(promptLines.join('\n'));
            if (ok) flashButtonFeedback(btn, '✓ 已复制', 1200);
            showToast(ok ? `已合并复制 ${byRepo.size} 个仓库共 ${checks.length} 条融合指令，粘贴给 AI 即可` : '复制失败', !ok);
          } else if (act === 'radar-sync-all') {
            await callServerTool('sync_upstream_baseline', { keys: [] });
            showToast('已将全部上游仓库基线同步至最新并归绿');
            appState.accounts.radarReport = await callServerTool('check_upstreams', { force: true });
            renderAccounts();
          } else if (act === 'radar-sync-key') {
            const key = btn.dataset.key;
            await callServerTool('sync_upstream_baseline', { keys: [key] });
            showToast(`已将 ${key} 基线同步至最新并归绿`);
            appState.accounts.radarReport = await callServerTool('check_upstreams', { force: true });
            renderAccounts();
          } else if (act === 'radar-copy' && appState.accounts.radarReport?.markdown) {
            const ok = await copyTextSafe(appState.accounts.radarReport.markdown);
            if (ok) flashButtonFeedback(btn, '✓ 已复制', 1200);
            showToast(ok ? '已复制上游择优评估简报' : '复制失败', !ok);
          }
        } catch (err) {
          appState.accounts.radarLoading = false;
          appState.accounts.selfUpdateChecking = false;
          appState.accounts.selfUpdateApplying = false;
          setTopProgress(false);
          showToast(formatAccountErrorMessage(err, '操作失败'), true);
          renderAccounts();
        }
      });

      // Model Hub Topbar, Local Filter Bar & Panel Event Delegation
      if (modelsFilterInput) {
        modelsFilterInput.addEventListener('input', () => {
          appState.models.query = modelsFilterInput.value;
          if (btnClearModelsFilter) btnClearModelsFilter.hidden = !modelsFilterInput.value;
          renderModels();
        });
        modelsFilterInput.addEventListener('keydown', (event) => {
          if (event.isComposing) return;
          if (event.key === 'Escape') {
            if (modelsFilterInput.value) {
              event.preventDefault();
              event.stopPropagation();
              modelsFilterInput.value = '';
              appState.models.query = '';
              renderModels();
            } else if (!appState.models.showProviderForm && !appState.models.showModelForm) {
              modelsFilterInput.blur();
            }
          }
        });
      }
      if (btnClearModelsFilter) {
        btnClearModelsFilter.addEventListener('click', () => {
          if (modelsFilterInput) modelsFilterInput.value = '';
          appState.models.query = '';
          renderModels();
          modelsFilterInput?.focus();
        });
      }
      for (const fBtn of modelsFilterBtns) {
        fBtn.addEventListener('click', () => {
          const clickedTf = fBtn.dataset.mhubFilter || 'all';
          const nextTf = (clickedTf !== 'all' && appState.models.tierFilter === clickedTf) ? 'all' : clickedTf;
          if (appState.models.tierFilter === nextTf) return;
          appState.models.tierFilter = nextTf;
          renderModels();
        });
      }

      async function runModelHubDiscovery(explicitProviderId = '') {
        const st = appState.models;
        const providers = Array.isArray(st.data?.providers) ? st.data.providers : [];
        const pid = explicitProviderId || document.getElementById('mh-disc-prov')?.value || st.discoverProviderId || providers[0]?.id || '';
        if (!pid) {
          showToast('请先添加至少一个兼容网关', true);
          return;
        }
        const seq = ++st.discoverSeq;
        st.discoverProviderId = pid;
        st.discoverLoading = true;
        st.discoverError = '';
        renderModels();
        try {
          const res = await callServerTool('model_hub_discover_models', { providerId: pid });
          if (seq !== st.discoverSeq) return;
          st.discoverLoading = false;
          if (res?.ok) {
            st.discoverItems = Array.isArray(res.models) ? res.models : (Array.isArray(res.items) ? res.items : []);
            st.discoverSelected = {};
            showToast(`已从 ${pid} 发现 ${st.discoverItems.length} 个模型（对话模型 ${res.chatCount ?? st.discoverItems.length} 个）`);
          } else {
            st.discoverItems = [];
            st.discoverError = res?.error || '未能拉取模型列表';
          }
        } catch (err) {
          if (seq !== st.discoverSeq) return;
          st.discoverLoading = false;
          st.discoverError = err?.message || '拉取模型列表失败';
        }
        renderModels();
      }

      if (btnMhubAddProvider) {
        btnMhubAddProvider.addEventListener('click', () => {
          const closing = appState.models.showProviderForm && !appState.models.editingProviderId;
          appState.models.showProviderForm = !closing;
          appState.models.editingProviderId = '';
          if (!closing) {
            appState.models.showModelForm = false;
            appState.models.showDiscoverPanel = false;
          }
          renderModels();
        });
      }
      if (btnMhubDiscover) {
        btnMhubDiscover.addEventListener('click', () => {
          const nextOpen = !appState.models.showDiscoverPanel;
          appState.models.showDiscoverPanel = nextOpen;
          if (nextOpen) {
            appState.models.showProviderForm = false;
            appState.models.showModelForm = false;
          }
          renderModels();
        });
      }
      if (btnMhubAddModel) {
        btnMhubAddModel.addEventListener('click', () => {
          const closing = appState.models.showModelForm && !appState.models.editingModelId;
          appState.models.showModelForm = !closing;
          appState.models.editingModelId = '';
          if (!closing) {
            appState.models.showProviderForm = false;
            appState.models.showDiscoverPanel = false;
          }
          renderModels();
        });
      }
      if (btnMhubAiSetup) {
        btnMhubAiSetup.addEventListener('click', async () => {
          const prompt = buildZeroSecretAiSetupPrompt(appState.models.data?.profilePath);
          const ok = await copyTextSafe(prompt);
          if (ok) flashButtonFeedback(btnMhubAiSetup, '✓ 已复制口令', 1300);
          showToast(ok ? '已复制零密钥 AI 自动部署口令，粘贴到对话即可' : '复制失败', !ok);
        });
      }
      if (btnMhubRevealProfile) {
        btnMhubRevealProfile.addEventListener('click', async () => {
          try {
            const res = await callServerTool('model_hub_reveal_profile', {});
            if (res?.ok) {
              showToast(`已在 ${appState.platformLabel || '系统文件管理器'} 中定位 prism-profile.json`);
            } else {
              showToast(res?.error || '定位配置文件失败', true);
            }
          } catch (err) {
            showToast(err?.message || '定位配置文件失败', true);
          }
        });
      }
      if (btnMhubProbeFavs) {
        btnMhubProbeFavs.addEventListener('click', async () => {
          const d = appState.models.data;
          const targets = (d?.favorites?.length ? d.favorites : (d?.models || []).map((m) => m.id)).slice(0, 6);
          if (!targets.length || appState.models.batchProbing) return;
          appState.models.batchProbing = true;
          renderModels();
          let okCnt = 0;
          for (const id of targets) {
            appState.models.probingIds[id] = true;
            renderModels();
            try {
              const r = await callServerTool('model_hub_probe_speed', { modelId: id });
              if (r?.profile) appState.models.data = r.profile;
              if (r?.ok) okCnt++;
            } catch {}
            delete appState.models.probingIds[id];
            renderModels();
          }
          appState.models.batchProbing = false;
          renderModels();
          showToast(`批量测速完成：${okCnt}/${targets.length} 可用`);
        });
      }

      if (modelsWrap) {
        modelsWrap.addEventListener('toggle', (event) => {
          const det = event.target;
          if (det && det.matches && det.matches('details.relay-accordion[data-mhub-sec]')) {
            appState.models.openSections[det.dataset.mhubSec] = Boolean(det.open);
          }
        }, true);

        modelsWrap.addEventListener('input', (event) => {
          const t = event.target;
          if (t && t.dataset && t.dataset.autofilled === '1') {
            t.dataset.autofilled = '0';
          }
          if (t && t.id === 'mh-disc-filter') {
            const pos = t.selectionStart;
            appState.models.discoverQuery = t.value;
            renderModels();
            const nextIn = document.getElementById('mh-disc-filter');
            if (nextIn) {
              nextIn.focus();
              if (typeof pos === 'number') {
                try { nextIn.setSelectionRange(pos, pos); } catch {}
              }
            }
          }
        });

        modelsWrap.addEventListener('change', async (event) => {
          const t = event.target;
          if (!t) return;
          if (t.id === 'mh-disc-prov') {
            ++appState.models.discoverSeq;
            appState.models.discoverLoading = false;
            appState.models.discoverProviderId = t.value;
            appState.models.discoverItems = [];
            appState.models.discoverSelected = {};
            appState.models.discoverError = '';
            renderModels();
            return;
          }
          if (t.id === 'mh-disc-chatonly') {
            appState.models.discoverChatOnly = Boolean(t.checked);
            renderModels();
            return;
          }
          if (t.classList && t.classList.contains('mhub-disc-cb')) {
            const mid = t.dataset.modelId;
            if (mid) {
              if (t.checked) {
                const tierSel = modelsWrap.querySelector(`select[data-disc-tier-for="${safeCssEscape(mid)}"]`);
                appState.models.discoverSelected[mid] = tierSel?.value || t.dataset.defTier || 'T2';
              } else {
                delete appState.models.discoverSelected[mid];
              }
              renderModels();
            }
            return;
          }
          if (t.dataset && t.dataset.discTierFor) {
            const mid = t.dataset.discTierFor;
            if (appState.models.discoverSelected[mid]) {
              appState.models.discoverSelected[mid] = t.value;
            }
            return;
          }
          if (t.id === 'mh-prov-preset') {
            const pKey = t.value;
            const preset = appState.models.data?.presets?.[pKey];
            if (preset) {
              const protoEl = document.getElementById('mh-prov-proto');
              const urlEl = document.getElementById('mh-prov-url');
              const envEl = document.getElementById('mh-prov-env');
              const lblEl = document.getElementById('mh-prov-label');
              const idEl = document.getElementById('mh-prov-id');
              const klEl = document.getElementById('mh-prov-keyless');
              const setAutofillable = (el, val) => {
                if (!el) return;
                if (!el.value.trim() || el.dataset.autofilled === '1') {
                  el.value = val || '';
                  el.dataset.autofilled = '1';
                }
              };
              if (protoEl) protoEl.value = preset.protocol;
              setAutofillable(urlEl, preset.defaultBaseUrl || '');
              setAutofillable(envEl, preset.suggestedEnv || '');
              setAutofillable(lblEl, preset.label || '');
              if (idEl && !idEl.readOnly) setAutofillable(idEl, pKey);
              if (klEl) klEl.checked = pKey === 'ollama-local';
            }
          } else if (t.id === 'mh-set-websearch' || t.id === 'mh-set-redact') {
            try {
              const ws = Boolean(document.getElementById('mh-set-websearch')?.checked);
              const rd = Boolean(document.getElementById('mh-set-redact')?.checked);
              const res = await callServerTool('model_hub_update_settings', {
                webSearch: ws,
                redactOutboundSecrets: rd
              });
              if (res?.profile) appState.models.data = res.profile;
              showToast('已保存模型中枢安全护栏设置');
            } catch (err) {
              showToast(err?.message || '保存设置失败', true);
            }
          }
        });

        // HTML5 Drag-and-Drop Favorites Reordering
        modelsWrap.addEventListener('dragstart', (event) => {
          const chip = event.target.closest('.mhub-fav-chip[data-fav-id]');
          if (!chip || !event.dataTransfer) return;
          const id = chip.dataset.favId;
          appState.models.draggingFavId = id;
          chip.classList.add('is-dragging');
          event.dataTransfer.effectAllowed = 'move';
          try { event.dataTransfer.setData('text/plain', id); } catch {}
        });

        modelsWrap.addEventListener('dragover', (event) => {
          const chip = event.target.closest('.mhub-fav-chip[data-fav-id]');
          if (!chip || !appState.models.draggingFavId) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
          modelsWrap.querySelectorAll('.mhub-fav-chip.is-drop-target').forEach((n) => {
            if (n !== chip) n.classList.remove('is-drop-target');
          });
          if (chip.dataset.favId !== appState.models.draggingFavId) {
            chip.classList.add('is-drop-target');
          }
        });

        modelsWrap.addEventListener('dragend', () => {
          appState.models.draggingFavId = '';
          modelsWrap.querySelectorAll('.mhub-fav-chip').forEach((n) => {
            n.classList.remove('is-dragging', 'is-drop-target');
          });
        });

        modelsWrap.addEventListener('drop', async (event) => {
          const targetChip = event.target.closest('.mhub-fav-chip[data-fav-id]');
          const fromId = appState.models.draggingFavId;
          appState.models.draggingFavId = '';
          modelsWrap.querySelectorAll('.mhub-fav-chip').forEach((n) => {
            n.classList.remove('is-dragging', 'is-drop-target');
          });
          if (!targetChip || !fromId || appState.models.reorderingFavs) return;
          event.preventDefault();
          const toId = targetChip.dataset.favId;
          if (!toId || fromId === toId) return;
          const curFavs = [...(appState.models.data?.favorites || [])];
          const fromIdx = curFavs.indexOf(fromId);
          const toIdx = curFavs.indexOf(toId);
          if (fromIdx === -1 || toIdx === -1) return;
          curFavs.splice(fromIdx, 1);
          curFavs.splice(toIdx, 0, fromId);
          appState.models.reorderingFavs = true;
          try {
            const res = await callServerTool('model_hub_reorder_favorites', { orderedIds: curFavs });
            if (res?.profile) appState.models.data = res.profile;
            renderModels();
            showToast('已更新常用模型优先序');
          } catch (err) {
            showToast(err?.message || '排序保存失败', true);
          } finally {
            appState.models.reorderingFavs = false;
          }
        });

        modelsWrap.addEventListener('click', async (event) => {
          const btn = event.target.closest('button[data-mhub-action]');
          if (!btn) return;
          const act = btn.dataset.mhubAction;
          try {
            if (act === 'reload') {
              await loadModelsTab();
            } else if (act === 'open-add-provider') {
              appState.models.showProviderForm = true;
              appState.models.editingProviderId = '';
              appState.models.showDiscoverPanel = false;
              renderModels();
            } else if (act === 'copy-ai-setup') {
              const prompt = buildZeroSecretAiSetupPrompt(appState.models.data?.profilePath);
              const ok = await copyTextSafe(prompt);
              if (ok) flashButtonFeedback(btn, '✓ 已复制', 1200);
              showToast(ok ? '已复制零密钥 AI 自动部署口令' : '复制失败', !ok);
            } else if (act === 'reveal-profile') {
              const res = await callServerTool('model_hub_reveal_profile', {});
              showToast(res?.ok ? `已定位 ${res.path || 'prism-profile.json'}` : (res?.error || '定位失败'), !res?.ok);
            } else if (act === 'discover-provider') {
              appState.models.showDiscoverPanel = true;
              appState.models.showProviderForm = false;
              appState.models.showModelForm = false;
              appState.models.discoverProviderId = btn.dataset.id || '';
              await runModelHubDiscovery(appState.models.discoverProviderId);
            } else if (act === 'close-discover') {
              appState.models.showDiscoverPanel = false;
              renderModels();
            } else if (act === 'run-discover') {
              await runModelHubDiscovery();
            } else if (act === 'disc-select-all') {
              const st = appState.models;
              const pid = st.discoverProviderId;
              const existingModels = Array.isArray(st.data?.models) ? st.data.models : [];
              const existingUpstreams = new Set(existingModels.filter((m) => m.providerId === pid).map((m) => String(m.upstreamModel || m.id)));
              const dq = String(st.discoverQuery || '').trim().toLowerCase();
              for (const it of st.discoverItems || []) {
                const keyId = String(it.upstreamModel || it.suggestedId || '');
                const sgId = String(it.suggestedId || keyId);
                if (!keyId) continue;
                if (st.discoverChatOnly && it.isChat === false) continue;
                if (dq && !keyId.toLowerCase().includes(dq) && !String(it.vendor || '').toLowerCase().includes(dq)) continue;
                if (it.alreadyAdded || existingUpstreams.has(keyId) || existingModels.some((m) => m.id === sgId || m.id === keyId)) continue;
                const tierSel = modelsWrap.querySelector(`select[data-disc-tier-for="${safeCssEscape(keyId)}"]`);
                st.discoverSelected[keyId] = tierSel?.value || it.tier || 'T2';
              }
              renderModels();
            } else if (act === 'disc-select-none') {
              appState.models.discoverSelected = {};
              renderModels();
            } else if (act === 'disc-import') {
              const st = appState.models;
              const pid = st.discoverProviderId;
              const itemsById = new Map((st.discoverItems || []).map((x) => [String(x.upstreamModel || x.suggestedId || ''), x]));
              const batch = Object.entries(st.discoverSelected || {})
                .filter(([, tier]) => Boolean(tier))
                .map(([mid, tier]) => {
                  const meta = itemsById.get(mid) || {};
                  const sg = meta.suggestedId || mid;
                  return {
                    id: sg,
                    upstreamModel: meta.upstreamModel || mid,
                    alias: sg,
                    tier,
                    vendor: meta.vendor || 'other',
                    favorite: tier === 'T1' || tier === 'T2'
                  };
                });
              if (!batch.length) return;
              st.discoverImporting = true;
              renderModels();
              const res = await callServerTool('model_hub_batch_import_models', { providerId: pid, items: batch });
              st.discoverImporting = false;
              if (res?.profile) st.data = res.profile;
              st.discoverSelected = {};
              st.showDiscoverPanel = false;
              renderModels();
              const addedCnt = Number(res?.added ?? (res?.importedIds || []).length) || 0;
              const skippedCnt = Number(res?.skipped) || 0;
              showToast(`批量导入完成：新增 ${addedCnt} 个模型${skippedCnt ? `（跳过已存在 ${skippedCnt} 个）` : ''}`);
            } else if (act === 'cancel-provider') {
              appState.models.showProviderForm = false;
              appState.models.editingProviderId = '';
              renderModels();
            } else if (act === 'edit-provider') {
              appState.models.showProviderForm = true;
              appState.models.editingProviderId = btn.dataset.id || '';
              appState.models.showModelForm = false;
              renderModels();
            } else if (act === 'save-provider') {
              const id = document.getElementById('mh-prov-id')?.value?.trim() || '';
              const label = document.getElementById('mh-prov-label')?.value?.trim() || '';
              const preset = document.getElementById('mh-prov-preset')?.value || '';
              const protocol = document.getElementById('mh-prov-proto')?.value || 'openai-chat';
              const baseUrl = document.getElementById('mh-prov-url')?.value?.trim() || '';
              const apiKeyEnv = document.getElementById('mh-prov-env')?.value?.trim() || '';
              const apiKeyVal = document.getElementById('mh-prov-key')?.value || '';
              const allowKeyless = Boolean(document.getElementById('mh-prov-keyless')?.checked);
              const payload = { id, label, preset, protocol, baseUrl, apiKeyEnv, allowKeyless };
              if (apiKeyVal.trim()) payload.apiKey = apiKeyVal.trim();
              const res = await callServerTool('model_hub_upsert_provider', payload);
              if (res?.profile) appState.models.data = res.profile;
              appState.models.showProviderForm = false;
              appState.models.editingProviderId = '';
              renderModels();
              showToast(`已保存网关 ${res?.provider?.label || id}`);
            } else if (act === 'clear-prov-vault') {
              const id = btn.dataset.id;
              const res = await callServerTool('model_hub_upsert_provider', { id, clearVaultKey: true });
              if (res?.profile) appState.models.data = res.profile;
              renderModels();
              showToast('已从系统隔离凭据库清除该网关密钥');
            } else if (act === 'del-provider') {
              if (!requireInlineConfirm(btn, '确认删除？')) return;
              const id = btn.dataset.id;
              const res = await callServerTool('model_hub_remove_provider', { providerId: id });
              if (res?.profile) appState.models.data = res.profile;
              renderModels();
              showToast(`已删除网关 ${id}`);
            } else if (act === 'cancel-model') {
              appState.models.showModelForm = false;
              appState.models.editingModelId = '';
              renderModels();
            } else if (act === 'edit-model') {
              appState.models.showModelForm = true;
              appState.models.editingModelId = btn.dataset.id || '';
              appState.models.showProviderForm = false;
              renderModels();
            } else if (act === 'save-model') {
              const providerId = document.getElementById('mh-mod-prov')?.value || '';
              const id = document.getElementById('mh-mod-id')?.value?.trim() || '';
              const upstreamModel = document.getElementById('mh-mod-upstream')?.value?.trim() || id;
              const alias = document.getElementById('mh-mod-alias')?.value?.trim() || id;
              const tier = document.getElementById('mh-mod-tier')?.value || 'T2';
              const vendor = document.getElementById('mh-mod-vendor')?.value || 'other';
              const fallbackModelId = document.getElementById('mh-mod-fb')?.value || '';
              const roleHint = document.getElementById('mh-mod-hint')?.value?.trim() || '';
              const favorite = Boolean(document.getElementById('mh-mod-fav')?.checked);
              const res = await callServerTool('model_hub_upsert_model', {
                id, providerId, upstreamModel, alias, tier, vendor, fallbackModelId, roleHint, favorite
              });
              if (res?.profile) appState.models.data = res.profile;
              appState.models.showModelForm = false;
              appState.models.editingModelId = '';
              renderModels();
              showToast(`已保存模型 ${alias}`);
            } else if (act === 'del-model') {
              const id = btn.dataset.id;
              const res = await callServerTool('model_hub_remove_model', { modelId: id });
              if (res?.profile) appState.models.data = res.profile;
              renderModels();
              showToast(`已移除模型 ${id}`);
            } else if (act === 'toggle-fav' || act === 'fav-remove') {
              const id = btn.dataset.id;
              const m = (appState.models.data?.models || []).find((x) => x.id === id);
              if (!m) return;
              const nextFav = act === 'fav-remove' ? false : !m.isFavorite;
              const res = await callServerTool('model_hub_upsert_model', { id: m.id, providerId: m.providerId, favorite: nextFav });
              if (res?.profile) appState.models.data = res.profile;
              renderModels();
            } else if (act === 'fav-move') {
              if (appState.models.reorderingFavs) return;
              const id = btn.dataset.id;
              const dir = Number(btn.dataset.dir) || 0;
              const cur = [...(appState.models.data?.favorites || [])];
              const idx = cur.indexOf(id);
              const nextIdx = idx + dir;
              if (idx === -1 || nextIdx < 0 || nextIdx >= cur.length) return;
              cur.splice(idx, 1);
              cur.splice(nextIdx, 0, id);
              appState.models.reorderingFavs = true;
              try {
                const res = await callServerTool('model_hub_reorder_favorites', { orderedIds: cur });
                if (res?.profile) appState.models.data = res.profile;
                renderModels();
              } finally {
                appState.models.reorderingFavs = false;
              }
            } else if (act === 'probe-one') {
              const id = btn.dataset.id;
              if (!id) return;
              appState.models.probingIds[id] = true;
              renderModels();
              const probe = await callServerTool('model_hub_probe_speed', { modelId: id });
              delete appState.models.probingIds[id];
              if (probe?.profile) appState.models.data = probe.profile;
              renderModels();
              showToast(

      function getRowItem(listType, idx) {
        if (listType === 'browse') return appState.browse.entries[idx];

      async function handleListClick(event) {
        const actionBtn = event.target.closest('button[data-action]');
        const row = event.target.closest('.list-row');
        if (!row) return;
        const listType = row.dataset.list;
        const idx = Number(actionBtn ? actionBtn.dataset.index : row.dataset.index);
        const item = getRowItem(listType, idx);
        if (!item) return;

        if (actionBtn) {
          event.stopPropagation();
          const act = actionBtn.dataset.action;
          if (act === 'open') {
            openInNativeTab(item.uri);
          } else if (act === 'reveal') {
            revealPath(item.path);
          } else if (act === 'quote') {
            const ok = await attachContext(`@${item.path}`);
            if (ok) showToast('已引用路径到对话');
          } else if (act === 'jump') {
            switchTab('browse');
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(item.path, '');
          } else if (act === 'unpin') {
            togglePinPath(item.path);
          }
          return;
        }

        // Row single click
        if (listType === 'browse') {
          appState.browse.selectedPath = item.path;
          renderBrowse();
          if (!item.isDir) loadPreview(item.path);
        } else if (listType === 'artifacts') {
          appState.artifacts.selectedPath = item.path;
          renderArtifacts();
          loadPreview(item.path);
        } else if (listType === 'pins') {
          appState.pins.selectedPath = item.path;
          renderPins();
          if (item.exists === false) {
            showToast('该路径已不存在，可点击移除', true);
            return;
          }
          if (!item.isDir) {
            loadPreview(item.path);
          }
        }
      }

      function handleListDblClick(event) {
        if (event.target.closest('button[data-action]')) {
          event.stopPropagation();
          return;
        }
        const row = event.target.closest('.list-row');
        if (!row) return;
        const listType = row.dataset.list;
        const idx = Number(row.dataset.index);
        const item = getRowItem(listType, idx);
        if (!item) return;

        if (listType === 'browse') {
          if (item.isDir) {
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(item.path, '');
          } else if (appState.prefs.doubleClickAction === 'open_tab') {
            openInNativeTab(item.uri);
          } else {
            revealPath(item.path);
          }
        } else if (listType === 'artifacts') {
          revealPath(item.path);
        } else if (listType === 'pins') {
          if (item.exists === false) {
            showToast('该路径已不存在', true);
            return;
          }
          if (item.isDir) {
            switchTab('browse');
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(item.path, '');
          } else if (appState.prefs.doubleClickAction === 'open_tab') {
            openInNativeTab(item.uri);
          } else {
            revealPath(item.path);
          }

      function handleListDragStart(event) {
        if (event.target.closest('button[data-action]')) {
          event.preventDefault();
          return;

        const row = event.target.closest('.list-row');
        if (!row || !event.dataTransfer) return;
        const listType = row.dataset.list;
        const idx = Number(row.dataset.index);
        const item = getRowItem(listType, idx);
        if (!item || !item.path) return;
        event.dataTransfer.effectAllowed = 'copyLink';
        const refToken = /\s/.test(item.path) ? `@"${item.path.replace(/"/g, '')}"` : `@${item.path}`;
        event.dataTransfer.setData('text/plain', refToken);
        if (item.uri) {
          try { event.dataTransfer.setData('text/uri-list', item.uri); } catch {}
        }
      }

      previewBody.addEventListener('click', (event) => {
        const imgModeBtn = event.target.closest('button[data-img-mode]');

          const mode = imgModeBtn.dataset.imgMode === '1:1' ? '1:1' : 'fit';
          if (appState.preview.imgScaleMode !== mode) {
            appState.preview.imgScaleMode = mode;
            applyActiveImagePreviewMode();
          }
          return;
        }
        const imgActBtn = event.target.closest('button[data-img-action="pixel"]');
        if (imgActBtn) {
          appState.preview.imgPixelated = !Boolean(appState.preview.imgPixelated);
          applyActiveImagePreviewMode();
          return;
        }
        const lnEl = event.target.closest('.code-ln[data-line]');
        if (lnEl) {
          const lineNum = Number(lnEl.dataset.line);
          if (Number.isInteger(lineNum) && lineNum > 0) {
            const pv = appState.preview;
            if (event.shiftKey && pv.lineSelStart > 0) {
              pv.lineSelEnd = lineNum;
            } else if (pv.lineSelStart === lineNum && (pv.lineSelEnd === 0 || pv.lineSelEnd === lineNum)) {
              pv.lineSelStart = 0;
              pv.lineSelEnd = 0;
            } else {
              pv.lineSelStart = lineNum;
              pv.lineSelEnd = lineNum;
            }
            const range = getLineRangeSelection();
            const allLns = previewBody.querySelectorAll('.code-ln[data-line]');
            for (let i = 0; i < allLns.length; i++) {
              const n = i + 1;
              allLns[i].classList.toggle('is-selected', Boolean(range && n >= range.start && n <= range.end));
            }
            renderPreviewHeaderOnly();
          }
          return;
        }
        const inspBtn = event.target.closest('button[data-inspector-action]');
        if (inspBtn) {
          const curDir = appState.browse.dir || appState.homeDir || '';
          const iAct = inspBtn.dataset.inspectorAction;
          if (iAct === 'copy-dir' && curDir) {
            copyTextSafe(curDir).then((ok) => {
              if (ok) flashButtonFeedback(inspBtn, '✓ 已复制', 1200);
              showToast(ok ? `已复制路径 ${curDir}` : '复制失败', !ok);
            });
          } else if (iAct === 'pin-dir' && curDir) {
            togglePinPath(curDir).then(() => renderPreviewDrawer({ preserveFocus: true }));
          } else if (iAct === 'reveal-dir' && curDir) {
            revealPath(curDir);
          }
          return;
        }
        const btn = event.target.closest('button[data-placeholder-action]');
        if (!btn) return;
        const act = btn.dataset.placeholderAction;
        if (act === 'open' && appState.preview.data?.uri) {
          openInNativeTab(appState.preview.data.uri);
        } else if (act === 'reveal' && appState.preview.data?.path) {
          revealPath(appState.preview.data.path);
        }
      });

      // Resizable Split Handle (col-resize >= 820px / row-resize < 820px)
      let dragging = false;
      let dragIsWide = false;
      let dragStartY = 0;
      let dragStartX = 0;
      let dragStartHeight = 290;
      let dragStartWidth = 380;

      previewResizer.addEventListener('pointerdown', (event) => {
        dragging = true;
        dragIsWide = workspaceEl.classList.contains('is-split-wide');
        if (dragIsWide) {
          dragStartX = event.clientX;
          const wsW = Math.max(600, workspaceEl.getBoundingClientRect().width);
          dragStartWidth = appState.preview.collapsed
            ? Math.round(wsW * (Number(appState.preview.widthRatio) || 0.46))
            : previewDrawer.getBoundingClientRect().width;
        } else {
          dragStartY = event.clientY;
          dragStartHeight = appState.preview.collapsed ? 220 : previewDrawer.getBoundingClientRect().height;
        }
        previewDrawer.classList.add('is-resizing');
        previewResizer.setPointerCapture(event.pointerId);
      });

      previewResizer.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        if (dragIsWide) {
          const wsW = Math.max(600, workspaceEl.getBoundingClientRect().width);
          const deltaX = dragStartX - event.clientX;
          const maxW = Math.max(260, wsW - 280);
          const nextW = Math.max(260, Math.min(maxW, Math.round(dragStartWidth + deltaX)));
          appState.preview.collapsed = false;
          appState.preview.widthRatio = Math.max(0.24, Math.min(0.72, nextW / wsW));
          previewDrawer.classList.remove('is-collapsed');
          workspaceEl.style.setProperty('--preview-width', `${nextW}px`);
        } else {
          const delta = dragStartY - event.clientY;
          const maxH = Math.max(180, Math.floor(workspaceEl.getBoundingClientRect().height * 0.78));
          const nextH = Math.max(120, Math.min(maxH, Math.round(dragStartHeight + delta)));
          appState.preview.collapsed = false;
          appState.preview.height = nextH;
          previewDrawer.classList.remove('is-collapsed');
          previewDrawer.style.height = `${nextH}px`;
        }
      });

      function stopDrag(event) {
        if (!dragging) return;
        dragging = false;
        previewDrawer.classList.remove('is-resizing');
        try {
          previewResizer.releasePointerCapture(event.pointerId);
        } catch {}
        syncWorkspaceSplitLayout();
        renderPreviewHeaderOnly();
      }

      previewResizer.addEventListener('pointerup', stopDrag);
      previewResizer.addEventListener('pointercancel', stopDrag);
      previewResizer.addEventListener('dblclick', () => {
        appState.preview.collapsed = !appState.preview.collapsed;
        renderPreviewDrawer();
      });

      function isTypingFocus(el) {
        if (!el) return false;
        const tag = (el.tagName || '').toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
      }

      function isInteractiveControlFocus(el) {
        if (!el) return false;
        if (isTypingFocus(el)) return true;
        const tag = (el.tagName || '').toUpperCase();
        if (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY') return true;
        const role = (el.getAttribute && el.getAttribute('role')) || '';
        return role === 'button' || role === 'tab' || role === 'menuitem' || role === 'link';
      }

      function scheduleLiveArrowPreview(item) {
        if (arrowPreviewTimer) {
          clearTimeout(arrowPreviewTimer);
          arrowPreviewTimer = 0;
        }
        if (!item || item.isDir || item.exists === false) return;
        if (window.innerWidth < WIDE_SPLIT_MIN_WIDTH && !appState.preview.visible) return;
        if (appState.preview.editing && appState.preview.dirty) return;
        arrowPreviewTimer = setTimeout(() => {
          arrowPreviewTimer = 0;
          loadPreview(item.path);
        }, 120);
      }

      function stepActiveListSelection(delta) {
        const tab = appState.activeTab;
        if (tab === 'browse') {
          const items = appState.browse.entries;
          if (!items.length) return;
          const curIdx = items.findIndex((it) => it.path === appState.browse.selectedPath);
          const nextIdx = curIdx === -1
            ? (delta > 0 ? 0 : items.length - 1)
            : Math.max(0, Math.min(items.length - 1, curIdx + delta));
          appState.browse.selectedPath = items[nextIdx].path;
          renderBrowse();
          browseListWrap.querySelector('.list-row.is-selected')?.scrollIntoView({ block: 'nearest' });
          scheduleLiveArrowPreview(items[nextIdx]);
        } else if (tab === 'artifacts') {
          const q = appState.artifacts.query.trim().toLowerCase();
          const items = q
            ? appState.artifacts.items.filter((it) => it.name.toLowerCase().includes(q) || (it.sessionId || '').toLowerCase().includes(q))
            : appState.artifacts.items;
          if (!items.length) return;
          const curIdx = items.findIndex((it) => it.path === appState.artifacts.selectedPath);
          const nextIdx = curIdx === -1
            ? (delta > 0 ? 0 : items.length - 1)
            : Math.max(0, Math.min(items.length - 1, curIdx + delta));
          appState.artifacts.selectedPath = items[nextIdx].path;
          renderArtifacts();
          artifactsListWrap.querySelector('.list-row.is-selected')?.scrollIntoView({ block: 'nearest' });
          scheduleLiveArrowPreview(items[nextIdx]);
        } else if (tab === 'pins') {
          const items = appState.pins.items;
          if (!items.length) return;
          const curIdx = items.findIndex((it) => it.path === appState.pins.selectedPath);
          const nextIdx = curIdx === -1
            ? (delta > 0 ? 0 : items.length - 1)
            : Math.max(0, Math.min(items.length - 1, curIdx + delta));
          appState.pins.selectedPath = items[nextIdx].path;
          renderPins();
          pinsListWrap.querySelector('.list-row.is-selected')?.scrollIntoView({ block: 'nearest' });
          scheduleLiveArrowPreview(items[nextIdx]);
        }
      }

      function activateSelectedListItem() {
        const tab = appState.activeTab;
        if (tab === 'browse') {
          const item = appState.browse.entries.find((it) => it.path === appState.browse.selectedPath);
          if (!item) return false;
          if (item.isDir) {
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(item.path, '');
          } else {
            loadPreview(item.path);
          }
          return true;
        }
        if (tab === 'artifacts') {
          const item = appState.artifacts.items.find((it) => it.path === appState.artifacts.selectedPath);
          if (!item) return false;
          loadPreview(item.path);
          return true;
        }
        if (tab === 'pins') {
          const item = appState.pins.items.find((it) => it.path === appState.pins.selectedPath);
          if (!item || item.exists === false) return false;
          if (item.isDir) {
            switchTab('browse', { persist: true });
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(item.path, '');
          } else {
            loadPreview(item.path);
          }
          return true;
        }
        return false;
      }

      // Global Shortcuts: Escape, Alt+1..7, /, Ctrl/Cmd+L, Ctrl/Cmd+S, and Keyboard Navigation
      const ALT_TAB_ORDER = ['browse', 'artifacts', 'pins', 'search', 'models', 'accounts', 'cua'];
      window.addEventListener('keydown', (event) => {
        if (event.isComposing || event.keyCode === 229) return;
        if (event.key === 'Escape') {
          if (disarmAllInlineConfirms()) {
            event.preventDefault();
            return;
          }
          if (appState.openTargets.menuOpen) {
            event.preventDefault();
            closeOpenWithMenu();
            return;
          }
          if (appState.activeTab === 'models' && (appState.models.showProviderForm || appState.models.showModelForm || appState.models.showDiscoverPanel)) {
            event.preventDefault();
            appState.models.showProviderForm = false;
            appState.models.editingProviderId = '';
            appState.models.showModelForm = false;
            appState.models.editingModelId = '';
            appState.models.showDiscoverPanel = false;
            renderModels();
            return;
          }
          if (appState.activeTab === 'accounts') {
            const acc = appState.accounts;
            if (acc.editingAliasId || acc.editingQuotaId || acc.showCatalogForm || acc.showRemoteConfig || acc.selfUpdateConfirmRepair) {
              event.preventDefault();
              acc.editingAliasId = '';
              acc.editingQuotaId = '';
              acc.showCatalogForm = false;
              acc.showRemoteConfig = false;
              acc.selfUpdateConfirmRepair = false;
              renderAccounts();
              return;
            }
          }
          if (isFileTab(appState.activeTab) && getLineRangeSelection()) {
            appState.preview.lineSelStart = 0;
            appState.preview.lineSelEnd = 0;
            previewBody.querySelectorAll('.code-ln.is-selected').forEach((n) => n.classList.remove('is-selected'));
            renderPreviewHeaderOnly();
            return;
          }
        }

        if (event.altKey && !event.ctrlKey && !event.metaKey && !event.shiftKey) {
          const digitMatch = String(event.code || '').match(/^Digit([1-7])$/) || String(event.key || '').match(/^([1-7])$/);
          if (digitMatch) {
            const tabIdx = Number(digitMatch[1]) - 1;
            const targetTab = ALT_TAB_ORDER[tabIdx];
            if (targetTab) {
              event.preventDefault();
              switchTab(targetTab, { persist: true });
            }
          }
          return;
        }

        const mod = event.ctrlKey || event.metaKey;
        if (mod) {
          const key = event.key.toLowerCase();
          if (key === 'l') {
            event.preventDefault();
            if (appState.activeTab !== 'browse') switchTab('browse', { persist: true });
            enterPathEditMode();
          } else if (key === 's' && isFileTab(appState.activeTab) && appState.preview.visible && appState.preview.editing) {
            event.preventDefault();
            saveEditedFile();
          }
          return;
        }
        if (event.altKey || appState.openTargets.menuOpen || isTypingFocus(event.target)) return;

        if (event.key === '/') {
          let targetInput = null;
          if (appState.activeTab === 'browse') targetInput = filterInput;
          else if (appState.activeTab === 'artifacts') targetInput = artifactsFilterInput;
          else if (appState.activeTab === 'search') targetInput = searchInput;
          else if (appState.activeTab === 'models' && modelsFilterBar && !modelsFilterBar.hidden) targetInput = modelsFilterInput;
          if (targetInput) {
            event.preventDefault();
            targetInput.focus();
            targetInput.select();
            return;
          }
        }

        if (appState.preview.editing) return;
        if (appState.activeTab === 'browse' || appState.activeTab === 'artifacts' || appState.activeTab === 'pins') {
          if (event.key === 'ArrowDown') {
            event.preventDefault();
            stepActiveListSelection(1);
          } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            stepActiveListSelection(-1);
          } else if (event.key === 'Enter' && !isInteractiveControlFocus(event.target)) {
            if (activateSelectedListItem()) event.preventDefault();
          } else if (event.key === 'Backspace' && !isInteractiveControlFocus(event.target) && appState.activeTab === 'browse' && appState.browse.parent) {
            event.preventDefault();
            filterInput.value = '';
            appState.browse.query = '';
            navigateToDir(appState.browse.parent, '');
          }
        }
      }, { signal });

      // Bootstrap & Initialize Handshake
      async function fallbackLoadIfNoToolResult() {
        if (appState.hasToolResult) return;
        try {
          const stateRes = await callServerTool('get_state', {});
          if (appState.hasToolResult) return;
          applyStateResult(stateRes);
          if (!bridgeSwitchApplied && !isExternalNavLocked() && RESTORABLE_TABS.includes(appState.prefs.lastTab) && appState.prefs.lastTab !== appState.activeTab) {
            switchTab(appState.prefs.lastTab, { persist: false });
          }
          await navigateToDir(appState.prefs.lastPath || appState.homeDir || '', '');
        } catch {}
      }

      async function bootstrap() {
        renderAll();
        if (!window.parent || window.parent === window) {
          appState.initialized = true;
          return;
        }
        try {
          const initRes = await sendRequest('ui/initialize', {
            protocolVersion: '2026-01-26',
            appInfo: { name: 'prism-files', version: '0.9.4' },
            appCapabilities: {}
          }, 12000);
          appState.hostCapabilities = initRes?.hostCapabilities || {};
          applyHostContext(initRes?.hostContext || {});
          appState.initialized = true;
          sendNotification('ui/notifications/initialized', {});
          postBridgeToMain({ type: 'ready' });
          renderAll();
          loadOpenTargets().catch(() => {});

          // Background warm sync of account summary for main-window Prism popover capsule
          setTimeout(() => {
            if (!appState.accounts.loaded && !appState.accounts.loading) {
              callServerTool('accounts_status', { forceRefresh: false })
                .then((st) => { if (st && st.ok) broadcastAccountSummary(st); })
                .catch(() => {});
            }
          }, 900);

          // Fallback when mounted directly as sidebar/aux pane without immediate tool-result
          setTimeout(() => {
            if (!appState.hasToolResult && !appState.hasToolInput) {
              fallbackLoadIfNoToolResult();
            }
          }, 250);
          setTimeout(() => {
            if (!appState.hasToolResult && !appState.browse.dir && !appState.browse.loading) {
              fallbackLoadIfNoToolResult();
            }
          }, 2200);
        } catch (err) {
          appState.initialized = true;
          showToast(err?.message || '初始化通信失败', true);
        }
      }

      bootstrap();
    })();
  </script>
</body>
