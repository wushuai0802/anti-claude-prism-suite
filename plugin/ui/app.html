              focusFlashTimer = setTimeout(() => {
                focusFlashTimer = 0;
                accountsWrap.classList.remove('is-focus-flash');
              }, 1550);
            }
          } else {
            const tabBtn = tabBtns.find((b) => b.dataset.tab === tab);
            if (tabBtn && typeof tabBtn.focus === 'function') {
              try { tabBtn.focus({ preventScroll: true }); } catch {}
            }
          }
        });
      }

      function navigateFromExternalBridge(tab, { intentId = '', requestId = '', sessionId = '', focus = true, replyWin = null, replyOrigin = '*' } = {}) {
        if (!VALID_TABS.includes(tab)) {
          postBridgeToMain({ type: 'ack', intentId, requestId, sessionId, ok: false, error: 'invalid-tab' }, replyWin, replyOrigin);
          return;
        }
        const alreadyHandled = Boolean(intentId && processedIntentIds.has(intentId));
        if (intentId) {
          processedIntentIds.add(intentId);
          if (processedIntentIds.size > 40) {
            const first = processedIntentIds.values().next().value;
            processedIntentIds.delete(first);
          }
        }
        bridgeSwitchApplied = true;
        navigationIntent = {
          tab,
          source: 'external-switch',
          priority: 100,
          expiresAt: Date.now() + 10000
        };
        switchTab(tab, { persist: false, fromExternal: true });
        if (focus) {
          focusActiveTabRegion(tab, !alreadyHandled);
        }
        postBridgeToMain({
          type: 'ack',
          intentId,
          requestId,
          sessionId,
          ok: true,
          activeTab: appState.activeTab,
          focused: Boolean(focus),
          initialized: Boolean(appState.initialized)
        }, replyWin, replyOrigin);
      }

      function broadcastAccountSummary(d) {
        if (!d || typeof d !== 'object') return;
        const accs = Array.isArray(d.accounts) ? d.accounts : [];
        const activeAcc = accs.find((a) => a.isCurrentActive) || accs.find((a) => a.id === d.activeCredential?.matchedAccountId) || null;
        postBridgeToMain({
          type: 'account-summary',
          summary: {
            enabled: Boolean(d.enabled),
            activeAlias: activeAcc?.alias || '',
            activeEmail: d.activeCredential?.email || activeAcc?.email || '',
            activeRole: activeAcc?.role || '',
            accountCount: accs.length,
            pendingSwitchEmail: d.pendingSwitch?.phase === 'active-swapped' ? (d.pendingSwitch.targetEmail || '') : ''
          }
        });
      }

      async function syncLiveQuotaFromMain(quota, { force = false } = {}) {
        if (!quota || typeof quota !== 'object') return;
        latestBridgeQuota = quota;
        const normPct = (v) => {
          if (v === null || v === undefined || v === '') return null;
          const n = Number(v);
          return Number.isFinite(n) ? Math.max(0, Math.min(100, Math.round(n * 10) / 10)) : null;
        };
        const p5 = normPct(quota.pct5h);
        const p7 = normPct(quota.pct7d);
        let families = null;
        if (quota.families && typeof quota.families === 'object') {
          const outFam = {};
          for (const fk of ['gemini', 'claude', 'gpt']) {
            const item = quota.families[fk];
            if (!item || typeof item !== 'object') continue;
            const rec = {};
            const f5 = normPct(item.pct5h);
            const f7 = normPct(item.pct7d);
            if (f5 !== null) rec.pct5h = f5;
            if (f7 !== null) rec.pct7d = f7;
            if (Object.keys(rec).length) outFam[fk] = rec;
          }
          if (Object.keys(outFam).length) families = outFam;
        }
        if (p5 === null && p7 === null && !families) return;
        const r5 = typeof quota.reset5hAt === 'string' && !Number.isNaN(Date.parse(quota.reset5hAt)) ? quota.reset5hAt : '';
        const r7 = typeof quota.reset7dAt === 'string' && !Number.isNaN(Date.parse(quota.reset7dAt)) ? quota.reset7dAt : '';
        const expectedEmail = typeof quota.accountEmail === 'string' && quota.accountEmail.includes('@') ? quota.accountEmail.trim().toLowerCase() : '';
        const tierName = typeof quota.tierName === 'string' ? quota.tierName.trim().slice(0, 48) : '';
        const famSig = families ? Object.entries(families).map(([k, v]) => `${k}:${v.pct5h ?? ''}/${v.pct7d ?? ''}`).join(',') : '';
        const sig = `${expectedEmail}|${p5 ?? ''}|${p7 ?? ''}|${r5.slice(0, 16)}|${r7.slice(0, 16)}|${famSig}`;
        const now = Date.now();
        if (!force && sig === lastSyncedLiveQuotaSig && now - lastSyncedLiveQuotaAt < 45000) return;
        lastSyncedLiveQuotaSig = sig;
        lastSyncedLiveQuotaAt = now;

        const args = {};
        if (p5 !== null) args.window5hPct = p5;
        if (p7 !== null) args.window7dPct = p7;
        if (r5) args.reset5hAt = r5;
        if (r7) args.reset7dAt = r7;
        if (families) args.families = families;
        if (expectedEmail) args.expectedEmail = expectedEmail;
        if (tierName) args.tierName = tierName;
        try {
          const res = await callServerTool('prism_quota_sync', args);
          if (res && res.ok && !res.skipped && appState.accounts.data) {
            const targetAcc = (appState.accounts.data.accounts || []).find((a) => a.id === res.accountId);
            if (targetAcc && res.effectiveQuota) {
              targetAcc.effectiveQuota = res.effectiveQuota;
              targetAcc.lastQuota = res.effectiveQuota;
              if (appState.activeTab === 'accounts') {
                if (hasActiveFormInput(accountsWrap)) {
                  deferredAccountsRender = true;
                } else {
                  renderAccounts();
                }
              }
            }
          }
        } catch {}
      }

      function setTopProgress(active) {
        if (!topProgressEl) return;
        topProgressEl.dataset.active = active ? '1' : '0';
      }

      window.addEventListener('pagehide', () => {
        if (toastTimer) clearTimeout(toastTimer);
        if (filterDebounceTimer) clearTimeout(filterDebounceTimer);
        if (arrowPreviewTimer) clearTimeout(arrowPreviewTimer);
        if (focusFlashTimer) clearTimeout(focusFlashTimer);
        if (quotaWaitRetryTimer) clearTimeout(quotaWaitRetryTimer);
        if (cuaLeaseTimer) clearInterval(cuaLeaseTimer);
        if (countdownRaf) cancelAnimationFrame(countdownRaf);
        for (const t of activeFeedbackTimers) clearTimeout(t);
        activeFeedbackTimers.clear();
        for (const pending of pendingRequests.values()) {
          clearTimeout(pending.timer);
        }
        pendingRequests.clear();
        uiAbort.abort();
      }, { once: true });

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message, isError = false) {
        if (toastTimer) clearTimeout(toastTimer);
        toastEl.textContent = String(message || '');
        toastEl.classList.toggle('is-error', Boolean(isError));
        toastEl.classList.add('is-visible');
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('is-visible');
        }, 2800);
      }

      function formatTimeAgo(mtimeMs) {
        const ts = Number(mtimeMs) || 0;
        if (!ts) return '';
        const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        if (diffSec < 60) return '刚刚';
        if (diffSec < 3600) return `${Math.floor(diffSec / 60)} 分钟前`;
        if (diffSec < 86400) return `${Math.floor(diffSec / 3600)} 小时前`;
        if (diffSec < 86400 * 7) return `${Math.floor(diffSec / 86400)} 天前`;
        const d = new Date(ts);
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mi = String(d.getMinutes()).padStart(2, '0');
        return `${mm}-${dd} ${hh}:${mi}`;
      }

      const HOST_VAR_BRIDGE = {
        '--primary': '--p-accent',
        '--background': '--p-bg',
        '--secondary': '--p-bg-hover',
        '--muted': '--p-bg-subtle',
        '--foreground': '--p-text',
        '--muted-foreground': '--p-text-muted',
        '--sidebar-border': '--p-border'
      };
      const PRISM_WB_THEME_CACHE_KEY = 'ag_prism_wb_theme_v1';
      const PRISM_WB_TIER_MODE_KEY = 'ag_prism_tier_badge_mode';
      let activePrismTheme = null;

      function getWbTierBadgeMode() {
        if (activePrismTheme && ['badge', 'icon', 'text'].includes(activePrismTheme.tierBadgeMode)) {
          return activePrismTheme.tierBadgeMode;
        }
        try {
          const m = localStorage.getItem(PRISM_WB_TIER_MODE_KEY);
          if (m && ['badge', 'icon', 'text'].includes(m)) return m;
        } catch {}
        return 'badge';
      }

      function renderWbTierBadge(rawTier, compact = false) {
        const full = String(rawTier || '').trim();
        if (!full) return '';
        let kind = 'starter';
        let shortLabel = full.replace(/^Google\s+AI\s+/i, '').trim() || full;
        let gemSvg = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 2 12 7 7 12 2 7 7 2z"/></svg>';
        if (/ultra/i.test(full)) {
          kind = 'ultra';
          shortLabel = 'ULTRA';
          gemSvg = '<svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M3.7 2.1h6.6l2.4 3.2L7 12.4 1.3 5.3l2.4-3.2z"/></svg>';
        } else if (/\bpro\b/i.test(full)) {
          kind = 'pro';
          shortLabel = 'PRO';
          gemSvg = '<svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M7 1.3 12.7 7 7 12.7 1.3 7 7 1.3z"/></svg>';
        } else if (/\b(team|enterprise|business)\b/i.test(full)) {
          kind = 'team';
          shortLabel = /enterprise/i.test(full) ? 'ENT' : 'TEAM';
          gemSvg = '<svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M7 1l1.8 4.2L13 7l-4.2 1.8L7 13 5.2 8.8 1 7l4.2-1.8L7 1z"/></svg>';
        } else if (/\b(plus|advanced)\b/i.test(full)) {
          kind = 'plus';
          shortLabel = 'PLUS';
          gemSvg = '<svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M7 1.5l1.5 4L12.5 7l-4 1.5L7 12.5l-1.5-4L1.5 7l4-1.5L7 1.5z"/></svg>';
        } else if (/starter/i.test(full)) {
          shortLabel = 'STARTER';
        } else if (/free/i.test(full)) {
          shortLabel = 'FREE';
        } else {
          shortLabel = shortLabel.slice(0, 10).toUpperCase();
        }
        const mode = getWbTierBadgeMode();
        const tip = `${full} · 点击切换徽章 / 图标 / 文字`;
        if (mode === 'text') {
          const txt = /^(?:antigravity\s+)?starter(?:\s+quota)?$/i.test(full) ? 'Starter' : (compact && (kind === 'ultra' || kind === 'pro') ? (kind === 'ultra' ? 'Ultra' : 'Pro') : full);
          return `<span class="pill" data-wb-tier-toggle="1" title="${escapeHtml(tip)}" style="cursor:pointer;">${escapeHtml(txt)}</span>`;
        }
        if (mode === 'icon') {
          return `<span class="wb-tier-badge" data-wb-tier-toggle="1" data-tier-mode="icon" data-tier-kind="${kind}" title="${escapeHtml(tip)}" role="button" tabindex="0">${gemSvg}</span>`;
        }
        return `<span class="wb-tier-badge" data-wb-tier-toggle="1" data-tier-mode="badge" data-tier-kind="${kind}" title="${escapeHtml(tip)}" role="button" tabindex="0">${gemSvg}<span>${escapeHtml(shortLabel)}</span></span>`;
      }

      function applyPrismThemePayload(theme, persist = true) {
        if (!theme || typeof theme !== 'object') return;
        const prevTierMode = activePrismTheme && activePrismTheme.tierBadgeMode;
        activePrismTheme = theme;
        if (theme.tierBadgeMode && ['badge', 'icon', 'text'].includes(theme.tierBadgeMode)) {
          try { localStorage.setItem(PRISM_WB_TIER_MODE_KEY, theme.tierBadgeMode); } catch {}
          if (prevTierMode && prevTierMode !== theme.tierBadgeMode && typeof appState === 'object' && appState && appState.activeTab === 'accounts') {
            try { renderAccounts(); } catch {}
          }
        }
        if (persist) {
          try { localStorage.setItem(PRISM_WB_THEME_CACHE_KEY, JSON.stringify(theme)); } catch {}
        }
        const root = document.documentElement;
        if (theme.mode === 'dark' || theme.mode === 'light') {
          root.dataset.theme = theme.mode;
          root.style.colorScheme = theme.mode;
        }
        const t = theme.tokens;
        if (t && typeof t === 'object') {
          const pairs = [
            ['--p-bg', t.bg],
            ['--p-bg-subtle', t.subtle],
            ['--p-bg-hover', t.hover],
            ['--p-bg-active', t.active],
            ['--p-text', t.text],
            ['--p-text-secondary', t.textSec],
            ['--p-text-muted', t.textMuted],
            ['--p-border', t.border],
            ['--p-border-strong', t.borderStrong],
            ['--p-accent', t.accent],
            ['--p-accent-soft', t.accentSoft],
            ['--p-code-bg', t.codeBg || t.subtle],
            ['--color-background-primary', t.bg],
            ['--color-background-secondary', t.subtle],
            ['--color-background-tertiary', t.hover],
            ['--color-text-primary', t.text],
            ['--color-text-secondary', t.textSec],
            ['--color-text-tertiary', t.textMuted],
            ['--color-border-primary', t.border],
            ['--color-border-secondary', t.border],
            ['--color-accent', t.accent]
          ];
          for (const [k, v] of pairs) {
            if (typeof v === 'string' && v) root.style.setProperty(k, v);
          }
        }
      }
      try {
        const cachedThemeRaw = localStorage.getItem(PRISM_WB_THEME_CACHE_KEY);
        if (cachedThemeRaw) applyPrismThemePayload(JSON.parse(cachedThemeRaw), false);
      } catch {}

      function applyHostContext(ctx) {
        if (!ctx || typeof ctx !== 'object') return;
        appState.hostContext = { ...appState.hostContext, ...ctx };
        const themeRaw = typeof ctx.theme === 'string' ? ctx.theme : ctx.theme?.colorScheme;
        if (themeRaw === 'dark' || themeRaw === 'light') {
          document.documentElement.dataset.theme = themeRaw;
          document.documentElement.style.colorScheme = themeRaw;
        }
        const vars = ctx.styles && ctx.styles.variables;
        if (vars && typeof vars === 'object') {
          for (const [k, v] of Object.entries(vars)) {
            if (typeof k === 'string' && k.startsWith('--') && typeof v === 'string' && v.trim()) {
              document.documentElement.style.setProperty(k, v);
              const mapped = HOST_VAR_BRIDGE[k];
              if (mapped) document.documentElement.style.setProperty(mapped, v);
            }
          }
        }
        if (activePrismTheme) {
          const nextMode = (themeRaw === 'dark' || themeRaw === 'light') ? themeRaw : activePrismTheme.mode;
          if (nextMode === activePrismTheme.mode) {
            applyPrismThemePayload(activePrismTheme, false);
          }
        }
      }

      function postToHost(payload) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      }

      function sendNotification(method, params = {}) {
        postToHost({ jsonrpc: '2.0', method, params });
      }

      function sendRequest(method, params = {}, timeoutMs = 15000) {
        const id = rpcCounter++;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pendingRequests.delete(id);
            reject(new Error('请求宿主超时'));
          }, timeoutMs);
          pendingRequests.set(id, { resolve, reject, timer });
          postToHost({ jsonrpc: '2.0', id, method, params });
        });
      }

      async function callServerTool(name, args = {}) {
        const mergedArgs = {
          ...(args && typeof args === 'object' ? args : {}),
          ...(window.__PRISM_APP_TOKEN__ ? { _appToken: window.__PRISM_APP_TOKEN__ } : {})
        };
        const res = await sendRequest('tools/call', { name, arguments: mergedArgs }, 20000);
        if (res && res.isError) {
          const errText = res.structuredContent?.error || res.content?.find?.((c) => c.type === 'text')?.text || '工具调用失败';
          throw new Error(errText);
        }
        return res?.structuredContent ?? res;
      }

      async function copyTextSafe(text) {
        const str = String(text ?? '');
        if (!str) return false;
        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            await navigator.clipboard.writeText(str);
            return true;
          }
        } catch {}
        try {
          const ta = document.createElement('textarea');
          ta.value = str;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          ta.style.pointerEvents = 'none';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch {
          return false;
        }
      }

      function flashButtonFeedback(btn, doneText = '✓ 已复制', durationMs = 1200) {
        if (!btn || !btn.isConnected) return;
        const existing = btnFeedbackMap.get(btn);
        if (existing) {
          clearTimeout(existing.timer);
          activeFeedbackTimers.delete(existing.timer);
        } else {
          const rectW = Math.ceil(btn.getBoundingClientRect().width);
          btn.dataset.origHtml = btn.innerHTML;
          btn.dataset.origMinWidth = btn.style.minWidth || '';
          if (rectW > 0) btn.style.minWidth = `${rectW}px`;
        }
        btn.textContent = doneText;
        btn.classList.add('is-copied');
        const timer = setTimeout(() => {
          activeFeedbackTimers.delete(timer);
          btnFeedbackMap.delete(btn);
          if (!btn.isConnected) return;
          if (btn.dataset.origHtml !== undefined) {
            btn.innerHTML = btn.dataset.origHtml;
            delete btn.dataset.origHtml;
          }
          btn.style.minWidth = btn.dataset.origMinWidth || '';
          delete btn.dataset.origMinWidth;
          btn.classList.remove('is-copied');
        }, durationMs);
        activeFeedbackTimers.add(timer);
        btnFeedbackMap.set(btn, { timer });
      }

      const inlineConfirmMap = new WeakMap();
      const armedConfirmBtns = new Set();

      function disarmInlineConfirmBtn(btn) {
        const entry = inlineConfirmMap.get(btn);
        if (!entry) return;
        clearTimeout(entry.timer);
        activeFeedbackTimers.delete(entry.timer);
        inlineConfirmMap.delete(btn);
        armedConfirmBtns.delete(btn);
        if (!btn.isConnected) return;
        btn.removeAttribute('data-confirm-armed');
        if (entry.origHtml !== undefined) btn.innerHTML = entry.origHtml;
        btn.style.minWidth = entry.origMinWidth || '';
        btn.style.borderColor = entry.origBorderColor || '';
        btn.style.color = entry.origColor || '';
      }

      function disarmAllInlineConfirms() {
        let had = false;
        for (const btn of Array.from(armedConfirmBtns)) {
          disarmInlineConfirmBtn(btn);
          had = true;
        }
        return had;
      }

      function requireInlineConfirm(btn, confirmText = '确认执行？', durationMs = 3500) {
        if (!btn || !btn.isConnected) return true;
        if (btn.getAttribute('data-confirm-armed') === '1') {
          disarmInlineConfirmBtn(btn);
          return true;
        }
        for (const other of Array.from(armedConfirmBtns)) {
          if (other !== btn) disarmInlineConfirmBtn(other);
        }
        const rectW = Math.ceil(btn.getBoundingClientRect().width);
        const origHtml = btn.innerHTML;
        const origMinWidth = btn.style.minWidth || '';
        const origBorderColor = btn.style.borderColor || '';
        const origColor = btn.style.color || '';
        if (rectW > 0) btn.style.minWidth = `${rectW}px`;
        btn.setAttribute('data-confirm-armed', '1');
        btn.textContent = confirmText;
        btn.style.borderColor = 'var(--p-danger)';
        btn.style.color = 'var(--p-danger)';
        const timer = setTimeout(() => {
          disarmInlineConfirmBtn(btn);
        }, durationMs);
        activeFeedbackTimers.add(timer);
        armedConfirmBtns.add(btn);
        inlineConfirmMap.set(btn, { timer, origHtml, origMinWidth, origBorderColor, origColor });
        return false;
      }

      function positionPreviewOpenWithMenu() {

        let left = Math.min(window.innerWidth - menuW - 8, Math.max(8, rect.right - menuW));
        let top = rect.bottom + 4;
        if (top + menuH > window.innerHeight - 8 && rect.top - menuH - 4 > 8) {
          top = rect.top - menuH - 4;

      function highlightLiteralHtml(snippet, query) {
        const text = String(snippet ?? '');
        const q = String(query ?? '').trim();
        if (!q) return escapeHtml(text);
        const lowerText = text.toLowerCase();
        const lowerQ = q.toLowerCase();
        const qLen = lowerQ.length;
        const out = [];
        let cursor = 0;
        let guard = 0;
        while (cursor < text.length && guard < 40) {
          const idx = lowerText.indexOf(lowerQ, cursor);
          if (idx === -1) {
            out.push(escapeHtml(text.slice(cursor)));
            break;
          }
          if (idx > cursor) {
            out.push(escapeHtml(text.slice(cursor, idx)));
          }
          out.push(`<mark class="search-hl">${escapeHtml(text.slice(idx, idx + qLen))}</mark>`);
          cursor = idx + qLen;
          guard++;
        }
        if (guard >= 40 && cursor < text.length) {
          out.push(escapeHtml(text.slice(cursor)));
        }
        return out.join('');
      }

        }
      }

      // Safe XSS-escaped Markdown Renderer
      function sanitizeHref(rawUrl) {
        const trimmed = String(rawUrl || '').replace(/\u0000/g, '').trim();
        if (!trimmed || /[\s<>]/.test(trimmed)) return '';
        if (/^(https?:|mailto:|#)/i.test(trimmed)) return trimmed;
        return '';
      }

      function renderInlineCodeAndStyle(raw) {
        const codeParts = [];
        const tokenized = String(raw || '').replace(/\u0000/g, '').replace(/(`+)([^`]*?)\1/g, (_, _ticks, code) => {
          const idx = codeParts.length;
          codeParts.push(`<code>${escapeHtml(code.trim())}</code>`);
          return `\u0000MD_SUBCODE_${idx}\u0000`;
        });
        return formatStyledText(tokenized).replace(/\u0000MD_SUBCODE_(\d+)\u0000/g, (_, idx) => codeParts[Number(idx)] || '');
      }

      function renderInlineMarkdown(raw) {
        const clean = String(raw || '').replace(/\u0000/g, '');
        const tokens = [];
        const withTokens = clean.replace(
          /(`+)([^`]*?)\1|(!?)\[([^\]]*)\]\(([^)\s]+(?:\s+"[^"]*")?)\)/g,
          (_match, ticks, code, bang, label, rawHref) => {
            const idx = tokens.length;
            if (ticks) {
              tokens.push(`<code>${escapeHtml(code.trim())}</code>`);
              return `\u0000MD_TOK_${idx}\u0000`;
            }
            const hrefPart = String(rawHref || '').replace(/\s+"[^"]*"$/, '').replace(/<\/?[a-z][^>]*>/gi, '');
            if (bang === '!') {
              tokens.push(`<span class="md-link-text">[图片: ${escapeHtml(label || hrefPart)}]</span>`);
            } else {
              const safeHref = sanitizeHref(hrefPart);
              const inner = renderInlineCodeAndStyle(label || hrefPart);
              if (safeHref) {
                tokens.push(`<a href="${escapeHtml(safeHref)}" target="_blank" rel="noopener noreferrer">${inner}</a>`);
              } else {
                const safeTitle = /^(javascript|vbscript|data):/i.test(hrefPart.trim()) ? '已拦截不安全链接' : hrefPart;
                tokens.push(`<span class="md-link-text" title="${escapeHtml(safeTitle)}">${inner}</span>`);
              }
            }
            return `\u0000MD_TOK_${idx}\u0000`;
          }
        );

        return formatStyledText(withTokens).replace(/\u0000MD_TOK_(\d+)\u0000/g, (_, idx) => tokens[Number(idx)] || '');
      }

      function formatStyledText(raw) {
        let s = escapeHtml(raw);
        s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/__([^_]+?)__/g, '<strong>$1</strong>');
        s = s.replace(/~~([^~]+?)~~/g, '<del>$1</del>');
        s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
        s = s.replace(/(^|[^_a-zA-Z0-9])_([^_\n]+?)_(?![_a-zA-Z0-9])/g, '$1<em>$2</em>');
        return s;
      }

      function parseTableRow(line) {
        let trimmed = line.trim();
        if (trimmed.startsWith('|')) trimmed = trimmed.slice(1);
        if (trimmed.endsWith('|')) trimmed = trimmed.slice(0, -1);
        return trimmed.split('|').map((cell) => cell.trim());
      }

      function isTableSeparator(line) {
        return /^\s*\|?(?:\s*:?-{3,}:?\s*\|)+\s*:?-{3,}:?\s*\|?\s*$/.test(line) ||
               /^\s*\|?\s*:?-{3,}:?\s*\|?\s*$/.test(line) && line.includes('|');
      }

      function renderMarkdownToHtml(markdownText, depth = 0) {
        const lines = String(markdownText || '').replace(/\u0000/g, '').replace(/\r\n?/g, '\n').split('\n');
        const out = [];
        let i = 0;

        while (i < lines.length) {
          const line = lines[i];

          // Blank line
          if (!line.trim()) {
            i++;
            continue;
          }

          // Fenced code block
          const fenceMatch = line.match(/^\s*(`{3,}|~{3,})(.*)$/);
          if (fenceMatch) {
            const fenceChar = fenceMatch[1][0];
            const fenceLen = fenceMatch[1].length;
            const lang = fenceMatch[2].trim();
            const codeLines = [];
            i++;
            while (i < lines.length) {
              const closeMatch = lines[i].match(new RegExp(`^\\s*${fenceChar}{${fenceLen},}\\s*$`));
              if (closeMatch) {
                i++;
                break;
              }
              codeLines.push(lines[i]);
              i++;
            }
            const langHtml = lang ? `<div class="md-code-lang">${escapeHtml(lang)}</div>` : '';
            out.push(`<pre class="md-code">${langHtml}<code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
            continue;
          }

          // Heading
          const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
          if (headingMatch) {
            const level = headingMatch[1].length;
            const text = headingMatch[2].replace(/\s+#+\s*$/, '');
            out.push(`<h${level}>${renderInlineMarkdown(text)}</h${level}>`);
            i++;
            continue;
          }

          // Horizontal rule
          if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) {
            out.push('<hr />');
            i++;
            continue;
          }

          // Blockquote
          if (/^\s*>/.test(line)) {
            const quoteLines = [];
            while (i < lines.length && (/^\s*>/.test(lines[i]) || (lines[i].trim() !== '' && quoteLines.length > 0 && !/^(#{1,6}\s|```|~~~|[-*+]\s|\d+\.\s)/.test(lines[i])))) {
              if (!/^\s*>/.test(lines[i])) break;
              quoteLines.push(lines[i].replace(/^\s*>\s?/, ''));
              i++;
            }
            if (depth >= 16) {
              out.push(`<p>${escapeHtml(quoteLines.join('\n')).replace(/\n/g, '<br />')}</p>`);
            } else {
              out.push(`<blockquote>${renderMarkdownToHtml(quoteLines.join('\n'), depth + 1)}</blockquote>`);
            }
            continue;
          }

          // Table
          if (line.includes('|') && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
            const headers = parseTableRow(line);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
              rows.push(parseTableRow(lines[i]));
              i++;
            }
            const thead = `<thead><tr>${headers.map((h) => `<th>${renderInlineMarkdown(h)}</th>`).join('')}</tr></thead>`;
            const tbody = rows.length
              ? `<tbody>${rows.map((r) => `<tr>${headers.map((_, ci) => `<td>${renderInlineMarkdown(r[ci] || '')}</td>`).join('')}</tr>`).join('')}</tbody>`
              : '';
            out.push(`<table>${thead}${tbody}</table>`);
            continue;
          }

          // Lists (ul or ol)
          const ulMatch = line.match(/^\s*[-*+]\s+(.*)$/);
          const olMatch = line.match(/^\s*\d+\.\s+(.*)$/);
          if (ulMatch || olMatch) {
            const isOrdered = Boolean(olMatch);
            const tag = isOrdered ? 'ol' : 'ul';
            const items = [];
            while (i < lines.length) {
              const cur = lines[i];
              const m = isOrdered ? cur.match(/^\s*\d+\.\s+(.*)$/) : cur.match(/^\s*[-*+]\s+(.*)$/);
              if (!m) break;
              let itemText = m[1];
              const taskMatch = itemText.match(/^\[( |x|X)\]\s+(.*)$/);
              if (taskMatch) {
                const checked = taskMatch[1].toLowerCase() === 'x';
                itemText = taskMatch[2];
                items.push(`<li><span class="md-task">${checked ? '☑' : '☐'}</span>${renderInlineMarkdown(itemText)}</li>`);
              } else {
                items.push(`<li>${renderInlineMarkdown(itemText)}</li>`);
              }
              i++;
            }
            out.push(`<${tag}>${items.join('')}</${tag}>`);
            continue;
          }

          // Paragraph
          const paraLines = [];
          while (
            i < lines.length &&
            lines[i].trim() !== '' &&
            !/^\s*(`{3,}|~{3,})/.test(lines[i]) &&
            !/^(#{1,6})\s+/.test(lines[i]) &&
            !/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(lines[i]) &&
            !/^\s*>/.test(lines[i]) &&
            !/^\s*[-*+]\s+/.test(lines[i]) &&
            !/^\s*\d+\.\s+/.test(lines[i])
          ) {
            if (lines[i].includes('|') && i + 1 < lines.length && isTableSeparator(lines[i + 1])) break;
            paraLines.push(lines[i].trimEnd());
            i++;
          }
          const joined = paraLines.map((l) => renderInlineMarkdown(l)).join('<br />');
          out.push(`<p>${joined}</p>`);
        }

        return out.join('\n');
      }

      // Data loaders & 0ms local directory filter
      function filterEntriesLocal(rawList, query) {
        const q = String(query || '').trim().toLowerCase();
        if (!q) return rawList.slice();
        return rawList.filter((item) => String(item?.name || '').toLowerCase().includes(q));
      }

      async function navigateToDir(dirPath, query = appState.browse.query, { force = false } = {}) {
        const cleanQuery = String(query || '');
        const normTarget = String(dirPath || '');
        // Fast path: 0ms client-side filter when full directory entries are already cached locally
        if (
          !force &&
          normTarget &&
          normTarget === appState.browse.rawDir &&
          !appState.browse.truncated &&
          Array.isArray(appState.browse.rawEntries)
        ) {
          appState.browse.query = cleanQuery;
          appState.browse.entries = filterEntriesLocal(appState.browse.rawEntries, cleanQuery);
          renderBrowse();
          return;
        }

        const seq = ++appState.browse.seq;
        appState.browse.loading = true;
        setTopProgress(true);
        if (!appState.browse.entries.length) renderBrowse();
        try {
          const res = await callServerTool('list_directory', {
            dir: normTarget,
            showHidden: Boolean(appState.prefs.showHidden),
            query: cleanQuery
          });
          if (seq !== appState.browse.seq) return;
          appState.browse.loading = false;
          setTopProgress(false);
          if (res) {
            appState.browse.ok = res.ok !== false;
            appState.browse.error = res.error || '';
            appState.browse.dir = res.dir || normTarget;
            appState.browse.parent = res.parent || '';
            appState.browse.total = Number(res.total) || 0;
            appState.browse.truncated = Boolean(res.truncated);
            const entries = Array.isArray(res.entries) ? res.entries : [];
            appState.browse.entries = entries;
            if (!cleanQuery && !res.truncated && res.ok !== false) {
              appState.browse.rawDir = appState.browse.dir;
              appState.browse.rawEntries = entries;
            } else if (cleanQuery === '' && res.truncated) {
              appState.browse.rawDir = '';
              appState.browse.rawEntries = null;
            }
            if (typeof res.platformLabel === 'string' && res.platformLabel) {
              appState.platformLabel = res.platformLabel;
            }
            if (appState.browse.ok && appState.browse.dir) {
              appState.prefs.lastPath = appState.browse.dir;
            }
          }
          renderBrowse();
          renderTopbar();
        } catch (err) {
          if (seq !== appState.browse.seq) return;
          appState.browse.loading = false;
          setTopProgress(false);
          appState.browse.ok = false;
          appState.browse.error = err?.message || '读取目录失败';
          renderBrowse();
        }
      }

      async function loadArtifacts() {
        const seq = ++appState.artifacts.seq;
        appState.artifacts.loading = true;
        renderArtifacts();
        try {
          const res = await callServerTool('list_recent_artifacts', { limit: 60 });
          if (seq !== appState.artifacts.seq) return;
          appState.artifacts.loading = false;
          appState.artifacts.loaded = true;
          if (res) {
            appState.artifacts.items = Array.isArray(res.items) ? res.items : [];
            if (res.brainDir) appState.brainDir = res.brainDir;
            if (res.platformLabel) appState.platformLabel = res.platformLabel;
          }
          renderArtifacts();
        } catch (err) {
          if (seq !== appState.artifacts.seq) return;
          appState.artifacts.loading = false;
          renderArtifacts();
          showToast(err?.message || '读取最近产物失败', true);
        }
      }

      async function loadPins() {
        const seq = ++appState.pins.seq;
        appState.pins.loading = true;
        renderPins();
        try {
          const res = await callServerTool('get_state', {});
          if (seq !== appState.pins.seq) return;
          appState.pins.loaded = true;
          applyStateResult(res);
        } catch (err) {
          if (seq !== appState.pins.seq) return;
          showToast(err?.message || '读取收藏夹失败', true);
        } finally {
          if (seq === appState.pins.seq) {
            appState.pins.loading = false;
            renderPins();
          }
        }
      }

      function applyStateResult(res) {
        if (!res || typeof res !== 'object') return;
        if (res.state) {
          appState.prefs = {
            pinnedPaths: Array.isArray(res.state.pinnedPaths) ? res.state.pinnedPaths : [],
            lastPath: res.state.lastPath || appState.prefs.lastPath,
            lastTab: RESTORABLE_TABS.includes(res.state.lastTab) ? res.state.lastTab : 'browse',
            showHidden: Boolean(res.state.showHidden),
            doubleClickAction: res.state.doubleClickAction === 'open_tab' ? 'open_tab' : 'reveal',
            allowLanSmb: Boolean(res.state.allowLanSmb),
            dismissedGuides: applyServerDismissedGuides(res.state.dismissedGuides)
          };
        }
        if (Array.isArray(res.pinnedItems)) {
          appState.pins.items = res.pinnedItems;
          appState.pins.loaded = true;
        }
        if (res.homeDir) appState.homeDir = res.homeDir;
        if (res.brainDir) appState.brainDir = res.brainDir;
        if (res.platformLabel) appState.platformLabel = res.platformLabel;
        renderTopbar();
        renderBrowse();
        renderPins();
        renderPreviewHeaderOnly();
      }

      async function persistPrefs(patch) {
        const seq = ++prefsSaveSeq;
        try {
          const res = await callServerTool('update_state', patch);
          if (seq === prefsSaveSeq) {
            applyStateResult(res);
          }
          return true;
        } catch (err) {
          showToast(err?.message || '保存设置失败', true);
          return false;
        }
      }

      async function togglePinPath(targetPath) {
        if (!targetPath) return;
        const exists = appState.prefs.pinnedPaths.includes(targetPath);
        const next = exists
          ? appState.prefs.pinnedPaths.filter((p) => p !== targetPath)
          : [targetPath, ...appState.prefs.pinnedPaths].slice(0, 30);
        const ok = await persistPrefs({ pinnedPaths: next });
        if (ok) {
          showToast(exists ? '已从收藏夹移除' : '已添加到收藏夹');
        }
      }

      async function loadPreview(filePath, { force = false } = {}) {
        if (!filePath) return;
        if (appState.preview.editing && appState.preview.dirty && appState.preview.data?.path !== filePath && !force) {
          appState.preview.pendingSwitchPath = filePath;
          renderPreviewBanner();
          showToast('当前编辑尚未保存，请先保存或放弃修改', true);
          return;
        }
        if (!force && appState.preview.visible && appState.preview.data?.path === filePath && !appState.preview.editing) {
          if (appState.preview.collapsed) {
            appState.preview.collapsed = false;
            renderPreviewDrawer();
          }
          return;
        }

        const seq = ++appState.preview.seq;
        if (appState.preview.imgLastPath !== filePath) {
          appState.preview.imgLastPath = filePath;
          appState.preview.imgScaleMode = 'fit';
          appState.preview.imgPixelated = null;
        }
        appState.preview.visible = true;
        if (isFileTab(appState.activeTab) && appState.preview.userClosedInWideByTab) {
          appState.preview.userClosedInWideByTab[appState.activeTab] = false;
        }
        appState.preview.collapsed = false;
        appState.preview.loading = true;
        appState.preview.editing = false;
        appState.preview.dirty = false;
        appState.preview.conflictMsg = '';
        appState.preview.pendingSwitchPath = '';
        appState.preview.lineSelStart = 0;
        appState.preview.lineSelEnd = 0;
        renderPreviewDrawer();

        try {
          const res = await callServerTool('read_file_preview', { path: filePath });
          if (seq !== appState.preview.seq) return;
          appState.preview.loading = false;
          appState.preview.data = res || { ok: false, error: '无法读取文件内容', path: filePath };
          appState.preview.mdMode = 'preview';
          appState.preview.draft = typeof res?.text === 'string' ? res.text : '';
          renderPreviewDrawer();
        } catch (err) {
          if (seq !== appState.preview.seq) return;
          appState.preview.loading = false;
          appState.preview.data = { ok: false, error: err?.message || '预览加载失败', path: filePath };
          renderPreviewDrawer();
        }
      }

      async function saveEditedFile() {
        const prev = appState.preview.data;
        if (!appState.preview.editing || !prev?.path) return;
        try {
          const res = await callServerTool('save_file_content', {
            path: prev.path,
            content: appState.preview.draft,
            expectedMtimeMs: prev.mtimeMs,
            baseHash: prev.baseHash || ''
          });
          if (res && res.ok) {
            prev.text = appState.preview.draft;
            prev.mtimeMs = res.mtimeMs;
            if (typeof res.baseHash === 'string') {
              prev.baseHash = res.baseHash;
            }
            prev.size = res.size;
            prev.sizeText = res.sizeText;
            appState.preview.dirty = false;
            appState.preview.conflictMsg = '';
            showToast(`已保存（${res.sizeText}）`);
            // Update entry size in current directory listing if present
            const entry = appState.browse.entries.find((e) => e.path === prev.path);
            if (entry) {
              entry.size = res.size;
              entry.sizeText = res.sizeText;
              entry.mtimeMs = res.mtimeMs;
              renderBrowse();
            }
            const nextPath = appState.preview.pendingSwitchPath;
            if (nextPath) {
              appState.preview.editing = false;
              appState.preview.pendingSwitchPath = '';
              await loadPreview(nextPath, { force: true });
            } else {
              renderPreviewDrawer();
            }
            return true;
          }
          if (res?.conflict) {
            appState.preview.conflictMsg = res.error || '文件已在外部发生变更，请刷新后再保存';
            renderPreviewBanner();
            showToast(appState.preview.conflictMsg, true);
            return false;
          }
          showToast(res?.error || '保存失败', true);
          return false;
        } catch (err) {
          showToast(err?.message || '保存失败', true);
          return false;
        }
      }

      function getSelectedPreviewText() {
        if (appState.preview.editing) {
          const ta = $('editor-textarea');
          if (ta && typeof ta.selectionStart === 'number' && ta.selectionEnd > ta.selectionStart) {
            return ta.value.slice(ta.selectionStart, ta.selectionEnd);
          }
          return '';
        }
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed) return '';
        const anchorNode = sel.anchorNode;
        const focusNode = sel.focusNode;
        if (!anchorNode || !focusNode) return '';
        if (!previewBody.contains(anchorNode) || !previewBody.contains(focusNode)) return '';
        return sel.toString();
      }

      function getLineRangeSelection() {
        const s = Number(appState.preview.lineSelStart) || 0;
        const e = Number(appState.preview.lineSelEnd) || 0;
        if (s <= 0) return null;
        const start = e > 0 ? Math.min(s, e) : s;
        const end = e > 0 ? Math.max(s, e) : s;
        return { start, end };
      }

      async function handleQuoteSelection() {
        const prev = appState.preview.data;
        if (!prev?.path) return;
        const canAttach = Boolean(appState.hostCapabilities?.updateModelContext);
        const selected = getSelectedPreviewText().trim();
        if (selected) {
          const payload = `来自 @${prev.path} 的选段：\n\`\`\`\n${selected}\n\`\`\``;
          if (canAttach) {
            const ok = await attachContext(payload);
            if (ok) showToast('已引用选中文本到对话');
          } else {
            const ok = await copyTextSafe(payload);
            showToast(ok ? '已复制选中文本引用（Ctrl+V 粘贴给 AI）' : '复制失败', !ok);
          }
          return;
        }
        const range = getLineRangeSelection();
        if (range && typeof prev.text === 'string') {
          const lines = prev.text.split('\n');
          const start = Math.max(1, Math.min(lines.length, range.start));
          const end = Math.max(start, Math.min(lines.length, range.end));
          const refTag = start === end ? `@${prev.path}#L${start}` : `@${prev.path}#L${start}-L${end}`;
          const sliceText = lines.slice(start - 1, end).join('\n');
          const payload = `来自 ${refTag} 的代码片段：\n\`\`\`\n${sliceText}\n\`\`\``;
          if (canAttach) {
            const ok = await attachContext(payload);
            if (ok) showToast(`已引用 ${start === end ? `L${start}` : `L${start}-L${end}`} 到对话`);
          } else {
            const ok = await copyTextSafe(refTag);
            showToast(ok ? `已复制行段引用 ${refTag}` : '复制失败', !ok);
          }
          return;
        }
        if (canAttach) {
          const ok = await attachContext(`@${prev.path}`);
          if (ok) showToast('已引用文件路径到对话');
        } else {
          const ok = await copyTextSafe(`@${prev.path}`);
          showToast(ok ? `已复制 @${prev.path}` : '复制失败', !ok);
        }
      }

      function syncPreviewOnTabChange() {
        const pv = appState.preview;
        if (!shouldShowRightInspectorPane()) {
          previewDrawer.hidden = true;
          syncWorkspaceSplitLayout();
          return;
        }
        if (pv.needsDeferredRender || !pv.visible) {
          renderPreviewDrawer({ preserveFocus: true });
          return;
        }
        previewDrawer.hidden = false;
        syncWorkspaceSplitLayout();
        renderPreviewHeaderOnly();
        renderPreviewBanner();
      }

      function switchTab(tab, { persist = false, fromExternal = false } = {}) {
        if (!VALID_TABS.includes(tab)) return;
        closeOpenWithMenu();
        appState.activeTab = tab;
        if (!fromExternal && persist) {
          navigationIntent = { tab, source: 'user', priority: 80, expiresAt: 0 };
        }
        if (persist && RESTORABLE_TABS.includes(tab) && appState.prefs.lastTab !== tab) {
          appState.prefs.lastTab = tab;
          if (appState.initialized) {
            callServerTool('update_state', { lastTab: tab }).catch(() => {});
          }
        }
        let activeBtn = null;
        for (const btn of tabBtns) {
          const active = btn.dataset.tab === tab;
          btn.classList.toggle('is-active', active);
          btn.setAttribute('aria-selected', active ? 'true' : 'false');
          if (active) activeBtn = btn;
        }
        if (activeBtn && typeof activeBtn.scrollIntoView === 'function') {
          const prefersReduced = Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          try {
            activeBtn.scrollIntoView({ behavior: prefersReduced ? 'auto' : 'smooth', block: 'nearest', inline: 'nearest' });
          } catch {
            activeBtn.scrollIntoView();
          }
        }
        for (const [k, panel] of Object.entries(tabPanels)) {
          panel.classList.toggle('is-active', k === tab);
        }
        renderTopbar();
        syncPreviewOnTabChange();
        if (tab !== 'accounts' && quotaWaitRetryTimer) {
          clearTimeout(quotaWaitRetryTimer);
          quotaWaitRetryTimer = 0;
        }
        if (tab !== 'cua' && cuaLeaseTimer) {
          clearInterval(cuaLeaseTimer);
          cuaLeaseTimer = 0;
        }
        if (tab === 'artifacts' && !appState.artifacts.loaded && !appState.artifacts.loading) {
          loadArtifacts();
        } else if (tab === 'pins' && !appState.pins.loaded && !appState.pins.loading) {
          loadPins();
        } else if (tab === 'search') {
          renderSearch();
          searchInput.focus();
        } else if (tab === 'models' && !appState.models.loaded && !appState.models.loading) {
          loadModelsTab();
        } else if (tab === 'accounts' && !appState.accounts.loaded && !appState.accounts.loading) {
          loadAccountsTab({ forceRefresh: false });
        } else if (tab === 'cua') {
          if (!appState.cua.loaded && !appState.cua.loading) {
            loadCuaTab();
          } else {
            syncCuaLeaseCountdownTimer();
            renderCua();
          }
        }
      }

      function buildBreadcrumbSegments(rawDir) {
        const dir = String(rawDir || '').trim();
        if (!dir) return [];
        const isUnc = dir.startsWith('\\\\') || dir.startsWith('//');
        if (isUnc) {
          const clean = dir.replace(/\//g, '\\').replace(/^\\+/, '');
          const parts = clean.split('\\').filter(Boolean);
          if (!parts.length) return [];
          const segs = [];
          if (parts.length >= 2) {
            let acc = `\\\\${parts[0]}\\${parts[1]}`;
            segs.push({ label: acc, path: acc });
            for (let i = 2; i < parts.length; i++) {
              acc = `${acc}\\${parts[i]}`;
              segs.push({ label: parts[i], path: acc });
            }
          } else {
            segs.push({ label: `\\\\${parts[0]}`, path: `\\\\${parts[0]}` });
          }
          return segs;
        }
        const winMatch = dir.match(/^([A-Za-z]:)(?:[\\/](.*))?$/);
        if (winMatch) {
          const drive = `${winMatch[1].toUpperCase()}\\`;
          const segs = [{ label: drive, path: drive }];
          const rest = (winMatch[2] || '').split(/[\\/]+/).filter(Boolean);
          let acc = drive;
          for (const part of rest) {
            acc = acc.endsWith('\\') ? `${acc}${part}` : `${acc}\\${part}`;
            segs.push({ label: part, path: acc });
          }
          return segs;
        }
        const segs = [{ label: '/', path: '/' }];
        const rest = dir.split('/').filter(Boolean);
        let acc = '';
        for (const part of rest) {
          acc += `/${part}`;
          segs.push({ label: part, path: acc });
        }
        return segs;
      }

          return;

        // Keep breadcrumb compact on narrow widths while still preserving root + recent parent segments
        const displaySegs = segs.length > 5
          ? [segs[0], { label: '…', path: segs[segs.length - 4].path, isEllipsis: true }, ...segs.slice(-3)]
          : segs;
        const html = displaySegs.map((s, idx) => {
          const isLast = idx === displaySegs.length - 1;
          const sep = idx > 0 ? '<span class="crumb-sep" aria-hidden="true">›</span>' : '';
          return `${sep}<button type="button" class="crumb-btn${isLast ? ' is-last' : ''}" data-crumb-path="${escapeHtml(s.path)}" title="${escapeHtml(s.path)}">${escapeHtml(s.label)}</button>`;

      function applyActiveImagePreviewMode() {
        const pv = appState.preview;
        const stage = previewBody.querySelector('.image-stage');
        if (!stage) return;
        const canvas = stage.querySelector('.image-canvas');
        const img = stage.querySelector('img');
        if (!canvas || !img) return;

        const isActual = pv.imgScaleMode === '1:1';
        const isPix = Boolean(pv.imgPixelated);
        canvas.classList.toggle('is-actual', isActual);
        img.classList.toggle('is-pixelated', isPix);

        if (isActual && img.naturalWidth > 0 && img.naturalHeight > 0) {
          const dpr = window.devicePixelRatio || 1;
          img.style.width = `${Math.max(1, Math.round(img.naturalWidth / dpr))}px`;
          img.style.height = `${Math.max(1, Math.round(img.naturalHeight / dpr))}px`;
        } else {
          img.style.width = '';
          img.style.height = '';
        }

        const fitBtn = stage.querySelector('button[data-img-mode="fit"]');
        const actBtn = stage.querySelector('button[data-img-mode="1:1"]');
        const pixBtn = stage.querySelector('button[data-img-action="pixel"]');
        if (fitBtn) fitBtn.classList.toggle('is-active', !isActual);
        if (actBtn) actBtn.classList.toggle('is-active', isActual);
        if (pixBtn) {
          pixBtn.classList.toggle('is-active', isPix);
          pixBtn.setAttribute('aria-pressed', isPix ? 'true' : 'false');
        }

      function renderPreviewDrawer({ preserveFocus = false } = {}) {
        const pv = appState.preview;
        const showPane = shouldShowRightInspectorPane();
        previewDrawer.hidden = !showPane;
        syncWorkspaceSplitLayout();
        if (!showPane) {
          pv.needsDeferredRender = Boolean(pv.visible);
          return;
        }
        pv.needsDeferredRender = false;

        renderPreviewHeaderOnly();
        renderPreviewBanner();

        if (!pv.visible) {
          renderInspectorOverviewBody();
          return;
        }

        if (pv.loading) {
          previewBody.innerHTML = '<div class="preview-placeholder">正在读取文件内容…</div>';
          return;
        }

        const data = pv.data;
        if (!data || data.ok === false) {
          previewBody.innerHTML =
            `<div class="preview-placeholder">` +
              `<span>${escapeHtml(data?.error || '无法预览该文件')}</span>` +
              (data?.path ? `<div class="placeholder-actions"><button type="button" class="ctrl-btn" data-placeholder-action="reveal">定位系统目录</button></div>` : '') +
            `</div>`;
          return;
        }

        if (pv.editing) {
          const existingTa = $('editor-textarea');
          if (existingTa && previewBody.contains(existingTa) && existingTa.dataset.filePath === String(data.path || '')) {
            if (existingTa.value !== pv.draft) {
              const selS = existingTa.selectionStart;
              const selE = existingTa.selectionEnd;
              const scTop = existingTa.scrollTop;
              existingTa.value = pv.draft;
              try {
                existingTa.setSelectionRange(selS, selE);
                existingTa.scrollTop = scTop;
              } catch {}
            }
            if (!preserveFocus && document.activeElement !== existingTa) existingTa.focus();
            return;
          }
          previewBody.innerHTML = '';
          const ta = document.createElement('textarea');
          ta.id = 'editor-textarea';
          ta.className = 'editor-textarea';
          ta.dataset.filePath = String(data.path || '');
          ta.spellcheck = false;
          ta.value = pv.draft;
          ta.addEventListener('input', () => {
            pv.draft = ta.value;
            const nextDirty = pv.draft !== (pv.data?.text || '');
            if (nextDirty !== pv.dirty) {
              pv.dirty = nextDirty;
              renderPreviewHeaderOnly();
            }
          });
          previewBody.appendChild(ta);
          if (!preserveFocus) ta.focus();
          return;
        }

        if (data.previewType === 'image') {
          const validDataUrl = typeof data.dataUrl === 'string' && /^data:image\/[a-z0-9.+-]+;base64,/i.test(data.dataUrl);
          if (!validDataUrl) {
            previewBody.innerHTML = '<div class="preview-placeholder">图片数据格式无效，无法渲染</div>';
            return;
          }
          previewBody.innerHTML = '';
          const stage = document.createElement('div');
          stage.className = 'image-stage';
          const canvas = document.createElement('div');
          canvas.className = 'image-canvas';
          const img = document.createElement('img');
          img.alt = data.name || '图片预览';

          const hud = document.createElement('div');
          hud.className = 'image-hud';
          const meta = document.createElement('div');
          meta.className = 'image-meta';
          meta.textContent = `${data.mime || 'image'} · ${data.sizeText || ''}`;

          const modeBar = document.createElement('div');
          modeBar.className = 'seg-toggle image-mode-bar';
          modeBar.setAttribute('role', 'group');
          modeBar.setAttribute('aria-label', '图片预览缩放与清晰度模式');
          modeBar.innerHTML =
            '<button type="button" class="seg-btn" data-img-mode="fit" title="完整适应预览视口">适应</button>' +
            '<button type="button" class="seg-btn" data-img-mode="1:1" title="按设备物理像素 1:1 原寸还原（可自由滚动查看高清细节）">1:1</button>' +
            '<span class="seg-sep" aria-hidden="true"></span>' +
            '<button type="button" class="seg-btn" data-img-action="pixel" aria-pressed="false" title="切换像素锐化渲染（小尺寸图标/像素画自动开启）">像素</button>';

          img.addEventListener('load', () => {
            if (pv.imgPixelated === null) {
              pv.imgPixelated = img.naturalWidth > 0 && img.naturalHeight > 0 && img.naturalWidth <= 128 && img.naturalHeight <= 128;
            }
            meta.textContent = `${img.naturalWidth} × ${img.naturalHeight} px · ${data.mime || 'image'} · ${data.sizeText || ''}`;
            applyActiveImagePreviewMode();
          });
          img.addEventListener('error', () => {
            meta.textContent = '图片解码失败';
          });
          img.src = data.dataUrl;
          canvas.appendChild(img);
          hud.appendChild(meta);
          hud.appendChild(modeBar);
          stage.appendChild(canvas);
          stage.appendChild(hud);
          previewBody.appendChild(stage);
          applyActiveImagePreviewMode();
          return;
        }

        if (data.previewType === 'protected') {
          previewBody.innerHTML =
            '<div class="preview-placeholder">' +
              '<span>受保护凭据文件，工作台已禁止预览与编辑</span>' +
              '<div class="placeholder-actions">' +
                '<button type="button" class="ctrl-btn" data-placeholder-action="reveal">在系统目录中定位</button>' +
              '</div>' +
            '</div>';
          return;
        }

        if (data.previewType === 'too_large' || data.previewType === 'binary') {
          const msg = data.previewType === 'too_large'
            ? `图片或文件过大（${data.sizeText}），超出工作台内联预览上限`
            : `二进制文件，不支持文本预览（${data.sizeText}）`;
          const canOpen = Boolean(data.uri && !appState.nativeTabUnsupported);
          previewBody.innerHTML =
            `<div class="preview-placeholder">` +
              `<span>${escapeHtml(msg)}</span>` +
              `<div class="placeholder-actions">` +
                (canOpen ? '<button type="button" class="ctrl-btn is-primary" data-placeholder-action="open">在原生标签页打开</button>' : '') +
                '<button type="button" class="ctrl-btn" data-placeholder-action="reveal">在系统目录中定位</button>' +
              `</div>` +
            `</div>`;
          return;
        }

        if (data.previewType === 'markdown' && pv.mdMode === 'preview') {
          previewBody.innerHTML = `<article class="md-view">${renderMarkdownToHtml(data.text || '')}</article>`;
          return;
        }

        // Source / plain text view with clickable line numbers (click line, Shift+click range -> @path#L10-L25)
        const text = String(data.text ?? '');
        const lineCount = text === '' ? 1 : text.split('\n').length;
        const range = getLineRangeSelection();
        const nums = [];
        for (let n = 1; n <= lineCount; n++) {
          const isSel = Boolean(range && n >= range.start && n <= range.end);
          nums.push(`<span class="code-ln${isSel ? ' is-selected' : ''}" data-line="${n}" title="点击选中行号（Shift+点击选区间）">${n}</span>`);
        }
        previewBody.innerHTML =
          `<div class="code-view">` +
            `<div class="code-gutter" aria-label="代码行号（点击或 Shift+点击选中引用区间）">${nums.join('')}</div>` +
            `<pre class="code-content"><code>${escapeHtml(text)}</code></pre>` +
          `</div>`;
      }

      async function loadModelsTab({ silent = false } = {}) {

        if (!silent) {
          appState.models.loading = true;
          appState.models.error = '';
          setTopProgress(true);
          if (!appState.models.data) renderModels();

        try {
          const prof = await callServerTool('model_hub_get_profile', {});
          if (seq !== appState.models.seq) return;
          appState.models.data = prof || null;
          appState.models.loaded = true;
          appState.models.loading = false;
          if (prof?.remoteSync) appState.accounts.remoteSync = prof.remoteSync;
          if (prof?.memoryStorage) appState.accounts.memoryStorage = prof.memoryStorage;
          if (!silent) setTopProgress(false);
        } catch (err) {
          if (seq !== appState.models.seq) return;
          appState.models.loading = false;
          if (!silent) {
            setTopProgress(false);
            appState.models.error = err?.message || '读取模型中枢配置失败';

        renderModels();
